name: CopyBox Android native guest acceptance

# An isolated operations branch triggers this once when these files are pushed.
# There is no dispatch, pull-request, signing, publishing, or account integration.
on:
  push:
    branches:
      - ops/copybox-android-acceptance-20261114
    paths:
      - .github/workflows/copybox-android-native-acceptance.yml
      - apps/korlix_copy_box/integration_test/native_guest_acceptance_test.dart
      - scripts/ci/run_copybox_native_acceptance.py

permissions:
  contents: read

concurrency:
  group: copybox-android-native-acceptance-${{ github.ref }}
  cancel-in-progress: true

env:
  CI: 'true'
  FLUTTER_SUPPRESS_ANALYTICS: 'true'
  DART_SUPPRESS_ANALYTICS: 'true'

jobs:
  android-guest:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      # These four action revisions match the existing CopyBox validation workflow.
      - name: Check out the acceptance harness
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          path: acceptance-harness
          persist-credentials: false

      - name: Check out the exact app source already built for submission
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: 59fb45c3dd7a85f9e2576930b9f2bdb5360019be
          path: release-source
          persist-credentials: false

      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          flutter-version: '3.47.7'
          channel: stable
          cache: true

      - name: Add only the test overlay to the exact source checkout
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import os
          from pathlib import Path
          import shutil
          import subprocess

          root = Path(os.environ['GITHUB_WORKSPACE'])
          release = root / 'release-source'
          actual = subprocess.check_output(['git', 'rev-parse', 'HEAD'], cwd=release, text=True).strip()
          assert actual == '59fb45c3dd7a85f9e2576930b9f2bdb5360019be'
          for relative in (
              'apps/korlix_copy_box/integration_test/native_guest_acceptance_test.dart',
              'scripts/ci/run_copybox_native_acceptance.py',
          ):
              destination = release / relative
              destination.parent.mkdir(parents=True, exist_ok=True)
              shutil.copyfile(root / 'acceptance-harness' / relative, destination)
          PY

      - name: Prepare the disposable accelerated Android emulator
        shell: bash
        run: |
          set -euo pipefail
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
          python3 - <<'PY'
          import os
          from pathlib import Path
          import subprocess

          sdk = Path(os.environ['ANDROID_HOME'])
          subprocess.run([
              str(sdk / 'cmdline-tools/latest/bin/sdkmanager'),
              'emulator', 'platform-tools',
              'system-images;android-36;google_apis_playstore;x86_64',
          ], input='n\n', text=True, check=True, timeout=900)
          subprocess.run([str(sdk / 'emulator/emulator'), '-accel-check'], check=True, timeout=30)
          PY

      - name: Run the native guest flow and restore it in a new process
        working-directory: release-source
        run: python3 scripts/ci/run_copybox_native_acceptance.py android

      - name: Keep the guest acceptance evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: copybox-android-native-acceptance
          path: release-source/apps/korlix_copy_box/artifacts/native-acceptance
          if-no-files-found: warn
          retention-days: 7

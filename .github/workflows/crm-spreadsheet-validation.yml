name: CRM spreadsheet mobile and web validation
on:
  workflow_dispatch:
  push:
    branches: [feature/crm-spreadsheet-import-20261030]
    paths:
      - lib/contacts_crm/**
      - test/contacts_crm/**
      - test/live_convo/crm_voice_lifecycle_test.dart
      - .github/workflows/crm-spreadsheet-validation.yml
permissions:
  contents: read
concurrency:
  group: crm-spreadsheet-${{ github.ref }}
  cancel-in-progress: true
env:
  CI: 'true'
  FLUTTER_SUPPRESS_ANALYTICS: 'true'
  DART_SUPPRESS_ANALYTICS: 'true'
jobs:
  validate-and-build:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - name: Block instance metadata before toolchain setup
        run: |
          set -euo pipefail
          for network in 169.254.0.0/16 100.100.100.200/32; do
            sudo iptables -I OUTPUT 1 -d "$network" -j REJECT
          done
          for network in fe80::/10 fd00:ec2::254/128; do
            sudo ip6tables -I OUTPUT 1 -d "$network" -j REJECT
          done
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2
        with:
          flutter-version: '3.47.7'
          channel: stable
          cache: true
      - name: Install pinned dependencies
        run: flutter pub get --enforce-lockfile
      - name: Analyze CRM changes
        run: flutter analyze --no-pub lib/contacts_crm/contact_import.dart lib/contacts_crm/contacts_client.dart lib/contacts_crm/contacts_screen.dart lib/contacts_crm/contacts_style.dart test/contacts_crm/spreadsheet_import_test.dart test/live_convo/crm_voice_lifecycle_test.dart
      - name: Validate imports and existing CRM flows
        run: flutter test --no-pub --reporter expanded test/contacts_crm test/live_convo/crm_voice_lifecycle_test.dart
      - name: Build web application
        run: flutter build web --release --no-pub
      - name: Build Android candidate
        run: flutter build apk --debug --no-pub
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: korlix-crm-validation-builds
          path: |
            build/web
            build/app/outputs/flutter-apk/app-debug.apk
          if-no-files-found: error
          retention-days: 14

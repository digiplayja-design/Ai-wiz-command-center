name: Esha native validation

on:
  workflow_dispatch:
  push:
    paths:
      - 'apps/esha/**'
      - 'scripts/esha/**'
      - 'backend/esha/**'
      - 'backend/test/esha*.mjs'
      - 'backend/package.json'
      - 'backend/package-lock.json'
      - 'backend/server.js'
      - 'backend/korlix_astra.cjs'
      - 'backend/chat_quality.cjs'
      - 'backend/resume_studio/policy.mjs'
      - 'supabase/migrations/*_esha_*.sql'
      - '.github/workflows/esha-native.yml'
      - 'codemagic.yaml'
  pull_request:
    paths:
      - 'apps/esha/**'
      - 'scripts/esha/**'
      - 'backend/esha/**'
      - 'backend/test/esha*.mjs'
      - 'backend/package.json'
      - 'backend/package-lock.json'
      - 'backend/server.js'
      - 'backend/korlix_astra.cjs'
      - 'backend/chat_quality.cjs'
      - 'backend/resume_studio/policy.mjs'
      - 'supabase/migrations/*_esha_*.sql'
      - '.github/workflows/esha-native.yml'
      - 'codemagic.yaml'

permissions:
  contents: read

concurrency:
  group: esha-native-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  FLUTTER_VERSION: '3.47.9'
  FLUTTER_SUPPRESS_ANALYTICS: 'true'
  CI: 'true'

jobs:
  backend:
    name: Esha backend and SQL checks
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    defaults:
      run:
        working-directory: backend
    steps:
      - name: Check out Esha source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Set up Node 22
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - name: Install locked backend dependencies without lifecycle scripts
        run: npm ci --ignore-scripts
      - name: Verify Esha policy, voice lifecycle, and SQL accounting
        run: |
          node --check server.js
          node --test test/esha*.test.mjs

  android:
    name: Analyze, test, and compile Android
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Check out Esha source
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Set up the pinned Flutter SDK
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true
      - name: Validate Esha source and behavior
        run: bash scripts/esha/validate.sh
      - name: Compile debug APK and unsigned release AAB
        run: bash scripts/esha/build_android.sh unsigned
      - name: Save verified Android test artifacts
        uses: actions/upload-artifact@v4
        with:
          name: Esha-Android-debug-and-unsigned-${{ github.sha }}
          path: apps/esha/artifacts/android/*
          if-no-files-found: error
          retention-days: 14

  ios-simulator:
    name: Compile iOS Simulator application
    runs-on: macos-latest
    timeout-minutes: 45
    steps:
      - name: Check out Esha source
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Set up the pinned Flutter SDK
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true
      - name: Verify source identity and locked dependencies
        run: |
          python3 scripts/esha/check_source.py
          cd apps/esha
          flutter --suppress-analytics --no-version-check pub get --enforce-lockfile
      - name: Compile and verify the simulator application
        run: bash scripts/esha/build_ios_simulator.sh
      - name: Save simulator-only test artifacts
        uses: actions/upload-artifact@v4
        with:
          name: Esha-iOS-Simulator-only-${{ github.sha }}
          path: apps/esha/artifacts/ios/*
          if-no-files-found: error
          retention-days: 14

# This workflow has no release credentials, store uploads, or subscription
# provisioning. Signed candidates use the separate manual Codemagic workflows.

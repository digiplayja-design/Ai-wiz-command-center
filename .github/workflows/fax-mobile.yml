name: Fax by Korlix mobile builds

on:
  push:
    branches: [feature/fax-mobile-20261125]
    paths:
      - 'apps/fax/**'
      - 'website/fax-number/**'
      - 'supabase/functions/korlix-fax/**'
      - '.github/workflows/fax-mobile.yml'
  workflow_dispatch:

permissions:
  contents: read

defaults:
  run:
    working-directory: apps/fax
    shell: bash

jobs:
  android:
    name: Android APK and Play bundle
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Test company mailbox and package mobile assets
        run: |
          node --test ../../backend/test/fax*.test.mjs
          npm ci
          npm run web
          npx cap sync android
      - name: Build APK and Android App Bundle
        working-directory: apps/fax/android
        run: ./gradlew --no-daemon :app:assembleDebug :app:bundleRelease
      - name: Verify and collect packages
        run: |
          mkdir -p artifacts
          cp android/app/build/outputs/apk/debug/app-debug.apk artifacts/Fax-by-Korlix-debug.apk
          cp android/app/build/outputs/bundle/release/app-release.aab artifacts/Fax-by-Korlix-unsigned.aab
          unzip -tq artifacts/Fax-by-Korlix-unsigned.aab
          unzip -p artifacts/Fax-by-Korlix-unsigned.aab base/assets/public/fax-mobile.js > /dev/null
          "$ANDROID_HOME/cmdline-tools/latest/bin/apkanalyzer" manifest application-id artifacts/Fax-by-Korlix-debug.apk | grep -Fx com.korlixdeveloper.fax
      - uses: actions/upload-artifact@v4
        with:
          name: Fax-by-Korlix-Android
          path: apps/fax/artifacts/*
          if-no-files-found: error

  ios:
    name: iPhone simulator and device archive
    runs-on: macos-26
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Prepare native iOS project
        run: |
          npm ci
          npm run web
          npx cap sync ios
          xcodebuild -version
      - name: Compile and verify iOS device archive
        run: |
          set -o pipefail
          mkdir -p artifacts
          archive="$RUNNER_TEMP/Fax.xcarchive"
          xcodebuild -quiet -project ios/App/App.xcodeproj -scheme App -configuration Release -destination 'generic/platform=iOS' -archivePath "$archive" CODE_SIGNING_ALLOWED=NO archive
          app="$archive/Products/Applications/App.app"
          test "$(/usr/libexec/PlistBuddy -c 'Print :CFBundleIdentifier' "$app/Info.plist")" = com.korlixdeveloper.fax
          test -s "$app/public/fax-mobile.js"
          test -s "$app/PrivacyInfo.xcprivacy"
          ditto -c -k --keepParent "$archive" artifacts/Fax-by-Korlix-unsigned.xcarchive.zip
      - name: Run on an iPhone simulator
        run: |
          sim_id=$(xcrun simctl list devices available --json | python3 -c 'import json,sys; devices=json.load(sys.stdin)["devices"]; print(next(d["udid"] for k in sorted(devices,reverse=True) if ".iOS-" in k for d in devices[k] if d["name"].startswith("iPhone")))')
          xcrun simctl boot "$sim_id"
          xcodebuild -quiet -project ios/App/App.xcodeproj -scheme App -configuration Debug -destination "id=$sim_id" -derivedDataPath "$RUNNER_TEMP/fax-simulator" CODE_SIGNING_ALLOWED=NO build
          xcrun simctl bootstatus "$sim_id" -b
          app="$RUNNER_TEMP/fax-simulator/Build/Products/Debug-iphonesimulator/App.app"
          xcrun simctl install "$sim_id" "$app"
          xcrun simctl launch "$sim_id" com.korlixdeveloper.fax
          sleep 5
          xcrun simctl spawn "$sim_id" launchctl list | grep com.korlixdeveloper.fax
          xcrun simctl io "$sim_id" screenshot artifacts/Fax-by-Korlix-iPhone.png
          ditto -c -k --keepParent "$app" artifacts/Fax-by-Korlix-simulator.zip
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: Fax-by-Korlix-iOS
          path: apps/fax/artifacts/*
          if-no-files-found: error

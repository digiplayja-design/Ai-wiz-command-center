name: KORLIX Brain+Voice mobile validation
on:
  workflow_dispatch:
  pull_request:
    branches: [release/korlix-brain-store-20261101]
    paths:
      - apps/korlix_brain/**
      - packages/korlix_receipt_core/**
      - .github/workflows/korlix-brain-validation.yml
  push:
    branches: [feature/korlix-brain-voice-20261031, feature/brain-projection-20261107]
    paths:
      - apps/korlix_brain/**
      - packages/korlix_receipt_core/**
      - .github/workflows/korlix-brain-validation.yml
      - scripts/prepare_brain_ios.py
      - scripts/prepare_ios_release.py
      - scripts/verify_ios_ipa.py
      - scripts/tests/test_*ios_release.py
      - codemagic.yaml
permissions:
  contents: read
concurrency:
  group: korlix-brain-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true
env:
  BOT: 'true'
  CI: 'true'
  FLUTTER_SUPPRESS_ANALYTICS: 'true'
  DART_SUPPRESS_ANALYTICS: 'true'
  COCOAPODS_DISABLE_STATS: 'true'
jobs:
  projection-ui:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            playwright: 1.56.1
            artifact: korlix-brain-projection-screenshots
          - os: macos-26
            playwright: 1.62.1
            artifact: korlix-brain-projection-screenshots-macos
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Install isolated browser test dependencies
        run: |
          npm install --prefix "$RUNNER_TEMP/projection-browser" --no-audit --no-fund playwright@${{ matrix.playwright }}
          "$RUNNER_TEMP/projection-browser/node_modules/.bin/playwright" install --with-deps chromium
      - name: Check responsive Projection and original home interactions
        env:
          PROJECTION_SCREENSHOTS: projection-screenshots
        run: |
          export NODE_PATH="$RUNNER_TEMP/projection-browser/node_modules"
          node apps/korlix_brain/tools/check_projection.cjs
          node apps/korlix_brain/tools/check_ui.cjs
          node apps/korlix_brain/tools/check_controls.cjs
          node apps/korlix_brain/tools/check_voice_status.cjs
          node apps/korlix_brain/tools/check_ambience.cjs
          node apps/korlix_brain/tools/check_welcome.cjs
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: ${{ matrix.artifact }}
          path: projection-screenshots
          if-no-files-found: warn
          retention-days: 14
  release-identity:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Verify Apple identity and build numbering safeguards
        run: python3 -m unittest discover -s scripts/tests -p 'test_*ios_release.py' -v
  android:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2
        with:
          flutter-version: '3.47.9'
          channel: stable
          cache: true
      - name: Validate account and memory behavior
        working-directory: apps/korlix_brain
        run: |
          flutter pub get --enforce-lockfile
          flutter analyze --no-pub
          flutter test --no-pub --reporter expanded
      - name: Build Android test APK
        working-directory: apps/korlix_brain
        run: flutter build apk --debug --no-pub
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: korlix-brain-voice-android-debug
          path: apps/korlix_brain/build/app/outputs/flutter-apk/app-debug.apk
          if-no-files-found: error
          retention-days: 14
  ios:
    runs-on: macos-26
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2
        with:
          flutter-version: '3.47.9'
          channel: stable
          cache: true
      - name: Build iOS simulator app
        working-directory: apps/korlix_brain
        run: |
          flutter pub get --enforce-lockfile
          flutter build ios --simulator --debug --no-pub
          cd build/ios/iphonesimulator
          ditto -c -k --sequesterRsrc --keepParent Runner.app BrainVoice-Simulator.zip
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: korlix-brain-voice-ios-simulator
          path: apps/korlix_brain/build/ios/iphonesimulator/BrainVoice-Simulator.zip
          if-no-files-found: error
          retention-days: 14
      - name: Compile iPhone release binary
        working-directory: apps/korlix_brain
        run: |
          flutter build ios --release --no-codesign --no-pub
          python3 - <<'PY'
          import plistlib, subprocess
          from pathlib import Path
          app = Path('build/ios/iphoneos/Runner.app')
          info = plistlib.loads((app / 'Info.plist').read_bytes())
          assert info['CFBundleIdentifier'] == 'com.korlix.brain'
          assert info['CFBundleSupportedPlatforms'] == ['iPhoneOS']
          binary = app / info['CFBundleExecutable']
          assert 'arm64' in subprocess.check_output(['lipo', '-archs', str(binary)], text=True).split()
          print('Verified com.korlix.brain iPhoneOS arm64 release compilation. Signing is handled in Codemagic.')
          PY
  ios-runtime:
    runs-on: macos-26-intel
    timeout-minutes: 35
    steps:
      - name: Record native runtime time budget
        timeout-minutes: 1
        run: |
          python3 - <<'PY'
          import json, os, time
          started = time.time()
          # 13 minutes of setup + an 18-minute native step leaves four minutes
          # from this first-step marker for artifacts within the 35-minute job.
          # Runner initialization before this marker also consumes job time.
          deadline = started + 13 * 60
          with open(os.environ['GITHUB_ENV'], 'a') as output:
              output.write(f'BRAIN_RUNTIME_PROBE_STARTED_EPOCH={started!r}\n')
              output.write(f'BRAIN_RUNTIME_PROBE_START_DEADLINE={deadline!r}\n')
          print('Native runtime time budget:', json.dumps({
              'startedEpoch': started, 'exerciseStartDeadlineEpoch': deadline,
              'maximumSetupMinutes': 13, 'nativeExerciseCapMinutes': 18,
              'artifactReserveMinutesFromMarker': 4, 'jobTimeoutMinutes': 35}), flush=True)
          PY
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2
        with:
          flutter-version: '3.47.9'
          channel: stable
          cache: true
      - name: Prepare simulator runtime caches
        timeout-minutes: 13
        run: |
          python3 - <<'PY'
          import json, os, subprocess
          from pathlib import Path
          artifacts = Path('apps/korlix_brain/runtime-screenshots')
          artifacts.mkdir(parents=True, exist_ok=True)
          report = {'cacheCompleted': False, 'commands': []}
          status_file = artifacts / 'simulator-cache-preparation.json'
          def as_text(value):
              return value.decode(errors='replace') if isinstance(value, bytes) else (value or '')
          def run_step(name, command, timeout=30):
              record = {'name': name, 'command': command, 'timeoutSeconds': timeout,
                        'exitCode': None, 'timedOut': False,
                        'stdoutFile': name + '.stdout.log', 'stderrFile': name + '.stderr.log'}
              stdout, stderr = '', ''
              print('Running simulator prerequisite:', ' '.join(command), flush=True)
              try:
                  result = subprocess.run(command, text=True, stdout=subprocess.PIPE,
                                          stderr=subprocess.PIPE, timeout=timeout)
                  record['exitCode'] = result.returncode
                  stdout, stderr = result.stdout, result.stderr
              except subprocess.TimeoutExpired as error:
                  record['timedOut'] = True
                  stdout, stderr = as_text(error.stdout), as_text(error.stderr)
              except OSError as error:
                  record['error'] = str(error)
                  stderr = str(error)
              finally:
                  (artifacts / record['stdoutFile']).write_text(stdout)
                  (artifacts / record['stderrFile']).write_text(stderr)
                  report['commands'].append(record)
                  status_file.write_text(json.dumps(report, indent=2) + '\n')
                  print(stdout, end='', flush=True)
                  print(stderr, end='', flush=True)
                  print('Simulator prerequisite status:', json.dumps(record), flush=True)
              if record['timedOut'] or record['exitCode'] != 0:
                  raise SystemExit(f'Simulator prerequisite {name} failed; see captured output and status')
          run_step('xcode-version', ['xcodebuild', '-version'])
          run_step('host-architecture', ['uname', '-m'])
          host_architecture = (artifacts / 'host-architecture.stdout.log').read_text().strip()
          host = {'architecture': host_architecture, 'requiredArchitecture': 'x86_64',
                  'runnerEnvironment': {name: os.environ.get(name) for name in
                      ['RUNNER_ARCH', 'RUNNER_OS', 'RUNNER_ENVIRONMENT', 'ImageOS', 'ImageVersion']}}
          (artifacts / 'simulator-host.json').write_text(json.dumps(host, indent=2) + '\n')
          report['host'] = host
          status_file.write_text(json.dumps(report, indent=2) + '\n')
          if host_architecture != 'x86_64':
              raise SystemExit('Intel fallback requires an observed x86_64 host; refusing simulator setup')
          run_step('host-os', ['sw_vers'])
          run_step('simctl-runtime-help', ['xcrun', 'simctl', 'help', 'runtime'])
          # Apple Xcode 26.4 release notes, issue 170836966, document this
          # completion command. Its use does not diagnose our migration failure.
          run_step('dyld-shared-cache-update',
                   ['xcrun', 'simctl', 'runtime', 'dyld_shared_cache', 'update', '--all'],
                   timeout=600)
          report['cacheCompleted'] = True
          status_file.write_text(json.dumps(report, indent=2) + '\n')
          PY
      - name: Prepare an available iPhone simulator
        run: |
          defaults write com.apple.iphonesimulator ConnectHardwareKeyboard -bool false
          python3 - <<'PY'
          import json, os, re, subprocess, uuid
          from pathlib import Path
          artifacts = Path('apps/korlix_brain/runtime-screenshots')
          artifacts.mkdir(parents=True, exist_ok=True)
          def simctl(*args, timeout=60):
              return subprocess.check_output(['xcrun', 'simctl', *args], text=True,
                                             stderr=subprocess.STDOUT, timeout=timeout)
          data = json.loads(simctl('list', '-j'))
          (artifacts / 'simulator-inventory.json').write_text(json.dumps(data, indent=2) + '\n')
          runtimes = {r['identifier']: r for r in data['runtimes']
                      if r.get('isAvailable') and '.iOS-' in r['identifier']
                      and r.get('version') == '26.2'
                      and isinstance(r.get('supportedArchitectures'), list)
                      and 'x86_64' in r['supportedArchitectures']}
          if not runtimes:
              raise SystemExit('Required available iOS 26.2 runtime with x86_64 support is absent')
          types = {t['identifier']: t for t in data['devicetypes']
                   if t['name'].startswith('iPhone')}
          # Use only runtime/type pairs present in the available device inventory.
          candidates = {(runtime, device['deviceTypeIdentifier'])
                        for runtime, devices in data['devices'].items() if runtime in runtimes
                        for device in devices if device.get('isAvailable') and
                        device.get('deviceTypeIdentifier') in types}
          if not candidates:
              raise SystemExit('No listed available iPhone device-type pair for iOS 26.2 supporting x86_64')
          candidates = sorted(candidates, reverse=True, key=lambda pair: (
              tuple(int(n) for n in re.findall(r'\d+', runtimes[pair[0]]['version'])),
              types[pair[1]]['name']))
          primary = candidates[0]
          replacement = next((pair for pair in candidates if pair[0] != primary[0]), primary)
          attempts = []
          for number, (runtime, device_type) in enumerate([primary, replacement], 1):
              attempt = {'attempt': number, 'runtime': runtime,
                         'runtimeVersion': runtimes[runtime]['version'],
                         'runtimeBuildVersion': runtimes[runtime]['buildversion'],
                         'runtimeSupportedArchitectures': runtimes[runtime]['supportedArchitectures'],
                         'requiredArchitecture': 'x86_64',
                         'deviceType': device_type, 'model': types[device_type]['name'],
                         'migrationReportedFailure': False,
                         'nativeExecutionPermitted': False, 'cleanBootReported': False}
              udid = None
              try:
                  name = f"Brain Projection {os.environ['GITHUB_RUN_ID']} attempt {number}"
                  udid = simctl('create', name, device_type, runtime).strip()
                  uuid.UUID(udid)
                  attempt['udid'] = udid
                  print('Preparing fresh native runtime target:', json.dumps(attempt), flush=True)
                  simctl('boot', udid)
                  boot = subprocess.run(['xcrun', 'simctl', 'bootstatus', udid, '-b'],
                      text=True, stdout=subprocess.PIPE, stderr=subprocess.STDOUT, timeout=240)
                  (artifacts / f'simulator-boot-attempt-{number}.log').write_text(boot.stdout)
                  print(boot.stdout, flush=True)
                  attempt['bootstatusExitCode'] = boot.returncode
                  failure_lines = [line.strip() for line in boot.stdout.splitlines()
                                   if re.search(r'\b(?:failed|failure)\b', line, re.I)]
                  attempt['bootstatusFailureLines'] = failure_lines
                  attempt['migrationReportedFailure'] = 'Data Migration Failed' in failure_lines
                  if boot.returncode:
                      raise RuntimeError('Simulator bootstatus returned nonzero; refusing native execution')
                  devices = json.loads(simctl('list', 'devices', '-j'))['devices']
                  (artifacts / f'simulator-devices-after-boot-attempt-{number}.json').write_text(
                      json.dumps(devices, indent=2) + '\n')
                  state = next((device.get('state') for group in devices.values()
                                for device in group if device['udid'] == udid), None)
                  attempt['observedState'] = state
                  if state != 'Booted':
                      raise RuntimeError(f'Simulator execution prerequisite ended in state {state!r}')
                  # Only this observed exit-0 terminal report may proceed as a
                  # diagnostic attempt. Its raw failure remains in the artifact.
                  known_terminal_migration = bool(re.search(
                      r'(?m)^\[[^\r\n]+\][ \t]+Status=3,[ \t]+isTerminal=YES,'
                      r'[ \t]+Elapsed=[^\r\n]+\r?\n[ \t]*Data Migration Failed'
                      r'[ \t]*(?:\r?\n[ \t]*)*\Z', boot.stdout))
                  if failure_lines:
                      if (not known_terminal_migration or
                              any(line != 'Data Migration Failed' for line in failure_lines)):
                          raise RuntimeError('Unknown simulator bootstatus failure text; refusing native execution')
                      attempt['startupWarning'] = (
                          'CoreSimulator reported terminal Data Migration Failed with exit 0. '
                          'The selected device is observed Booted; attempting the unchanged '
                          'native scenario does not declare healthy simulator setup.')
                      print('::warning::' + attempt['startupWarning'], flush=True)
                  attempt['cleanBootReported'] = not failure_lines
                  attempt['nativeExecutionPermitted'] = True
                  with open(os.environ['GITHUB_ENV'], 'a') as output:
                      output.write('BRAIN_SIMULATOR_ID=' + udid + '\n')
                  print('Native runtime execution permitted:', json.dumps(attempt), flush=True)
                  break
              except (subprocess.SubprocessError, ValueError, RuntimeError) as error:
                  attempt['error'] = str(error)
                  captured = getattr(error, 'output', None)
                  if captured:
                      if isinstance(captured, bytes):
                          captured = captured.decode(errors='replace')
                      (artifacts / f'simulator-boot-attempt-{number}.log').write_text(captured)
                  print('Native simulator preparation failed:', json.dumps(attempt), flush=True)
              finally:
                  attempts.append(attempt)
                  (artifacts / 'simulator-preparation.json').write_text(json.dumps(attempts, indent=2) + '\n')
              if udid:
                  attempt['cleanup'] = []
                  for operation in ['shutdown', 'delete']:
                      cleanup = {'operation': operation, 'udid': udid,
                                 'timeoutSeconds': 30, 'exitCode': None, 'timedOut': False,
                                 'outputFile': f'simulator-cleanup-attempt-{number}-{operation}.log'}
                      captured = ''
                      try:
                          captured = simctl(operation, udid, timeout=30)
                          cleanup['exitCode'] = 0
                      except (subprocess.SubprocessError, OSError) as error:
                          cleanup['error'] = str(error)
                          cleanup['exitCode'] = getattr(error, 'returncode', None)
                          cleanup['timedOut'] = isinstance(error, subprocess.TimeoutExpired)
                          captured = getattr(error, 'output', '') or ''
                      finally:
                          if isinstance(captured, bytes):
                              captured = captured.decode(errors='replace')
                          (artifacts / cleanup['outputFile']).write_text(captured)
                          attempt['cleanup'].append(cleanup)
                          (artifacts / 'simulator-preparation.json').write_text(json.dumps(attempts, indent=2) + '\n')
                          print('Created simulator cleanup status:', json.dumps(cleanup), flush=True)
                  attempt['cleanupSucceeded'] = all(result['exitCode'] == 0 and not result['timedOut']
                                                    for result in attempt['cleanup'])
                  if not attempt['cleanupSucceeded']:
                      attempt['replacementBlocked'] = True
                  (artifacts / 'simulator-preparation.json').write_text(json.dumps(attempts, indent=2) + '\n')
                  if not attempt['cleanupSucceeded']:
                      raise SystemExit('Created simulator cleanup did not complete successfully; refusing a replacement attempt')
          if not attempts[-1]['nativeExecutionPermitted']:
              raise SystemExit('Native simulator execution prerequisites failed on both bounded fresh-device attempts')
          PY
      - name: Exercise native Projection controls and WKWebView together
        timeout-minutes: 18
        working-directory: apps/korlix_brain
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json, math, os, time
          from pathlib import Path
          artifacts = Path('runtime-screenshots')
          artifacts.mkdir(parents=True, exist_ok=True)
          now = time.time()
          report = {'observedEpoch': now, 'maximumSetupMinutes': 13,
                    'nativeExerciseCapMinutes': 18, 'artifactReserveMinutesFromMarker': 4,
                    'jobTimeoutMinutes': 35, 'nativeExecutionPermitted': False}
          try:
              started = float(os.environ['BRAIN_RUNTIME_PROBE_STARTED_EPOCH'])
              deadline = float(os.environ['BRAIN_RUNTIME_PROBE_START_DEADLINE'])
              if (not math.isfinite(started) or not math.isfinite(deadline) or
                      abs(deadline - started - 13 * 60) > 0.001):
                  raise ValueError('Invalid native runtime time-budget marker')
              elapsed = now - started
              report.update({'startedEpoch': started, 'exerciseStartDeadlineEpoch': deadline,
                             'elapsedSetupSeconds': elapsed})
              report['nativeExecutionPermitted'] = 0 <= elapsed <= 13 * 60 and now <= deadline
              if not report['nativeExecutionPermitted']:
                  report['error'] = 'Setup exceeded 13 minutes or the time-budget clock moved backwards'
          except (KeyError, TypeError, ValueError) as error:
              report['error'] = str(error)
          (artifacts / 'native-runtime-time-budget.json').write_text(json.dumps(report, indent=2) + '\n')
          print('Native runtime exercise time budget:', json.dumps(report), flush=True)
          if not report['nativeExecutionPermitted']:
              raise SystemExit('Insufficient native exercise budget; preserving the artifact reserve')
          PY
          flutter pub get --enforce-lockfile
          mkdir -p runtime-screenshots
          flutter drive --verbose --no-pub --device-id "$BRAIN_SIMULATOR_ID" \
            --driver=test_driver/brain_projection_driver.dart \
            --target=integration_test/brain_projection_runtime_test.dart \
            2>&1 | tee runtime-screenshots/native-runtime.log
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: korlix-brain-native-runtime
          path: apps/korlix_brain/runtime-screenshots
          if-no-files-found: warn
          retention-days: 14

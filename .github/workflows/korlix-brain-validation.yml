name: KORLIX Brain+Voice mobile validation
on:
  workflow_dispatch:
  pull_request:
    branches: [release/korlix-brain-store-20261101]
    paths:
      - apps/korlix_brain/**
      - packages/korlix_receipt_core/**
      - .github/workflows/korlix-brain-validation.yml
  push:
    branches: [feature/korlix-brain-voice-20261031, feature/brain-projection-20261107]
    paths:
      - apps/korlix_brain/**
      - packages/korlix_receipt_core/**
      - .github/workflows/korlix-brain-validation.yml
      - scripts/prepare_brain_ios.py
      - scripts/prepare_ios_release.py
      - scripts/verify_ios_ipa.py
      - scripts/tests/test_*ios_release.py
      - codemagic.yaml
permissions:
  contents: read
concurrency:
  group: korlix-brain-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true
env:
  BOT: 'true'
  CI: 'true'
  FLUTTER_SUPPRESS_ANALYTICS: 'true'
  DART_SUPPRESS_ANALYTICS: 'true'
  COCOAPODS_DISABLE_STATS: 'true'
jobs:
  projection-ui:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Install isolated browser test dependencies
        run: |
          npm install --prefix "$RUNNER_TEMP/projection-browser" --no-audit --no-fund playwright@1.56.1
          "$RUNNER_TEMP/projection-browser/node_modules/.bin/playwright" install --with-deps chromium
      - name: Check responsive Projection and original home interactions
        env:
          PROJECTION_SCREENSHOTS: projection-screenshots
        run: |
          export NODE_PATH="$RUNNER_TEMP/projection-browser/node_modules"
          node apps/korlix_brain/tools/check_projection.cjs
          node apps/korlix_brain/tools/check_ui.cjs
          node apps/korlix_brain/tools/check_controls.cjs
          node apps/korlix_brain/tools/check_ambience.cjs
          node apps/korlix_brain/tools/check_welcome.cjs
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: korlix-brain-projection-screenshots
          path: projection-screenshots
          if-no-files-found: warn
          retention-days: 14
  release-identity:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Verify Apple identity and build numbering safeguards
        run: python3 -m unittest discover -s scripts/tests -p 'test_*ios_release.py' -v
  android:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2
        with:
          flutter-version: '3.47.9'
          channel: stable
          cache: true
      - name: Validate account and memory behavior
        working-directory: apps/korlix_brain
        run: |
          flutter pub get --enforce-lockfile
          flutter analyze --no-pub
          flutter test --no-pub --reporter expanded
      - name: Build Android test APK
        working-directory: apps/korlix_brain
        run: flutter build apk --debug --no-pub
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: korlix-brain-voice-android-debug
          path: apps/korlix_brain/build/app/outputs/flutter-apk/app-debug.apk
          if-no-files-found: error
          retention-days: 14
  ios:
    runs-on: macos-26
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2
        with:
          flutter-version: '3.47.9'
          channel: stable
          cache: true
      - name: Build iOS simulator app
        working-directory: apps/korlix_brain
        run: |
          flutter pub get --enforce-lockfile
          flutter build ios --simulator --debug --no-pub
          cd build/ios/iphonesimulator
          ditto -c -k --sequesterRsrc --keepParent Runner.app BrainVoice-Simulator.zip
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: korlix-brain-voice-ios-simulator
          path: apps/korlix_brain/build/ios/iphonesimulator/BrainVoice-Simulator.zip
          if-no-files-found: error
          retention-days: 14
      - name: Compile iPhone release binary
        working-directory: apps/korlix_brain
        run: |
          flutter build ios --release --no-codesign --no-pub
          python3 - <<'PY'
          import plistlib, subprocess
          from pathlib import Path
          app = Path('build/ios/iphoneos/Runner.app')
          info = plistlib.loads((app / 'Info.plist').read_bytes())
          assert info['CFBundleIdentifier'] == 'com.korlix.brain'
          assert info['CFBundleSupportedPlatforms'] == ['iPhoneOS']
          binary = app / info['CFBundleExecutable']
          assert 'arm64' in subprocess.check_output(['lipo', '-archs', str(binary)], text=True).split()
          print('Verified com.korlix.brain iPhoneOS arm64 release compilation. Signing is handled in Codemagic.')
          PY

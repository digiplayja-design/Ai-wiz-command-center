name: KORLIX Messenger Android release candidate

on:
  push:
    branches:
      - release/korlix-messenger-android
  workflow_dispatch:
    inputs:
      build_name:
        description: Android version name
        required: true
        default: '0.1.0'
      build_number:
        description: Unused, increasing Android version code
        required: true
        default: '2'

permissions:
  contents: read

concurrency:
  group: korlix-messenger-android-release
  cancel-in-progress: false

jobs:
  release-candidate:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    environment: korlix-messenger-android-release
    env:
      CI: 'true'
      FLUTTER_SUPPRESS_ANALYTICS: 'true'
      DART_SUPPRESS_ANALYTICS: 'true'
      BUILD_NAME: ${{ inputs.build_name || '0.1.0' }}
      BUILD_NUMBER: ${{ inputs.build_number || '2' }}
      KORLIX_MESSENGER_ANDROID_STORE_FILE: ${{ runner.temp }}/messenger-upload.jks
      KORLIX_MESSENGER_ANDROID_STORE_PASSWORD: ${{ secrets.KORLIX_MESSENGER_ANDROID_STORE_PASSWORD }}
      KORLIX_MESSENGER_ANDROID_KEY_ALIAS: ${{ secrets.KORLIX_MESSENGER_ANDROID_KEY_ALIAS }}
      KORLIX_MESSENGER_ANDROID_KEY_PASSWORD: ${{ secrets.KORLIX_MESSENGER_ANDROID_KEY_PASSWORD }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          flutter-version: '3.47.7'
          channel: stable
          cache: true
      - name: Prepare dedicated Messenger signing and Firebase client
        env:
          MESSENGER_KEYSTORE_BASE64: ${{ secrets.KORLIX_MESSENGER_ANDROID_KEYSTORE_BASE64 }}
          MESSENGER_GOOGLE_SERVICES_JSON: ${{ secrets.KORLIX_MESSENGER_GOOGLE_SERVICES_JSON }}
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import base64, os, re
          from pathlib import Path
          required = ['MESSENGER_KEYSTORE_BASE64', 'MESSENGER_GOOGLE_SERVICES_JSON',
                      'KORLIX_MESSENGER_ANDROID_STORE_PASSWORD', 'KORLIX_MESSENGER_ANDROID_KEY_ALIAS',
                      'KORLIX_MESSENGER_ANDROID_KEY_PASSWORD']
          missing = [key for key in required if not os.environ.get(key)]
          if missing:
              raise SystemExit('Missing Messenger release configuration: ' + ', '.join(missing))
          if not re.fullmatch(r'[0-9]+\.[0-9]+\.[0-9]+', os.environ['BUILD_NAME']):
              raise SystemExit('Use a numeric major.minor.patch version name.')
          number = os.environ['BUILD_NUMBER']
          if not re.fullmatch(r'[1-9][0-9]{0,9}', number) or int(number) > 2100000000:
              raise SystemExit('Use a valid positive Android version code.')
          try:
              key = base64.b64decode(os.environ['MESSENGER_KEYSTORE_BASE64'], validate=True)
          except ValueError:
              raise SystemExit('Messenger upload keystore is not valid base64.') from None
          if not 100 <= len(key) <= 1048576:
              raise SystemExit('Messenger upload keystore has an invalid size.')
          for path, content in [
              (Path(os.environ['KORLIX_MESSENGER_ANDROID_STORE_FILE']), key),
              (Path('apps/korlix_messenger/android/app/google-services.json'), os.environ['MESSENGER_GOOGLE_SERVICES_JSON'].encode()),
          ]:
              with path.open('wb') as stream:
                  os.chmod(path, 0o600)
                  stream.write(content)
          PY
          python3 scripts/prepare-android-firebase.py apps/korlix_messenger apps/korlix_messenger --package com.korlixdeveloper.messenger --required
          keytool -list -keystore "$KORLIX_MESSENGER_ANDROID_STORE_FILE" -storepass:env KORLIX_MESSENGER_ANDROID_STORE_PASSWORD -alias "$KORLIX_MESSENGER_ANDROID_KEY_ALIAS" >/dev/null
      - name: Validate and build signed AAB
        working-directory: apps/korlix_messenger
        shell: bash
        run: |
          set -euo pipefail
          flutter config --no-analytics
          dart --disable-analytics
          flutter pub get --enforce-lockfile
          flutter analyze --no-pub
          flutter test --no-pub --reporter expanded
          flutter build appbundle --release --no-pub --build-name "$BUILD_NAME" --build-number "$BUILD_NUMBER"
          jarsigner -verify build/app/outputs/bundle/release/app-release.aab | tee build/aab-signature-check.txt
          grep -Fq 'jar verified.' build/aab-signature-check.txt
          sha256sum build/app/outputs/bundle/release/app-release.aab > build/messenger-aab.sha256
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: korlix-messenger-android-release-candidate-${{ env.BUILD_NUMBER }}
          path: |
            apps/korlix_messenger/build/app/outputs/bundle/release/app-release.aab
            apps/korlix_messenger/build/aab-signature-check.txt
            apps/korlix_messenger/build/messenger-aab.sha256
          if-no-files-found: error
          retention-days: 14
      - name: Remove private build inputs
        if: always()
        shell: bash
        run: |
          rm -f "$KORLIX_MESSENGER_ANDROID_STORE_FILE" apps/korlix_messenger/android/app/google-services.json

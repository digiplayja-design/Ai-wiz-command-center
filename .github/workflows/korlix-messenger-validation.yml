name: KORLIX Messenger mobile validation

on:
  workflow_dispatch:
  push:
    branches:
      - feature/korlix-messenger-20261024
      - fix/messenger-calls-profile-20261028
      - fix/messenger-call-recovery-20261028
      - fix/messenger-presence-and-video-reporting-20261030
    paths:
      - .github/workflows/korlix-messenger-validation.yml
      - apps/korlix_messenger/lib/**
      - apps/korlix_messenger/test/**
      - apps/korlix_messenger/android/**
      - apps/korlix_messenger/ios/**
      - apps/korlix_messenger/pubspec.*
      - packages/korlix_social_core/**
      - packages/korlix_receipt_core/lib/**
      - packages/korlix_receipt_core/test/**
      - packages/korlix_receipt_core/pubspec.*
      - test/social_call*test.dart
      - test/social_communication_upgrade_test.dart
      - test/social_screen_sharing_test.dart
      - test/social_presence*
      - lib/image_to_video/**
      - test/image_to_video_reporting_test.dart
      - lib/support/**

permissions:
  contents: read

concurrency:
  group: korlix-messenger-validation-${{ github.ref }}
  cancel-in-progress: true

env:
  CI: 'true'
  FLUTTER_SUPPRESS_ANALYTICS: 'true'
  DART_SUPPRESS_ANALYTICS: 'true'
  COCOAPODS_DISABLE_STATS: 'true'

jobs:
  android:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - name: Block instance metadata before toolchain setup
        shell: bash
        run: |
          set -euo pipefail
          for network in 169.254.0.0/16 100.100.100.200/32; do
            sudo iptables -I OUTPUT 1 -d "$network" -j REJECT
            sudo iptables -C OUTPUT -d "$network" -j REJECT
          done
          for network in fe80::/10 fd00:ec2::254/128; do
            sudo ip6tables -I OUTPUT 1 -d "$network" -j REJECT
            sudo ip6tables -C OUTPUT -d "$network" -j REJECT
          done
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          flutter-version: '3.47.7'
          channel: stable
          cache: true
      - name: Validate independent messenger
        shell: bash
        run: |
          set -euo pipefail
          flutter config --no-analytics
          dart --disable-analytics
          cd apps/korlix_messenger
          flutter pub get --enforce-lockfile
          flutter analyze --no-pub
          flutter test --no-pub --reporter expanded
      - name: Validate shared Social call and profile regressions
        shell: bash
        run: |
          set -euo pipefail
          flutter pub get --enforce-lockfile
          export KORLIX_FLUTTER_ROOT="$FLUTTER_ROOT"
          export AGENT_STUDIO_SCREENSHOTS="$RUNNER_TEMP/messenger-previews"
          flutter test --no-pub --reporter expanded --timeout 2m test/social_test.dart test/social_communication_upgrade_test.dart test/social_calls_test.dart test/social_call_audio_test.dart test/social_call_reliability_test.dart test/social_presence_ui_test.dart test/messenger_screen_test.dart test/social_appearance_test.dart test/korlix_sound_service_test.dart test/korlix_sound_tones_test.dart test/social_screen_sharing_test.dart test/social_message_share_test.dart test/social_app_alerts_test.dart test/social_alert_overlay_test.dart test/social_sound_integration_test.dart test/social_floating_chat_test.dart test/social_native_settings_test.dart test/social_message_interactions_test.dart test/social_reactions_test.dart test/social_replies_test.dart
      - name: Verify sustained WebRTC and legacy audio interoperability
        shell: bash
        run: |
          set -euo pipefail
          export KORLIX_TEST_CHROME="$(command -v google-chrome || command -v chromium)"
          export CHROME_EXECUTABLE="$RUNNER_TEMP/messenger-test-chrome"
          cat > "$CHROME_EXECUTABLE" <<'SH'
          #!/usr/bin/env bash
          exec "$KORLIX_TEST_CHROME" --use-fake-device-for-media-stream --use-fake-ui-for-media-stream --autoplay-policy=no-user-gesture-required "$@"
          SH
          chmod 700 "$CHROME_EXECUTABLE"
          flutter test --no-pub --platform chrome --reporter expanded test/social_call_browser_test.dart
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: korlix-messenger-appearance-previews
          path: ${{ runner.temp }}/messenger-previews
          if-no-files-found: error
          retention-days: 14
      - name: Validate presence and AI reporting regressions
        run: |
          flutter analyze --no-pub lib/image_to_video lib/imagine_studio lib/improve_picture/picture_studio_client.dart lib/improve_picture/picture_studio_screen.dart lib/improve_picture/screens/preview_screen.dart lib/logo_studio lib/support packages/korlix_social_core/lib/social/social_notifications.dart packages/korlix_social_core/lib/social/social_presence_button.dart packages/korlix_social_core/lib/social/social_screen.dart
          flutter test --no-pub --reporter expanded test/social_presence_model_test.dart test/social_presence_toggle_test.dart test/social_presence_ui_test.dart test/image_to_video_reporting_test.dart test/image_to_video_media_security_test.dart test/support/ai_output_report_test.dart test/support/report_image_test.dart test/imagine_studio_test.dart test/logo_studio_test.dart test/picture_studio_report_test.dart test/portrait_preview_report_test.dart
      - name: Build Android test APK
        working-directory: apps/korlix_messenger
        run: flutter build apk --debug --no-pub
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: korlix-messenger-android-debug
          path: apps/korlix_messenger/build/app/outputs/flutter-apk/app-debug.apk
          if-no-files-found: error
          retention-days: 14

  ios-simulator:
    runs-on: macos-26
    timeout-minutes: 35
    steps:
      - name: Block instance metadata before toolchain setup
        shell: bash
        run: |
          set -euo pipefail
          rules="$RUNNER_TEMP/korlix-metadata-block.pf"
          cat > "$rules" <<'PF'
          block drop out quick inet to { 169.254.0.0/16, 100.100.100.200/32 }
          block drop out quick inet6 to { fe80::/10, fd00:ec2::254/128 }
          PF
          sudo pfctl -f "$rules"
          sudo pfctl -e 2>/dev/null || sudo pfctl -s info | grep -q 'Status: Enabled'
          sudo pfctl -s rules | grep -q '169.254.0.0/16'
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          flutter-version: '3.47.7'
          channel: stable
          cache: true
      - name: Build iOS simulator app
        shell: bash
        run: |
          set -euo pipefail
          flutter config --no-analytics
          dart --disable-analytics
          xcodebuild -version
          cd apps/korlix_messenger
          flutter pub get --enforce-lockfile
          flutter build ios --simulator --debug --no-pub
          cd build/ios/iphonesimulator
          ditto -c -k --sequesterRsrc --keepParent Runner.app KorlixMessenger-Simulator.zip
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: korlix-messenger-ios-simulator
          path: apps/korlix_messenger/build/ios/iphonesimulator/KorlixMessenger-Simulator.zip
          if-no-files-found: error
          retention-days: 14

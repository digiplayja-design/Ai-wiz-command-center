name: KORLIX Messenger workflow checks

on:
  push:
    branches:
      - feature/korlix-messenger-20261024
      - release/korlix-messenger-android
    paths:
      - .github/workflows/korlix-messenger-*.yml
      - scripts/ci/validate-messenger-workflows.py
      - scripts/prepare-android-firebase.py
      - scripts/test_prepare_android_firebase.py
  pull_request:
    paths:
      - .github/workflows/korlix-messenger-*.yml
      - scripts/ci/validate-messenger-workflows.py
      - scripts/prepare-android-firebase.py
      - scripts/test_prepare_android_firebase.py

permissions:
  contents: read

jobs:
  workflow-checks:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Validate workflow expressions and contexts
        run: python3 scripts/ci/validate-messenger-workflows.py
      - name: Verify Firebase configuration safeguards
        run: python3 -m unittest discover -s scripts -p test_prepare_android_firebase.py

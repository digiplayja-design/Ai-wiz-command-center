name: Magic Camera signed Android candidate
on:
  workflow_dispatch:
    inputs:
      build_name:
        description: Android version name
        required: true
        default: '1.0.0'
      build_number:
        description: Unused increasing Android version code
        required: true
        default: '2'
permissions:
  contents: read
concurrency:
  group: magic-camera-android-release
  cancel-in-progress: false
jobs:
  candidate:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    environment: magic-camera-android-release
    env:
      FLUTTER_SUPPRESS_ANALYTICS: 'true'
      DART_SUPPRESS_ANALYTICS: 'true'
      BUILD_NAME: ${{ inputs.build_name }}
      BUILD_NUMBER: ${{ inputs.build_number }}
      KORLIX_MAGIC_ANDROID_STORE_FILE: ${{ runner.temp }}/magic-camera-upload.jks
      KORLIX_MAGIC_ANDROID_STORE_PASSWORD: ${{ secrets.KORLIX_MAGIC_ANDROID_STORE_PASSWORD }}
      KORLIX_MAGIC_ANDROID_KEY_ALIAS: ${{ secrets.KORLIX_MAGIC_ANDROID_KEY_ALIAS }}
      KORLIX_MAGIC_ANDROID_KEY_PASSWORD: ${{ secrets.KORLIX_MAGIC_ANDROID_KEY_PASSWORD }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2
        with:
          flutter-version: '3.47.7'
          channel: stable
          cache: true
      - name: Prepare dedicated Magic Camera signing
        env:
          MAGIC_KEYSTORE_BASE64: ${{ secrets.KORLIX_MAGIC_ANDROID_KEYSTORE_BASE64 }}
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import base64, os, re
          from pathlib import Path
          required = ['MAGIC_KEYSTORE_BASE64', 'KORLIX_MAGIC_ANDROID_STORE_PASSWORD',
                      'KORLIX_MAGIC_ANDROID_KEY_ALIAS', 'KORLIX_MAGIC_ANDROID_KEY_PASSWORD']
          missing = [name for name in required if not os.environ.get(name)]
          if missing:
              raise SystemExit('Missing Magic Camera signing configuration: ' + ', '.join(missing))
          if not re.fullmatch(r'[0-9]+\.[0-9]+\.[0-9]+', os.environ['BUILD_NAME']):
              raise SystemExit('Use a numeric major.minor.patch version name.')
          number = os.environ['BUILD_NUMBER']
          if not re.fullmatch(r'[1-9][0-9]{0,9}', number) or int(number) > 2100000000:
              raise SystemExit('Use a valid positive Android version code.')
          try:
              key = base64.b64decode(os.environ['MAGIC_KEYSTORE_BASE64'], validate=True)
          except ValueError:
              raise SystemExit('Magic Camera upload keystore is not valid base64.') from None
          if not 100 <= len(key) <= 1048576:
              raise SystemExit('Magic Camera upload keystore has an invalid size.')
          path = Path(os.environ['KORLIX_MAGIC_ANDROID_STORE_FILE'])
          with path.open('wb') as stream:
              os.chmod(path, 0o600)
              stream.write(key)
          PY
          keytool -list -keystore "$KORLIX_MAGIC_ANDROID_STORE_FILE" \
            -storepass:env KORLIX_MAGIC_ANDROID_STORE_PASSWORD -alias "$KORLIX_MAGIC_ANDROID_KEY_ALIAS" >/dev/null
      - name: Validate shared camera
        working-directory: packages/korlix_magic_core
        run: |
          flutter pub get --enforce-lockfile
          flutter analyze --no-pub
          flutter test --no-pub --reporter expanded
      - name: Build and verify signed AAB
        working-directory: apps/magic_camera
        shell: bash
        run: |
          set -euo pipefail
          flutter pub get --enforce-lockfile
          flutter analyze --no-pub
          flutter test --no-pub --reporter expanded
          flutter build appbundle --release --no-pub --build-name "$BUILD_NAME" --build-number "$BUILD_NUMBER"
          jarsigner -verify build/app/outputs/bundle/release/app-release.aab | tee build/aab-signature-check.txt
          grep -Fq 'jar verified.' build/aab-signature-check.txt
          sha256sum build/app/outputs/bundle/release/app-release.aab > build/magic-camera-aab.sha256
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: korlix-magic-camera-android-candidate-${{ env.BUILD_NUMBER }}
          path: |
            apps/magic_camera/build/app/outputs/bundle/release/app-release.aab
            apps/magic_camera/build/aab-signature-check.txt
            apps/magic_camera/build/magic-camera-aab.sha256
          if-no-files-found: error
          retention-days: 14
      - name: Remove private signing input
        if: always()
        shell: bash
        run: rm -f "$KORLIX_MAGIC_ANDROID_STORE_FILE"

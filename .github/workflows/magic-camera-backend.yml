name: Magic Camera backend validation
on:
  push:
    branches: [feature/korlix-magic-camera-backend-20261030]
    paths: ['backend/magic_camera/**', 'backend/test/magic_camera*', 'backend/test/receipt_app_sessions.test.mjs', 'backend/security/receipt_app_sessions.mjs', 'backend/server.js', 'supabase/migrations/*magic_camera*', '.github/workflows/magic-camera-backend.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - working-directory: backend
        run: |
          npm ci
          node --check server.js
          node --test test/magic_camera*.test.mjs test/receipt_app_sessions.test.mjs test/messenger_auth_alias.test.mjs test/receipt_wiz_full.test.mjs test/report_image_evidence.test.mjs test/ai_report_persistence.test.mjs

name: Magic Camera validation
on:
  workflow_dispatch:
  push:
    branches: [feature/korlix-magic-camera-20261030]
    paths: ['packages/korlix_magic_core/**', 'apps/magic_camera/**', 'lib/**', 'pubspec.*', 'codemagic.yaml', 'scripts/*ios*.py', 'scripts/tests/test_ios_release.py', '.github/workflows/magic-camera*']
permissions:
  contents: read
concurrency:
  group: magic-camera-${{ github.ref }}
  cancel-in-progress: true
env:
  FLUTTER_SUPPRESS_ANALYTICS: 'true'
  DART_SUPPRESS_ANALYTICS: 'true'
jobs:
  android:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2
        with:
          flutter-version: '3.47.7'
          channel: stable
          cache: true
      - name: Verify release identity and artifact checks
        run: python3 -m unittest discover -s scripts/tests -p test_ios_release.py -v
      - name: Test shared Magic Camera
        working-directory: packages/korlix_magic_core
        env:
          MAGIC_SCREENSHOT: '1'
        run: |
          flutter pub get --enforce-lockfile
          flutter analyze --no-pub
          flutter test --no-pub --reporter expanded
      - name: Validate standalone and build Android
        working-directory: apps/magic_camera
        run: |
          flutter pub get --enforce-lockfile
          flutter analyze --no-pub
          flutter test --no-pub --reporter expanded
          flutter build apk --debug --no-pub
          flutter build web --release --no-pub
      - name: Reject Android release without dedicated signing
        working-directory: apps/magic_camera
        shell: bash
        run: |
          set -euo pipefail
          if flutter build appbundle --release --no-pub > build/unsigned-release.log 2>&1; then
            echo 'Release unexpectedly succeeded without Magic Camera signing.'
            exit 1
          fi
          grep -Fq 'Configure all four Magic Camera release signing values' build/unsigned-release.log
      - name: Validate hub integration
        run: |
          flutter pub get --enforce-lockfile
          flutter analyze --no-pub lib/navigation/home_tool_catalog.dart
          flutter test --no-pub test/home_tool_catalog_test.dart
          flutter build apk --debug --no-pub
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: korlix-magic-camera-review
          path: |
            apps/magic_camera/build/app/outputs/flutter-apk/app-debug.apk
            apps/magic_camera/build/web
            /tmp/korlix-magic-home.png
          if-no-files-found: warn
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: korlix-ai-hub-magic-camera-review
          path: build/app/outputs/flutter-apk/app-debug.apk
          if-no-files-found: warn
  ios:
    runs-on: macos-26
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2
        with:
          flutter-version: '3.47.7'
          channel: stable
          cache: true
      - name: Build iOS simulator
        working-directory: apps/magic_camera
        run: |
          flutter pub get --enforce-lockfile
          flutter build ios --simulator --debug --no-pub
          cd build/ios/iphonesimulator
          ditto -c -k --sequesterRsrc --keepParent Runner.app MagicCamera-Simulator.zip
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: korlix-magic-camera-ios
          path: apps/magic_camera/build/ios/iphonesimulator/MagicCamera-Simulator.zip
          if-no-files-found: error

name: Isolated onboarding validation

on:
  workflow_dispatch:
  pull_request:
    branches: [fix/image-to-video-session-20261016]
    paths:
      - 'lib/**'
      - 'test/**'
      - 'pubspec.*'
      - 'third_party/**'
      - 'scripts/ci/validate-onboarding-offline.sh'
      - '.github/workflows/onboarding-validation.yml'

permissions:
  contents: read

concurrency:
  group: onboarding-validation-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  flutter-checks:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      # Pinned to the verified Flutter stable ref on 2026-10-17.
      FLUTTER_REVISION: abaf9c523780a608bd46686fd5e53740a07077f8
      HTTP_PROXY: ''
      HTTPS_PROXY: ''
      ALL_PROXY: ''
      http_proxy: ''
      https_proxy: ''
      all_proxy: ''
      NO_PROXY: '*'
      no_proxy: '*'
    steps:
      - name: Block cloud metadata before SDK setup
        shell: bash
        run: |
          set -euo pipefail
          for network in 169.254.0.0/16 100.100.100.200/32; do
            sudo iptables -I OUTPUT 1 -d "$network" -j REJECT
            sudo iptables -C OUTPUT -d "$network" -j REJECT
          done
          for network in fe80::/10 fd00:ec2::254/128; do
            sudo ip6tables -I OUTPUT 1 -d "$network" -j REJECT
            sudo ip6tables -C OUTPUT -d "$network" -j REJECT
          done
          # Prove namespaces are supported before any Flutter command runs.
          sudo unshare --net bash -c 'test -z "$(ip route show default)"'
          echo 'Metadata firewall verified; no metadata endpoint was contacted.'

      - name: Checkout source
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Prepare pinned SDK and locked dependencies
        shell: bash
        run: |
          set -euo pipefail
          sudo iptables -C OUTPUT -d 169.254.0.0/16 -j REJECT
          sudo ip6tables -C OUTPUT -d fd00:ec2::254/128 -j REJECT
          sdk="$RUNNER_TEMP/korlix-flutter"
          git init "$sdk"
          git -C "$sdk" fetch --depth=1 https://github.com/flutter/flutter.git "$FLUTTER_REVISION"
          git -C "$sdk" checkout --detach FETCH_HEAD
          test "$(git -C "$sdk" rev-parse HEAD)" = "$FLUTTER_REVISION"
          export PATH="$sdk/bin:$PATH"
          export PUB_CACHE="$RUNNER_TEMP/korlix-pub-cache"
          printf '%s\n' "$sdk/bin" >> "$GITHUB_PATH"
          printf 'PUB_CACHE=%s\n' "$PUB_CACHE" >> "$GITHUB_ENV"
          flutter --suppress-analytics --no-version-check --version
          flutter --suppress-analytics --no-version-check precache --linux --no-android --no-ios --no-web --no-macos --no-windows
          flutter --suppress-analytics --no-version-check pub get --enforce-lockfile
          git diff --exit-code -- pubspec.lock

      - name: Analyze and test with loopback-only networking
        shell: bash
        run: |
          set -euo pipefail
          # A fresh namespace has no external interface or route. The script
          # verifies that boundary and drops root before invoking Flutter.
          sudo --preserve-env=PATH,HOME,PUB_CACHE unshare --net \
            bash scripts/ci/validate-onboarding-offline.sh "$(id -un)"

      - name: Preserve validation logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: onboarding-validation-${{ github.run_id }}
          path: validation-logs/
          if-no-files-found: ignore
          retention-days: 7

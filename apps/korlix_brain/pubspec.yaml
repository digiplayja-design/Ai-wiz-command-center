name: korlix_brain
description: Standalone KORLIX Brain with shared accounts, approved memory and live Rici voice.
publish_to: none
version: 1.0.0+1
environment:
  sdk: ^3.13.5
dependencies:
  flutter:
    sdk: flutter
  korlix_receipt_core:
    path: ../../packages/korlix_receipt_core
  http: 1.6.0
  shared_preferences: 2.5.5
  webview_flutter: 4.14.1
  flutter_webrtc: 1.5.2
  speech_to_text: 7.4.0
  file_picker: 10.3.8
  url_launcher: 6.3.2
dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
flutter:
  uses-material-design: true
  assets:
    - assets/web/

name: korlix_brain
description: Standalone KORLIX Brain with shared accounts, approved memory and live Rici voice.
publish_to: none
version: 1.0.1+14
environment:
  sdk: ^3.13.5
dependencies:
  flutter:
    sdk: flutter
  korlix_receipt_core:
    path: ../../packages/korlix_receipt_core
  http: 1.6.0
  shared_preferences: 2.5.5
  flutter_secure_storage: 10.3.4
  share_plus: 12.0.2
  webview_flutter: 4.14.1
  webview_flutter_android: 4.14.1
  webview_flutter_wkwebview: 3.27.2
  flutter_webrtc: 1.5.2
  speech_to_text: 7.4.0
  file_picker: 10.3.8
  url_launcher: 6.3.2
  in_app_purchase: 3.3.0
  in_app_purchase_android: 0.5.1
  in_app_purchase_storekit: 0.4.10+1
dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
flutter:
  uses-material-design: true
  assets:
    - assets/web/
    - assets/branding/

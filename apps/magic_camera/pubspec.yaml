name: magic_camera
description: KORLIX Magic Camera — imagine, capture, reveal.
publish_to: none
version: 1.0.0+3
environment:
  sdk: ^3.13.5
dependencies:
  flutter:
    sdk: flutter
  korlix_magic_core:
    path: ../../packages/korlix_magic_core
  korlix_receipt_core:
    path: ../../packages/korlix_receipt_core
  http: 1.6.0
  shared_preferences: 2.5.5
  url_launcher: 6.3.2
  in_app_purchase: 3.3.0
  in_app_purchase_android: 0.5.1
dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: 6.0.0
  flutter_launcher_icons: 0.14.4
flutter:
  uses-material-design: true
  assets:
    - assets/korlix_logo.png
flutter_launcher_icons:
  android: true
  ios: true
  image_path: assets/korlix_logo.png
  remove_alpha_ios: true
  min_sdk_android: 24
  web:
    generate: true
    image_path: assets/korlix_logo.png
    background_color: '#07111F'
    theme_color: '#07111F'

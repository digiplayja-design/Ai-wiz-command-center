workflows:
  korlix-ios-testflight:
    name: Korlix AI iOS TestFlight
    instance_type: mac_mini_m2
    max_build_duration: 60

    integrations:
      app_store_connect: Codemagic Korlix AI

    environment:
      flutter: stable
      xcode: latest
      cocoapods: default
      ios_signing:
        provisioning_profiles:
          - KORLIX_APP_STORE_PROFILE
        certificates:
          - KORLIX_APP_STORE_CERT

    scripts:
      - name: Show project files
        script: |
          pwd
          ls -la
          ls -la ios
          find ios/Runner.xcodeproj -name "*.xcscheme" -print || true

      - name: Flutter pub get
        script: |
          flutter pub get

      - name: Install CocoaPods
        script: |
          cd ios
          pod install --repo-update
          cd ..

      - name: Apply iOS code signing
        script: |
          xcode-project use-profiles

      - name: Build iOS IPA
        script: |
          set -e

          echo "Building IPA..."
          VERSION_LINE="$(grep '^version:' pubspec.yaml | awk '{print $2}')"
          BUILD_NAME="${VERSION_LINE%%+*}"
          BUILD_NUMBER="${VERSION_LINE##*+}"
          echo "Building IPA version $BUILD_NAME ($BUILD_NUMBER)..."
          flutter build ipa --release --build-name="$BUILD_NAME" --build-number="$BUILD_NUMBER" --export-options-plist=/Users/builder/export_options.plist
          echo ""
          echo "Searching for generated IPA files..."
          find build -type f -name "*.ipa" -print || true

          mkdir -p artifacts

          IPA_PATH="$(find build -type f -name "*.ipa" | head -n 1 || true)"

          if [ -z "$IPA_PATH" ]; then
            echo "ERROR: No IPA file was created."
            echo ""
            echo "Debugging build/ios contents:"
            find build/ios -maxdepth 5 -type f -print || true
            exit 1
          fi

          echo "Found IPA: $IPA_PATH"
          cp "$IPA_PATH" artifacts/KorlixAI.ipa

          echo ""
          echo "Final artifacts folder:"
          ls -lah artifacts

    artifacts:
      - artifacts/*.ipa
      - /tmp/xcodebuild_logs/*.log
      - flutter_drive.log

    publishing:
      app_store_connect:
        auth: integration
        submit_to_testflight: true
        submit_to_app_store: false

  android-release:
    name: Android Release AAB
    max_build_duration: 120
    instance_type: linux_x2
    environment:
      flutter: stable
    scripts:
      - name: Install Android SDK 36
        script: |
          SDKMANAGER=""
          if command -v sdkmanager >/dev/null 2>&1; then
            SDKMANAGER="$(command -v sdkmanager)"
          elif [ -x "$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager" ]; then
            SDKMANAGER="$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager"
          elif [ -x "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" ]; then
            SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          fi

          if [ -n "$SDKMANAGER" ]; then
            yes | "$SDKMANAGER" "platforms;android-36" "build-tools;36.0.0" || true
          else
            echo "sdkmanager not found; continuing with installed Android SDKs"
          fi
      - name: Show project files
        script: |
          pwd
          ls -la
          grep '^version:' pubspec.yaml
      - name: Flutter pub get
        script: |
          flutter pub get
      - name: Force Flutter plugin compileSdk 36
        script: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          roots = [
              Path.home() / ".pub-cache",
              Path("/Users/builder/.pub-cache"),
              Path("/root/.pub-cache"),
          ]

          patterns = [
              (r"(?m)^(\s*)compileSdk\s*=\s*(?:flutter\.compileSdkVersion|\d+)\s*$", r"\1compileSdk = 36"),
              (r"(?m)^(\s*)compileSdk\s+(?:flutter\.compileSdkVersion|\d+)\s*$", r"\1compileSdk 36"),
              (r"(?m)^(\s*)compileSdkVersion\s+(?:flutter\.compileSdkVersion|\d+)\s*$", r"\1compileSdkVersion 36"),
              (r"(?m)^(\s*)compileSdkVersion\s*\((?:flutter\.compileSdkVersion|\d+)\)\s*$", r"\1compileSdk = 36"),
          ]

          patched = 0

          for root in roots:
              if not root.exists():
                  continue

              for file in root.rglob("build.gradle*"):
                  path_text = str(file)
                  if "/android/" not in path_text and "\\android\\" not in path_text:
                      continue

                  try:
                      text = file.read_text()
                  except Exception:
                      continue

                  original = text

                  for pattern, replacement in patterns:
                      text = re.sub(pattern, replacement, text)

                  if text != original:
                      file.write_text(text)
                      patched += 1
                      print(f"patched {file}")

          print(f"Flutter plugin Gradle files patched: {patched}")
          PY

      - name: Analyze Flutter
        script: |
          flutter analyze
      - name: Build Android App Bundle
        script: |
          VERSION_LINE="$(grep '^version:' pubspec.yaml | awk '{print $2}')"
          BUILD_NAME="${VERSION_LINE%%+*}"
          BUILD_NUMBER="${VERSION_LINE##*+}"
          echo "Building Android AAB version $BUILD_NAME ($BUILD_NUMBER)..."
          flutter build appbundle --release --build-name="$BUILD_NAME" --build-number="$BUILD_NUMBER"
          mkdir -p artifacts
          cp build/app/outputs/bundle/release/app-release.aab artifacts/KorlixAI.aab
          echo "Android artifacts:"
          ls -lah artifacts
    artifacts:
      - artifacts/*.aab

  fax-ios-testflight:
    name: Fax by Korlix internal TestFlight
    instance_type: mac_mini_m2
    max_build_duration: 60
    working_directory: apps/fax
    integrations:
      app_store_connect: Codemagic Korlix AI
    environment:
      node: 24
      xcode: latest
      ios_signing:
        # Codemagic imports the existing team certificate alongside a stored profile.
        # Only the exact fax profile selected below is applied to the target.
        certificates:
          - KORLIX_APP_STORE_CERT
        provisioning_profiles:
          - KORLIX_APP_STORE_PROFILE
    scripts:
      - name: Install the fax app identifier and distribution profile
        script: python3 ios/prepare-profile.py
      - name: Prepare iPhone and iPad app
        script: npm ci && npm run web && npx cap sync ios
      - name: Build with the fax provisioning profile
        script: |
          cd ios/App
          xcode-project use-profiles --project App.xcodeproj --profile ../fax.mobileprovision
          xcode-project build-ipa --project App.xcodeproj --scheme App --ipa-directory "$CM_BUILD_DIR/apps/fax/artifacts"
      - name: Upload to internal TestFlight when the App Store Connect record exists
        script: |
          set -euo pipefail
          records=$(app-store-connect apps list --bundle-id-identifier com.korlixdeveloper.fax --strict-match-identifier --json --log-stream stderr)
          if python3 -c 'import json,sys; sys.exit(0 if len(json.load(sys.stdin)) == 1 else 1)' <<< "$records"; then
            app-store-connect publish --path artifacts/*.ipa
          else
            echo "The signed IPA is available. Create the Fax by Korlix record in App Store Connect before uploading."
          fi
    artifacts:
      - $CM_BUILD_DIR/apps/fax/artifacts/*.ipa

  fax-android-candidate:
    name: Fax by Korlix signed Play bundle
    instance_type: linux_x2
    max_build_duration: 60
    working_directory: apps/fax
    environment:
      node: 24
      java: 21
      android_signing:
        - KORLIX_FAX_UPLOAD_KEY
    scripts:
      - name: Prepare Android files
        script: npm ci && npm run web && npx cap sync android
      - name: Build and check signed upload bundle
        script: |
          set -eu
          test -f "$CM_KEYSTORE_PATH"
          cd android
          ./gradlew --no-daemon :app:bundleRelease
          jarsigner -verify app/build/outputs/bundle/release/app-release.aab
          keytool -printcert -jarfile app/build/outputs/bundle/release/app-release.aab > /dev/null
    artifacts:
      - $CM_BUILD_DIR/apps/fax/android/app/build/outputs/bundle/release/*.aab

  fax-testflight-invitation:
    name: Fax TestFlight encryption review and private invitation
    instance_type: mac_mini_m2
    max_build_duration: 10
    triggering:
      events:
        - push
      branch_patterns:
        - pattern: feature/fax-mobile-20261125
          include: true
          source: true
    when:
      condition: event.before == "948207433b9675ab56261097126be5ed6dfdb890"
    integrations:
      app_store_connect: Codemagic Korlix AI
    environment:
      groups:
        - fax_testflight
    scripts:
      - name: Load the Apple release tools
        script: |
          set -euo pipefail
          python3 -m venv "$CM_BUILD_DIR/.fax-lookup"
          (
            unset APP_STORE_CONNECT_KEY_IDENTIFIER APP_STORE_CONNECT_ISSUER_ID APP_STORE_CONNECT_PRIVATE_KEY FAX_TESTFLIGHT_TESTER_EMAIL
            "$CM_BUILD_DIR/.fax-lookup/bin/python" -m pip install --quiet --disable-pip-version-check 'codemagic-cli-tools==0.69.0'
          )
      - name: Submit verified encryption details and invite the private tester
        script: |
          set -euo pipefail
          "$CM_BUILD_DIR/.fax-lookup/bin/python" - <<'PY'
          import os
          import time
          import requests
          from codemagic.apple.app_store_connect import AppStoreConnectApiClient
          from codemagic.tools.app_store_connect.arguments import Types

          def configured(arg):
              return arg.from_environment_variable_default().value

          client = AppStoreConnectApiClient(
              key_identifier=configured(Types.KeyIdentifierArgument),
              issuer_id=configured(Types.IssuerIdArgument),
              private_key=configured(Types.PrivateKeyArgument),
              log_requests=False, enable_jwt_cache=False,
          )
          recipient = os.environ["FAX_TESTFLIGHT_TESTER_EMAIL"].strip().casefold()
          if not recipient or "@" not in recipient:
              raise ValueError("The private Fax tester setting is missing.")

          class AppleError(Exception):
              def __init__(self, r):
                  try:
                      errors = r.json().get("errors", [])
                  except ValueError:
                      errors = []
                  details = " | ".join(e.get("code","")+" "+e.get("detail", e.get("title","")) for e in errors)
                  super().__init__("HTTP "+str(r.status_code)+" "+details.replace(recipient,"[designated tester]")[:780])

          def call(method, path, *, params=None, data=None):
              response = requests.request(method, "https://api.appstoreconnect.apple.com/v1/"+path,
                                          headers=client.generate_auth_headers(), params=params,
                                          json={"data": data} if data is not None else None,
                                          allow_redirects=False, timeout=30)
              if not 200 <= response.status_code < 300:
                  raise AppleError(response)
              return response

          def get(path, params=None):
              return call("GET",path,params=params).json()["data"]

          def unique(items, what):
              if len(items) != 1:
                  raise ValueError(f"Expected one {what}, found {len(items)}.")
              return items[0]

          def link(kind, identifier):
              return {"type":kind,"id":identifier}

          bundle = "com.korlixdeveloper.fax"
          rows = get("apps",{"filter[bundleId]":bundle,"fields[apps]":"bundleId,name","limit":2})
          app = unique([a for a in rows if a["attributes"]["bundleId"] == bundle], "Fax app")
          app_id = app["id"]
          group = unique([g for g in get("apps/"+app_id+"/betaGroups",{"limit":200}) if g["attributes"]["name"]=="Fax by Korlix Internal" and g["attributes"]["isInternalGroup"]], "private Fax group")
          gp="betaGroups/"+group["id"]
          def group_tester():
              members=get(gp+"/betaTesters",{"fields[betaTesters]":"email,state","limit":200})
              target=unique([u for u in members if (u["attributes"].get("email") or "").casefold()==recipient],"requested group member")
              return target,len(members)

          tester,count=group_tester()
          expected_build_id="05071f83-0758-49f5-9dae-a79d2a1b44d0"
          builds = get("builds", {"filter[app]":app_id,"filter[version]":"2","limit":200})
          build=unique([b for b in builds if b["id"]==expected_build_id and b["attributes"].get("version")=="2"],"Fax build 2")
          bid=build["id"]
          def internal_state():
              return get("builds/"+bid+"/buildBetaDetail")["attributes"].get("internalBuildState")
          def assigned():
              return any(b["id"]==bid for b in get(gp+"/relationships/builds",{"limit":200}))
          # Resolve the one iOS build and recipient from the private project configuration.
          description = ("Send and receive faxes in a private workspace. Network requests use system HTTPS. "
                         "The bundled PDF reader implements standard AES and RC4 for PDF documents. "
                         "The app also uses standard SHA-256 hashing.")
          facts = {"containsProprietaryCryptography":False, "containsThirdPartyCryptography":True,
                   "availableOnFrenchStore":False}
          def check_storefront():
              settings=get("apps/"+app_id+"/appAvailabilityV2")
              response=requests.get("https://api.appstoreconnect.apple.com/v2/appAvailabilities/"+settings["id"]+"/territoryAvailabilities",
                                    headers=client.generate_auth_headers(),params={"limit":200,"include":"territory","fields[territoryAvailabilities]":"available,territory"},
                                    allow_redirects=False,timeout=35)
              if not response.ok:
                  raise AppleError(response)
              result=response.json()
              enabled={t["relationships"]["territory"]["data"]["id"] for t in result["data"] if t["attributes"].get("available")}
              if result.get("links",{}).get("next") or enabled!={"USA"} or settings["attributes"].get("availableInNewTerritories") is not False:
                  raise RuntimeError("Country selection changed. Recheck the French storefront answer.")
              print("Verified U.S.-only storefront and the exact Fax build.",flush=True)

          def matching_declarations():
              result=call("GET","appEncryptionDeclarations",params={"filter[app]":app_id,"limit":200}).json()
              if result.get("links",{}).get("next"):
                  raise RuntimeError("The app has additional declarations to inspect.")
              return [d for d in result["data"] if all(d["attributes"].get(k) is v for k,v in facts.items())
                      and d["attributes"].get("platform") in {None,"IOS"}]

          def complete_with_apple():
              check_storefront()
              candidates=matching_declarations()
              print("Existing same-app declarations matching the verified technical answers:",len(candidates),flush=True)
              if len(candidates)>1:
                  ok=[d for d in candidates if d["attributes"].get("appEncryptionDeclarationState")=="APPROVED"]
                  candidates=ok if len(ok)==1 else candidates
              explicit_apple_direction=False
              if not candidates:
                  request={"type":"appEncryptionDeclarations","attributes":{"appDescription":description,**facts},
                           "relationships":{"app":{"data":link("apps",app_id)}}}
                  try:
                      reply=call("POST","appEncryptionDeclarations",data=request)
                      declaration=reply.json()["data"]
                      print("Apple accepted the build's technical encryption answers:",reply.status_code,flush=True)
                  except AppleError as error:
                      print("Apple technical assessment response:",error,flush=True)
                      import re
                      message=str(error)
                      directed=re.search(r'(?:set|specify|provide|mark|update|should be|must be).{0,80}usesNonExemptEncryption.{0,45}(?:false|NO)\b|usesNonExemptEncryption.{0,35}(?:should be|must be|to) (?:false|NO)\b',message,re.I)
                      if not directed:
                          return
                      declaration=None
                      explicit_apple_direction=True
              else:
                  declaration=unique(candidates,"matching Fax declaration")
              if declaration:
                  print("APPLE ASSESSMENT:",declaration["attributes"].get("appEncryptionDeclarationState"),
                        "Apple exemption field:",declaration["attributes"].get("exempt"),flush=True)
                  for _ in range(6):
                      d=get("appEncryptionDeclarations/"+declaration["id"])
                      attr=d["attributes"]
                      if attr.get("exempt") is True or attr.get("appEncryptionDeclarationState")=="APPROVED":
                          break
                      if attr.get("appEncryptionDeclarationState") not in {"IN_REVIEW","WAITING_FOR_REVIEW"}:
                          break
                      time.sleep(10)
                  state=attr.get("appEncryptionDeclarationState")
                  print("VERIFIED APPLE DECLARATION STATE:",state,"Apple exemption field:",attr.get("exempt"),flush=True)
                  if state=="APPROVED":
                      try:
                          call("PATCH","builds/"+bid+"/relationships/appEncryptionDeclaration",data=link("appEncryptionDeclarations",d["id"]))
                          print("Apple linked the approved declaration to Fax build 2.",flush=True)
                      except AppleError as error:
                          print("Linking the approved declaration:",error,flush=True)
                          try:
                              call("PATCH","builds/"+bid,data={**link("builds",bid),"relationships":{"appEncryptionDeclaration":{"data":link("appEncryptionDeclarations",d["id"])}}})
                              print("Apple linked the approved declaration on the build resource.",flush=True)
                          except AppleError as second:
                              print("Apple build relationship response:",second,flush=True)
                  explicit_apple_direction=attr.get("exempt") is True
              if explicit_apple_direction and internal_state()=="MISSING_EXPORT_COMPLIANCE":
                  current=get("builds/"+bid,{"fields[builds]":"usesNonExemptEncryption"})["attributes"].get("usesNonExemptEncryption")
                  if current is None:
                      call("PATCH","builds/"+bid,data={**link("builds",bid),"attributes":{"usesNonExemptEncryption":False}})
                      print("Applied Apple's exemption determination to Fax build 2.",flush=True)

          initial=internal_state()
          print("Initial internal testing state:",initial,flush=True)
          if initial=="MISSING_EXPORT_COMPLIANCE":
              try:
                  complete_with_apple()
              except (AppleError,ValueError,RuntimeError,KeyError) as error:
                  print("Apple technical assessment:",error,flush=True)
          state=internal_state()
          for _ in range(6):
              if state!="MISSING_EXPORT_COMPLIANCE":
                  break
              time.sleep(5)
              state=internal_state()
          print("VERIFIED INTERNAL BUILD STATE:",state,flush=True)
          ready=state in {"READY_FOR_BETA_TESTING","IN_BETA_TESTING"} and build["attributes"].get("expired") is False
          if ready and not assigned():
              if count!=1:
                  raise SystemExit("The dedicated group has additional testers.")
              call("POST",gp+"/relationships/builds",data=[link("builds",bid)])
              print("Added build 2 to the designated private group.",flush=True)
          has_build=assigned()
          print("VERIFIED BUILD IN PRIVATE GROUP:",has_build,flush=True)
          before=tester["attributes"].get("state")
          after=group_tester()[0]["attributes"].get("state")
          if ready and has_build:
              if before=="NOT_INVITED" and after in {"INVITED","ACCEPTED","INSTALLED"}:
                  print("Apple issued the private invitation when the build became available.",flush=True)
              else:
                  inv={"type":"betaTesterInvitations","relationships":{"app":{"data":link("apps",app_id)},"betaTester":{"data":link("betaTesters",tester["id"])}}}
                  try:
                      rsp=call("POST","betaTesterInvitations",data=inv)
                      print("APPLE INVITATION EMAIL REQUEST ACCEPTED: HTTP",rsp.status_code,flush=True)
                  except AppleError as error:
                      print("APPLE INVITATION EMAIL REQUEST DECLINED:",error,flush=True)
              for _ in range(3):
                  after=group_tester()[0]["attributes"].get("state")
                  if after in {"INVITED","ACCEPTED","INSTALLED"}:break
                  time.sleep(4)
          print("VERIFIED TESTER STATE:",after,flush=True)
          PY

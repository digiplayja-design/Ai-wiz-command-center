workflows:
  korlix-apple-release-queue:
    name: Korlix Apple release queue (read only)
    instance_type: mac_mini_m2
    max_build_duration: 10
    integrations:
      app_store_connect: Codemagic Korlix AI
    scripts:
      - name: Read current iOS versions, release states and review queues
        script: |
          set -euo pipefail
          tool_env="$CM_BUILD_DIR/.release-queue-venv"
          python3 -m venv "$tool_env"
          "$tool_env/bin/python" -m pip -q install 'codemagic-cli-tools==0.69.0'
          "$tool_env/bin/python" - <<'KORLIX_READ_ONLY'
          import json
          import os
          import sys
          from datetime import datetime, timezone
          from urllib.parse import urlparse
          
          import requests
          from codemagic.apple.app_store_connect import AppStoreConnectApiClient
          from codemagic.tools.app_store_connect.arguments import Types
          
          ORIGIN = "https://api.appstoreconnect.apple.com"
          EDITABLE = {"PREPARE_FOR_SUBMISSION", "READY_FOR_REVIEW", "REJECTED", "METADATA_REJECTED", "DEVELOPER_REJECTED", "INVALID_BINARY"}
          
          def get(path, params=None, optional=False):
              url = path if path.startswith("https://") else ORIGIN + path
              parsed = urlparse(url)
              if parsed.scheme != "https" or parsed.netloc != "api.appstoreconnect.apple.com" or not parsed.path.startswith("/v1/"):
                  raise ValueError("Unexpected Apple API destination")
              response = session.get(url, params=params, headers=client.generate_auth_headers(), allow_redirects=False, timeout=25)
              if response.status_code != 200:
                  if not (optional and response.status_code == 404):
                      errors = response.json().get("errors", []) if "json" in response.headers.get("content-type", "") else []
                      print("READ_STATUS", response.status_code, parsed.path, [e.get("code") for e in errors], flush=True)
                  return {}
              return response.json()
          
          def listing(path, params=None):
              page = get(path, params)
              if "data" not in page:
                  return None
              rows = list(page["data"])
              while page.get("links", {}).get("next"):
                  page = get(page["links"]["next"])
                  if "data" not in page:
                      return None
                  rows.extend(page["data"])
              return rows
          
          def attrs(record):
              return (record or {}).get("attributes", {})
          
          def related_id(record, kind):
              link = record.get("relationships", {}).get(kind, {}).get("data") or {}
              return link.get("id") if isinstance(link, dict) else None
          
          def version_state(version):
              a = attrs(version)
              return a.get("appVersionState") or a.get("appStoreState")
          
          def release_listing(version_id, primary):
              found = listing(f"/v1/appStoreVersions/{version_id}/appStoreVersionLocalizations", {"limit": 100})
              if found is None:
                  return {"localizations": "unavailable"}
              loc = next((v for v in found if attrs(v).get("locale") == primary), found[0] if found else None)
              if not loc:
                  return {"localizations": 0}
              a = attrs(loc)
              result = {"locale": a.get("locale"), "missingFields": [k for k in ("description", "keywords", "supportUrl") if not a.get(k)]}
              sets = listing(f"/v1/appStoreVersionLocalizations/{loc['id']}/appScreenshotSets", {"limit": 100})
              if sets is None:
                  result["screenshots"] = "unavailable"
              else:
                  sets_summary = {}
                  for group in sets:
                      images = listing(f"/v1/appScreenshotSets/{group['id']}/appScreenshots", {"limit": 50})
                      sets_summary[attrs(group).get("screenshotDisplayType", "unknown")] = None if images is None else [attrs(image).get("assetDeliveryState", {}).get("state") for image in images]
                  result["screenshots"] = sets_summary
              return result
          
          def summarize_app(app):
              app_id = app["id"]
              primary = attrs(app).get("primaryLocale")
              out = {"name": attrs(app).get("name"), "appleId": app_id, "versions": [], "submissions": []}
              vp = get(f"/v1/apps/{app_id}/appStoreVersions", {"filter[platform]": "IOS", "include": "build", "limit": 100})
              if "data" not in vp:
                  vp = get(f"/v1/apps/{app_id}/appStoreVersions", {"limit": 100})
              if "data" not in vp or vp.get("links", {}).get("next"):
                  out["versionCoverage"] = "incomplete"
              vs = sorted((v for v in vp.get("data", []) if attrs(v).get("platform") == "IOS"), key=lambda v: attrs(v).get("createdDate") or "", reverse=True)
              builds = {v["id"]: attrs(v) for v in vp.get("included", []) if v.get("type") == "builds"}
              for v in vs:
                  a = attrs(v)
                  state = version_state(v)
                  if len(out["versions"]) >= 5 and state in {"REPLACED_WITH_NEW_VERSION", "REMOVED_FROM_SALE", "DEVELOPER_REMOVED_FROM_SALE"}:
                      continue
                  vid = v["id"]
                  bid = related_id(v, "build")
                  if "build" not in v.get("relationships", {}) or "data" not in v["relationships"]["build"]:
                      payload = get(f"/v1/appStoreVersions/{vid}/build", optional=True)
                      b = payload.get("data") or {}
                      bid = b.get("id")
                      if bid:
                          builds[bid] = attrs(b)
                  if bid and bid not in builds:
                      builds[bid] = attrs(get(f"/v1/builds/{bid}").get("data"))
                  build = builds.get(bid, {})
                  row = {"version": a.get("versionString"), "state": state, "release": a.get("releaseType"), "selectedBuild": build.get("version"), "buildState": build.get("processingState")}
                  if state in EDITABLE:
                      row["listing"] = release_listing(vid, primary)
                      row["copyrightPresent"] = bool(a.get("copyright"))
                  out["versions"].append(row)
              sp = get(f"/v1/apps/{app_id}/reviewSubmissions", {"limit": 100})
              if "data" not in sp or sp.get("links", {}).get("next"):
                  out["submissionCoverage"] = "incomplete"
              for sub in sp.get("data", []):
                  a = attrs(sub)
                  if a.get("platform") not in {"IOS", None} or a.get("state") in {"COMPLETE", "CANCELED"}:
                      continue
                  items = get(f"/v1/reviewSubmissions/{sub['id']}/items", {"include": "appStoreVersion", "limit": 50})
                  versions = {r["id"]: attrs(r).get("versionString") for r in items.get("included", []) if r.get("type") == "appStoreVersions"}
                  out["submissions"].append({"state": a.get("state"), "submitted": a.get("submittedDate"), "items": [{"state": attrs(item).get("state"), "version": versions.get(related_id(item, "appStoreVersion"))} for item in items.get("data", [])], "itemsReadable": "data" in items})
              params = {"filter[app]": app_id, "sort": "-uploadedDate", "include": "preReleaseVersion", "limit": 3}
              latest = get("/v1/builds", params)
              trains = {v["id"]: attrs(v) for v in latest.get("included", []) if v.get("type") == "preReleaseVersions"}
              out["recentBuilds"] = [{"train": trains.get(related_id(b, "preReleaseVersion"), {}).get("version"), "build": attrs(b).get("version"), "state": attrs(b).get("processingState"), "expired": attrs(b).get("expired"), "uploaded": attrs(b).get("uploadedDate")} for b in latest.get("data", [])]
              return out
          
          if __name__ == "__main__":
              try:
                  client = AppStoreConnectApiClient(
                      key_identifier=Types.KeyIdentifierArgument(os.environ["APP_STORE_CONNECT_KEY_IDENTIFIER"]).value,
                      issuer_id=Types.IssuerIdArgument(os.environ["APP_STORE_CONNECT_ISSUER_ID"]).value,
                      private_key=Types.PrivateKeyArgument(os.environ["APP_STORE_CONNECT_PRIVATE_KEY"]).value,
                      log_requests=False, enable_jwt_cache=False,
                  )
                  with requests.Session() as session:
                      apps = listing("/v1/apps", {"fields[apps]": "name,bundleId,primaryLocale", "limit": 200})
                      if apps is None:
                          raise RuntimeError("App inventory unavailable")
                      selected = [a for a in apps if "korlix" in (str(attrs(a).get("name")) + " " + str(attrs(a).get("bundleId"))).lower()]
                      print("PORTFOLIO_START", datetime.now(timezone.utc).isoformat(), "teamApps", len(apps), "matched", len(selected), flush=True)
                      for app in selected:
                          print("PORTFOLIO_APP", json.dumps(summarize_app(app), separators=(",", ":")), flush=True)
                      print("PORTFOLIO_COMPLETE", len(selected), flush=True)
              except Exception as exc:
                  print("Portfolio read did not finish:", type(exc).__name__, file=sys.stderr)
                  sys.exit(1)
          KORLIX_READ_ONLY

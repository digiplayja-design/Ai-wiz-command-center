workflows:
  korlix-ios-testflight:
    name: Korlix AI iOS TestFlight
    instance_type: mac_mini_m2
    max_build_duration: 60

    integrations:
      app_store_connect: Codemagic Korlix AI

    environment:
      flutter: stable
      xcode: latest
      cocoapods: default
      ios_signing:
        provisioning_profiles:
          - KORLIX_APP_STORE_PROFILE
        certificates:
          - KORLIX_APP_STORE_CERT

    scripts:
      - name: Show project files
        script: |
          pwd
          ls -la
          ls -la ios
          find ios/Runner.xcodeproj -name "*.xcscheme" -print || true

      - name: Flutter pub get
        script: |
          flutter pub get

      - name: Install CocoaPods
        script: |
          cd ios
          pod install --repo-update
          cd ..

      - name: Apply iOS code signing
        script: |
          xcode-project use-profiles

      - name: Build iOS IPA
        script: |
          set -e

          echo "Building IPA..."
          VERSION_LINE="$(grep '^version:' pubspec.yaml | awk '{print $2}')"
          BUILD_NAME="${VERSION_LINE%%+*}"
          BUILD_NUMBER="${VERSION_LINE##*+}"
          echo "Building IPA version $BUILD_NAME ($BUILD_NUMBER)..."
          flutter build ipa --release --build-name="$BUILD_NAME" --build-number="$BUILD_NUMBER" --export-options-plist=/Users/builder/export_options.plist
          echo ""
          echo "Searching for generated IPA files..."
          find build -type f -name "*.ipa" -print || true

          mkdir -p artifacts

          IPA_PATH="$(find build -type f -name "*.ipa" | head -n 1 || true)"

          if [ -z "$IPA_PATH" ]; then
            echo "ERROR: No IPA file was created."
            echo ""
            echo "Debugging build/ios contents:"
            find build/ios -maxdepth 5 -type f -print || true
            exit 1
          fi

          echo "Found IPA: $IPA_PATH"
          cp "$IPA_PATH" artifacts/KorlixAI.ipa

          echo ""
          echo "Final artifacts folder:"
          ls -lah artifacts

    artifacts:
      - artifacts/*.ipa
      - /tmp/xcodebuild_logs/*.log
      - flutter_drive.log

    publishing:
      app_store_connect:
        auth: integration
        submit_to_testflight: true
        submit_to_app_store: false

  android-release:
    name: Android Release AAB
    max_build_duration: 120
    instance_type: linux_x2
    environment:
      flutter: stable
    scripts:
      - name: Install Android SDK 36
        script: |
          SDKMANAGER=""
          if command -v sdkmanager >/dev/null 2>&1; then
            SDKMANAGER="$(command -v sdkmanager)"
          elif [ -x "$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager" ]; then
            SDKMANAGER="$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager"
          elif [ -x "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" ]; then
            SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          fi

          if [ -n "$SDKMANAGER" ]; then
            yes | "$SDKMANAGER" "platforms;android-36" "build-tools;36.0.0" || true
          else
            echo "sdkmanager not found; continuing with installed Android SDKs"
          fi
      - name: Show project files
        script: |
          pwd
          ls -la
          grep '^version:' pubspec.yaml
      - name: Flutter pub get
        script: |
          flutter pub get
      - name: Force Flutter plugin compileSdk 36
        script: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          roots = [
              Path.home() / ".pub-cache",
              Path("/Users/builder/.pub-cache"),
              Path("/root/.pub-cache"),
          ]

          patterns = [
              (r"(?m)^(\s*)compileSdk\s*=\s*(?:flutter\.compileSdkVersion|\d+)\s*$", r"\1compileSdk = 36"),
              (r"(?m)^(\s*)compileSdk\s+(?:flutter\.compileSdkVersion|\d+)\s*$", r"\1compileSdk 36"),
              (r"(?m)^(\s*)compileSdkVersion\s+(?:flutter\.compileSdkVersion|\d+)\s*$", r"\1compileSdkVersion 36"),
              (r"(?m)^(\s*)compileSdkVersion\s*\((?:flutter\.compileSdkVersion|\d+)\)\s*$", r"\1compileSdk = 36"),
          ]

          patched = 0

          for root in roots:
              if not root.exists():
                  continue

              for file in root.rglob("build.gradle*"):
                  path_text = str(file)
                  if "/android/" not in path_text and "\\android\\" not in path_text:
                      continue

                  try:
                      text = file.read_text()
                  except Exception:
                      continue

                  original = text

                  for pattern, replacement in patterns:
                      text = re.sub(pattern, replacement, text)

                  if text != original:
                      file.write_text(text)
                      patched += 1
                      print(f"patched {file}")

          print(f"Flutter plugin Gradle files patched: {patched}")
          PY

      - name: Analyze Flutter
        script: |
          flutter analyze
      - name: Build Android App Bundle
        script: |
          VERSION_LINE="$(grep '^version:' pubspec.yaml | awk '{print $2}')"
          BUILD_NAME="${VERSION_LINE%%+*}"
          BUILD_NUMBER="${VERSION_LINE##*+}"
          echo "Building Android AAB version $BUILD_NAME ($BUILD_NUMBER)..."
          flutter build appbundle --release --build-name="$BUILD_NAME" --build-number="$BUILD_NUMBER"
          mkdir -p artifacts
          cp build/app/outputs/bundle/release/app-release.aab artifacts/KorlixAI.aab
          echo "Android artifacts:"
          ls -lah artifacts
    artifacts:
      - artifacts/*.aab

  esha-native-validation:
    name: Esha by Korlix — native test builds
    instance_type: mac_mini_m2
    max_build_duration: 60
    working_directory: apps/esha
    # Manual alternative to the path-filtered GitHub pull-request/push checks.
    # No provisioning profiles, upload keys, triggering events, or publishing.
    environment:
      flutter: 3.47.9
      xcode: 26.6
      java: 17
      cocoapods: default
    scripts:
      - name: Validate locked Esha source and behavior
        script: bash "$CM_BUILD_DIR/scripts/esha/validate.sh"
      - name: Build Android debug APK and unsigned release bundle
        script: bash "$CM_BUILD_DIR/scripts/esha/build_android.sh" unsigned
      - name: Build iOS Simulator application
        script: bash "$CM_BUILD_DIR/scripts/esha/build_ios_simulator.sh"
    artifacts:
      - $CM_BUILD_DIR/apps/esha/artifacts/android/*
      - $CM_BUILD_DIR/apps/esha/artifacts/ios/*
      - /tmp/xcodebuild_logs/*.log

  esha-android-candidate:
    name: Esha by Korlix — signed Android candidate
    instance_type: linux_x2
    max_build_duration: 60
    working_directory: apps/esha
    # Manual only. No Play upload or publication is configured.
    # ESHA_ANDROID_UPLOAD_KEY must be configured specifically for Esha.
    environment:
      flutter: 3.47.9
      java: 17
      groups:
        - esha_release
      android_signing:
        - ESHA_ANDROID_UPLOAD_KEY
    scripts:
      - name: Validate locked Esha source and behavior
        script: bash "$CM_BUILD_DIR/scripts/esha/validate.sh"
      - name: Build with Esha's dedicated upload identity
        script: |
          set -euo pipefail
          export ESHA_ANDROID_STORE_FILE="${CM_KEYSTORE_PATH:?Configure ESHA_ANDROID_UPLOAD_KEY in Codemagic}"
          export ESHA_ANDROID_STORE_PASSWORD="${CM_KEYSTORE_PASSWORD:?Esha keystore password is required}"
          export ESHA_ANDROID_KEY_ALIAS="${CM_KEY_ALIAS:?Esha upload key alias is required}"
          export ESHA_ANDROID_KEY_PASSWORD="${CM_KEY_PASSWORD:?Esha key password is required}"
          : "${ESHA_ANDROID_UPLOAD_CERT_SHA256:?Set the approved Esha upload certificate fingerprint in esha_release}"
          bash "$CM_BUILD_DIR/scripts/esha/build_android.sh" signed
    artifacts:
      - $CM_BUILD_DIR/apps/esha/artifacts/android/Esha-signed-candidate.aab
      - $CM_BUILD_DIR/apps/esha/artifacts/android/Esha-signed-verification.json

  esha-ios-candidate:
    name: Esha by Korlix — signed iOS candidate
    instance_type: mac_mini_m2
    max_build_duration: 60
    working_directory: apps/esha
    # Existing Korlix integration; Esha still requires its own Apple app record
    # and exact bundle-specific profile. No record creation or upload occurs.
    integrations:
      app_store_connect: Codemagic Korlix AI
    environment:
      flutter: 3.47.9
      xcode: 26.6
      cocoapods: default
      groups:
        - esha_release
      ios_signing:
        provisioning_profiles:
          - profile: ESHA_APP_STORE_PROFILE
            environment_variable: ESHA_APP_STORE_PROFILE_PATH
        certificates:
          - KORLIX_APP_STORE_CERT
    scripts:
      - name: Install the verified Apple release CLI
        script: |
          set -euo pipefail
          python3 -m venv "$CM_BUILD_DIR/.esha-ios-tools"
          "$CM_BUILD_DIR/.esha-ios-tools/bin/pip" install 'codemagic-cli-tools==0.69.0'
          printf 'PATH=%s/.esha-ios-tools/bin:%s\n' "$CM_BUILD_DIR" "$PATH" >> "$CM_ENV"
      - name: Verify Esha's own Apple app record and profile
        script: |
          set -euo pipefail
          : "${ESHA_APP_STORE_ID:?Set the actual Esha Apple app ID in esha_release}"
          : "${ESHA_APPLE_TEAM_ID:?Set the Esha Apple Developer team ID in esha_release}"
          python3 "$CM_BUILD_DIR/scripts/esha/prepare_ios_release.py" --environment-file "$CM_ENV"
      - name: Validate locked Esha source and behavior
        script: bash "$CM_BUILD_DIR/scripts/esha/validate.sh"
      - name: Build and verify Esha's signed IPA
        script: bash "$CM_BUILD_DIR/scripts/esha/build_ios_candidate.sh"
    artifacts:
      - $CM_BUILD_DIR/apps/esha/artifacts/ios/Esha-signed-candidate.ipa
      - $CM_BUILD_DIR/apps/esha/artifacts/ios/Esha-signed-verification.json
      - $CM_BUILD_DIR/apps/esha/build/ios/archive/Runner.xcarchive/dSYMs/*.dSYM
      - /tmp/xcodebuild_logs/*.log
    # Deliberately no publishing section: review the candidate before any
    # separately authorized TestFlight, App Store, or public store submission.

  esha-ios-upload:
    name: Esha by Korlix — build and upload verified iOS build
    instance_type: mac_mini_m2
    max_build_duration: 60
    working_directory: apps/esha
    # Manual upload after Esha's dedicated profile and Apple connection work.
    # No beta-review submission, tester invitations, or App Store review request.
    integrations:
      app_store_connect: Codemagic Korlix AI
    environment:
      flutter: 3.47.9
      xcode: 26.6
      cocoapods: default
      groups:
        - esha_release
      ios_signing:
        provisioning_profiles:
          - profile: ESHA_APP_STORE_PROFILE
            environment_variable: ESHA_APP_STORE_PROFILE_PATH
        certificates:
          - KORLIX_APP_STORE_CERT
    scripts:
      - name: Install the verified Apple release CLI
        script: |
          set -euo pipefail
          python3 -m venv "$CM_BUILD_DIR/.esha-ios-tools"
          "$CM_BUILD_DIR/.esha-ios-tools/bin/pip" install 'codemagic-cli-tools==0.69.0'
          printf 'PATH=%s/.esha-ios-tools/bin:%s\n' "$CM_BUILD_DIR" "$PATH" >> "$CM_ENV"
      - name: Verify Esha's own Apple app record and profile
        script: |
          set -euo pipefail
          : "${ESHA_APP_STORE_ID:?Set the actual Esha Apple app ID in esha_release}"
          : "${ESHA_APPLE_TEAM_ID:?Set the Esha Apple Developer team ID in esha_release}"
          python3 "$CM_BUILD_DIR/scripts/esha/prepare_ios_release.py" --environment-file "$CM_ENV"
      - name: Validate locked Esha source and behavior
        script: bash "$CM_BUILD_DIR/scripts/esha/validate.sh"
      - name: Build and verify Esha's signed IPA before upload
        script: bash "$CM_BUILD_DIR/scripts/esha/build_ios_candidate.sh"
    artifacts:
      - $CM_BUILD_DIR/apps/esha/artifacts/ios/Esha-signed-candidate.ipa
      - $CM_BUILD_DIR/apps/esha/artifacts/ios/Esha-signed-verification.json
      - $CM_BUILD_DIR/apps/esha/build/ios/archive/Runner.xcarchive/dSYMs/*.dSYM
      - /tmp/xcodebuild_logs/*.log
    publishing:
      app_store_connect:
        auth: integration
        submit_to_testflight: false
        submit_to_app_store: false

  esha-apple-draft-listing:
    name: Esha by Korlix — synchronize existing Apple draft listing
    instance_type: mac_mini_m2
    max_build_duration: 15
    working_directory: apps/esha
    # Manual only, after repairing the existing Apple integration.
    # Revalidates Esha identity and editable state before each allowlisted write.
    # No app creation, upload, review submission, declarations or access changes.
    integrations:
      app_store_connect: Codemagic Korlix AI
    environment:
      groups:
        - esha_release
    scripts:
      - name: Install the pinned Apple listing CLI
        script: |
          set -euo pipefail
          python3 -m venv "$CM_BUILD_DIR/.esha-apple-listing-tools"
          "$CM_BUILD_DIR/.esha-apple-listing-tools/bin/pip" install 'codemagic-cli-tools==0.69.0'
      - name: Synchronize and verify Esha's existing draft fields
        script: |
          set -euo pipefail
          "$CM_BUILD_DIR/.esha-apple-listing-tools/bin/python" "$CM_BUILD_DIR/scripts/esha/sync_apple_listing.py" --apply-draft
    artifacts:
      - $CM_BUILD_DIR/apps/esha/artifacts/apple-listing/Esha-Apple-draft-listing-verification.json

  esha-apple-subscription-plan:
    name: Esha by Korlix — plan Apple monthly subscription
    instance_type: mac_mini_m2
    max_build_duration: 10
    working_directory: apps/esha
    integrations:
      app_store_connect: Codemagic Korlix AI
    environment:
      groups:
        - esha_release
    scripts:
      - name: Install the pinned Apple subscription CLI
        script: |
          set -euo pipefail
          python3 -m venv "$CM_BUILD_DIR/.esha-apple-subscription-tools"
          "$CM_BUILD_DIR/.esha-apple-subscription-tools/bin/pip" install 'codemagic-cli-tools==0.69.0'
      - name: Plan Esha's exact monthly subscription without changing Apple
        script: |
          set -euo pipefail
          "$CM_BUILD_DIR/.esha-apple-subscription-tools/bin/python" "$CM_BUILD_DIR/scripts/esha/prepare_apple_subscription.py"
    artifacts:
      - $CM_BUILD_DIR/apps/esha/artifacts/apple-subscription/Esha-Apple-subscription-draft-verification.json

  esha-apple-subscription-draft:
    name: Esha by Korlix — prepare Apple monthly subscription draft
    instance_type: mac_mini_m2
    max_build_duration: 10
    working_directory: apps/esha
    # Manual create-missing draft only: USA, $4.99/month, eligible three-day trial.
    # Rechecks exact app identity and records every write and scoped readback.
    integrations:
      app_store_connect: Codemagic Korlix AI
    environment:
      groups:
        - esha_release
    scripts:
      - name: Install the pinned Apple subscription CLI
        script: |
          set -euo pipefail
          python3 -m venv "$CM_BUILD_DIR/.esha-apple-subscription-tools"
          "$CM_BUILD_DIR/.esha-apple-subscription-tools/bin/pip" install 'codemagic-cli-tools==0.69.0'
      - name: Create and verify only Esha's missing monthly subscription draft
        script: |
          set -euo pipefail
          "$CM_BUILD_DIR/.esha-apple-subscription-tools/bin/python" "$CM_BUILD_DIR/scripts/esha/prepare_apple_subscription.py" --apply-draft
    artifacts:
      - $CM_BUILD_DIR/apps/esha/artifacts/apple-subscription/Esha-Apple-subscription-draft-verification.json

  esha-apple-release-inventory:
    name: Esha by Korlix — inspect Apple release readiness
    instance_type: mac_mini_m2
    max_build_duration: 10
    working_directory: apps/esha
    # Manual, GET-only inventory of records bound to Esha's verified app.
    integrations:
      app_store_connect: Codemagic Korlix AI
    environment:
      groups:
        - esha_release
    scripts:
      - name: Install the pinned Apple inventory CLI
        script: |
          set -euo pipefail
          python3 -m venv "$CM_BUILD_DIR/.esha-apple-inventory-tools"
          "$CM_BUILD_DIR/.esha-apple-inventory-tools/bin/pip" install 'codemagic-cli-tools==0.69.0'
      - name: Inspect Esha's Apple records without changing them
        script: |
          set -euo pipefail
          "$CM_BUILD_DIR/.esha-apple-inventory-tools/bin/python" "$CM_BUILD_DIR/scripts/esha/inspect_apple_release.py"
    artifacts:
      - $CM_BUILD_DIR/apps/esha/artifacts/apple-inventory/Esha-Apple-release-inventory.json

  esha-ios-signing-setup:
    name: Esha by Korlix — verify and prepare iOS profile
    instance_type: mac_mini_m2
    max_build_duration: 15
    working_directory: apps/esha
    # Manual only. Reuse the existing identity; create at most one Esha profile.
    # No certificate/key creation, capability changes, builds, or uploading.
    integrations:
      app_store_connect: Codemagic Korlix AI
    environment:
      xcode: 26.6
      groups:
        - esha_release
      ios_signing:
        # Bootstrap asset import only: Codemagic requires a profile here.
        # This job never configures Xcode or builds/signs with the Korlix profile.
        provisioning_profiles:
          - KORLIX_APP_STORE_PROFILE
        certificates:
          - KORLIX_APP_STORE_CERT
    scripts:
      - name: Install the pinned Apple signing CLI
        script: |
          set -euo pipefail
          python3 -m venv "$CM_BUILD_DIR/.esha-ios-profile-tools"
          "$CM_BUILD_DIR/.esha-ios-profile-tools/bin/pip" install 'codemagic-cli-tools==0.69.0'
      - name: Verify the existing identity and prepare only Esha's profile
        script: |
          set -euo pipefail
          "$CM_BUILD_DIR/.esha-ios-profile-tools/bin/python" "$CM_BUILD_DIR/scripts/esha/prepare_ios_profile.py"
    artifacts:
      - $CM_BUILD_DIR/apps/esha/artifacts/ios-signing/Esha-App-Store.mobileprovision
      - $CM_BUILD_DIR/apps/esha/artifacts/ios-signing/Esha-iOS-signing-setup-verification.json

workflows:
  korlix-brain-apple-products:
    name: KORLIX Brain+Voice — approved Apple product setup
    instance_type: mac_mini_m2
    max_build_duration: 15
    integrations:
      app_store_connect: Codemagic Korlix AI
    # Manual only. Reuses existing Apple access; does not upload a binary,
    # submit review, invite testers, change credentials, or enable billing.
    scripts:
      - name: Validate approved catalog setup
        script: |
          set -euo pipefail
          python3 -m unittest discover -s scripts/tests -p 'test_brain_apple_products.py' -v
      - name: Configure approved Apple product metadata and US prices
        script: |
          set -euo pipefail
          python3 -m venv "$CM_BUILD_DIR/.brain-product-tools"
          "$CM_BUILD_DIR/.brain-product-tools/bin/pip" install 'codemagic-cli-tools==0.69.0'
          "$CM_BUILD_DIR/.brain-product-tools/bin/python" scripts/configure_brain_apple_products.py \
            --apply --output artifacts/brain-apple-products.json
    artifacts:
      - artifacts/brain-apple-products.json

  korlix-ai-ios-appstore: &korlix_ai_ios_release
    name: Korlix AI iOS App Store
    instance_type: mac_mini_m2
    max_build_duration: 60
    integrations:
      app_store_connect: Codemagic Korlix AI
    environment:
      flutter: 3.47.7
      xcode: 26.6
      cocoapods: default
      ios_signing:
        provisioning_profiles:
          - KORLIX_APP_STORE_PROFILE
        certificates:
          - KORLIX_APP_STORE_CERT
    scripts:
      - name: Install pinned Apple release tools
        script: |
          set -euo pipefail
          python3 -m venv "$CM_BUILD_DIR/.ios-release-tools"
          "$CM_BUILD_DIR/.ios-release-tools/bin/pip" install 'codemagic-cli-tools==0.69.0'
          printf 'PATH=%s/.ios-release-tools/bin:%s\n' "$CM_BUILD_DIR" "$PATH" >> "$CM_ENV"
      - name: Verify existing Apple app and choose next build
        script: |
          set -euo pipefail
          python3 scripts/prepare_ios_release.py \
            --bundle-id com.korlixdeveloper.korlixai --app-id 6783100102 \
            --require-existing-build --environment-file "$CM_ENV"
          cp docs/releases/crm-spreadsheet-20261030/korlix-ai-notes.txt release_notes_en-US.txt
      - name: Validate current iOS app and shared calling code
        script: |
          set -euo pipefail
          flutter --suppress-analytics --no-version-check pub get --enforce-lockfile
          flutter analyze --no-pub lib/auth/korlix_email_confirmation.dart lib/support test/support
          flutter test --no-pub --reporter expanded \
            test/auth/korlix_email_confirmation_test.dart test/auth_welcome_test.dart \
            test/auth_remember_login_test.dart test/auth_october_integration_test.dart \
            test/signup_eligibility_test.dart test/signup_accessibility_release_test.dart \
            test/auth_device_session_test.dart test/auth/korlix_session_refresh_test.dart \
            test/auth/korlix_http_test.dart test/registration_discovery_test.dart \
            test/korlix_entry_intro_test.dart test/apple_billing_test.dart \
            test/privacy/korlix_privacy_settings_test.dart \
            test/privacy/korlix_third_party_ai_consent_test.dart \
            test/privacy/korlix_third_party_ai_privacy_statement_test.dart \
            test/support/ai_output_report_test.dart test/support/report_image_test.dart \
            test/social_calls_test.dart test/social_call_audio_test.dart \
            test/social_call_reliability_test.dart test/social_screen_sharing_test.dart \
            test/social_communication_upgrade_test.dart \
            test/social_presence_model_test.dart test/social_presence_toggle_test.dart
      - name: Validate CRM spreadsheet import and Rici lifecycle
        script: |
          set -euo pipefail
          flutter analyze --no-pub lib/contacts_crm/contact_import.dart \
            lib/contacts_crm/contacts_client.dart lib/contacts_crm/contacts_screen.dart \
            lib/contacts_crm/contacts_style.dart test/contacts_crm/spreadsheet_import_test.dart \
            test/live_convo/crm_voice_lifecycle_test.dart
          flutter test --no-pub --reporter expanded \
            test/contacts_crm test/live_convo/crm_voice_lifecycle_test.dart
      - name: Prepare native dependencies and apply existing app signing
        script: |
          set -euo pipefail
          flutter build ios --release --config-only --no-codesign --no-pub \
            --build-name="$KORLIX_IOS_VERSION" --build-number="$KORLIX_IOS_BUILD_NUMBER"
          xcode-project use-profiles --project ios/Runner.xcodeproj \
            --export-options-plist "$CM_BUILD_DIR/ios-release-export.plist" \
            --custom-export-options '{"manageAppVersionAndBuildNumber": false}'
      - name: Build and verify Korlix AI IPA
        script: |
          set -euo pipefail
          flutter build ipa --release --no-pub \
            --build-name="$KORLIX_IOS_VERSION" --build-number="$KORLIX_IOS_BUILD_NUMBER" \
            --export-options-plist="$CM_BUILD_DIR/ios-release-export.plist"
          mkdir -p artifacts
          IPA_FILES=(build/ios/ipa/*.ipa)
          test "${#IPA_FILES[@]}" -eq 1
          python3 scripts/verify_ios_ipa.py "${IPA_FILES[0]}" \
            --bundle-id com.korlixdeveloper.korlixai --version "$KORLIX_IOS_VERSION" \
            --build "$KORLIX_IOS_BUILD_NUMBER" --output artifacts/KorlixAI-verification.json
          cp "${IPA_FILES[0]}" artifacts/KorlixAI.ipa
    artifacts:
      - artifacts/*.ipa
      - artifacts/*-verification.json
      - build/ios/archive/Runner.xcarchive/dSYMs/*.dSYM
      - /tmp/xcodebuild_logs/*.log
    publishing:
      app_store_connect:
        auth: integration
        submit_to_testflight: false
        submit_to_app_store: true
        cancel_previous_submissions: false
        release_type: AFTER_APPROVAL

  korlix-ai-ios-testflight:
    <<: *korlix_ai_ios_release
    name: Korlix AI CRM iOS TestFlight Upload
    publishing:
      app_store_connect:
        auth: integration
        # Upload the verified IPA for internal testing; assign the existing
        # internal group only after Apple finishes processing this build.
        submit_to_testflight: false
        submit_to_app_store: false

  korlix-messenger-ios-appstore: &messenger_ios_release
    name: KORLIX Messenger iOS App Store
    instance_type: mac_mini_m2
    max_build_duration: 60
    working_directory: apps/korlix_messenger
    integrations:
      app_store_connect: Codemagic Korlix AI
    environment:
      flutter: 3.47.7
      xcode: 26.6
      cocoapods: default
      # Messenger has its own App Store profile and reuses the existing
      # distribution certificate. Never use Korlix AI's provisioning profile.
      ios_signing:
        provisioning_profiles:
          - KORLIX_MESSENGER_APP_STORE_PROFILE
        certificates:
          - KORLIX_APP_STORE_CERT
    scripts:
      - name: Install pinned Apple release tools
        script: |
          set -euo pipefail
          python3 -m venv "$CM_BUILD_DIR/.ios-release-tools"
          "$CM_BUILD_DIR/.ios-release-tools/bin/pip" install 'codemagic-cli-tools==0.69.0'
          printf 'PATH=%s/.ios-release-tools/bin:%s\n' "$CM_BUILD_DIR" "$PATH" >> "$CM_ENV"
      - name: Verify Messenger Apple record and choose next build
        script: |
          set -euo pipefail
          python3 "$CM_BUILD_DIR/scripts/prepare_ios_release.py" \
            --bundle-id com.korlixdeveloper.messenger --app-id 6828213082 \
            --environment-file "$CM_ENV"
          cp "$CM_BUILD_DIR/docs/releases/ios-20261028/korlix-messenger-notes.txt" release_notes_en-US.txt
      - name: Validate standalone Messenger
        script: |
          set -euo pipefail
          flutter --suppress-analytics --no-version-check pub get --enforce-lockfile
          flutter analyze --no-pub
          flutter test --no-pub --reporter expanded
      - name: Validate shared call recovery
        working_directory: .
        script: |
          set -euo pipefail
          flutter --suppress-analytics --no-version-check pub get --enforce-lockfile
          flutter test --no-pub --reporter expanded \
            test/social_calls_test.dart test/social_call_audio_test.dart \
            test/social_call_reliability_test.dart test/social_screen_sharing_test.dart \
            test/social_communication_upgrade_test.dart \
            test/social_presence_model_test.dart test/social_presence_toggle_test.dart
      - name: Prepare native dependencies and apply Messenger signing
        script: |
          set -euo pipefail
          flutter build ios --release --config-only --no-codesign --no-pub \
            --build-name="$KORLIX_IOS_VERSION" --build-number="$KORLIX_IOS_BUILD_NUMBER"
          xcode-project use-profiles --project ios/Runner.xcodeproj \
            --export-options-plist "$CM_BUILD_DIR/messenger-ios-release-export.plist" \
            --custom-export-options '{"manageAppVersionAndBuildNumber": false}'
      - name: Build and verify Messenger IPA
        script: |
          set -euo pipefail
          flutter build ipa --release --no-pub \
            --build-name="$KORLIX_IOS_VERSION" --build-number="$KORLIX_IOS_BUILD_NUMBER" \
            --export-options-plist="$CM_BUILD_DIR/messenger-ios-release-export.plist"
          mkdir -p artifacts
          IPA_FILES=(build/ios/ipa/*.ipa)
          test "${#IPA_FILES[@]}" -eq 1
          python3 "$CM_BUILD_DIR/scripts/verify_ios_ipa.py" "${IPA_FILES[0]}" \
            --bundle-id com.korlixdeveloper.messenger --version "$KORLIX_IOS_VERSION" \
            --build "$KORLIX_IOS_BUILD_NUMBER" --require-push \
            --output artifacts/KorlixMessenger-verification.json
          cp "${IPA_FILES[0]}" artifacts/KorlixMessenger.ipa
          test -s "$CM_BUILD_DIR/apps/korlix_messenger/artifacts/KorlixMessenger.ipa"
          test -s "$CM_BUILD_DIR/apps/korlix_messenger/artifacts/KorlixMessenger-verification.json"
    artifacts:
      # Use absolute clone paths so artifact collection is independent of the
      # workflow working_directory used by the standalone Messenger app.
      - $CM_BUILD_DIR/apps/korlix_messenger/artifacts/*.ipa
      - $CM_BUILD_DIR/apps/korlix_messenger/artifacts/*-verification.json
      - $CM_BUILD_DIR/apps/korlix_messenger/build/ios/archive/Runner.xcarchive/dSYMs/*.dSYM
      - /tmp/xcodebuild_logs/*.log
    publishing:
      app_store_connect:
        auth: integration
        submit_to_testflight: false
        submit_to_app_store: true
        # Replace the existing Messenger review with the corrected build.
        cancel_previous_submissions: true
        release_type: AFTER_APPROVAL

  korlix-messenger-ios-testflight:
    <<: *messenger_ios_release
    name: KORLIX Messenger iOS TestFlight Upload
    publishing:
      app_store_connect:
        auth: integration
        # Upload for internal testing. Beta review and tester distribution are
        # configured after Apple's processing and the first-app setup checks.
        submit_to_testflight: false
        submit_to_app_store: false

  korlix-ios-testflight:
    name: Korlix AI iOS TestFlight
    instance_type: mac_mini_m2
    max_build_duration: 60

    integrations:
      app_store_connect: Codemagic Korlix AI

    environment:
      flutter: 3.47.7
      xcode: 26.6
      cocoapods: default
      ios_signing:
        provisioning_profiles:
          - KORLIX_APP_STORE_PROFILE
        certificates:
          - KORLIX_APP_STORE_CERT

    scripts:
      - name: Show project files
        script: |
          pwd
          ls -la
          ls -la ios
          find ios/Runner.xcodeproj -name "*.xcscheme" -print || true

      - name: Flutter pub get
        script: |
          flutter --suppress-analytics --no-version-check pub get --enforce-lockfile

      - name: Verify email confirmation and session integration
        script: |
          set -euo pipefail
          flutter --suppress-analytics --no-version-check analyze --no-pub lib/auth/korlix_email_confirmation.dart test/auth/korlix_email_confirmation_test.dart
          flutter --suppress-analytics --no-version-check test --no-pub --reporter expanded \
            test/auth/korlix_email_confirmation_test.dart \
            test/auth_welcome_test.dart test/auth_remember_login_test.dart \
            test/auth_october_integration_test.dart test/signup_eligibility_test.dart \
            test/auth_device_session_test.dart test/auth/korlix_session_refresh_test.dart \
            test/auth/korlix_http_test.dart test/registration_discovery_test.dart \
            test/korlix_entry_intro_test.dart

      - name: Verify image report attachments
        script: |
          set -euo pipefail
          flutter --suppress-analytics --no-version-check analyze --no-pub lib/support test/support
          flutter --suppress-analytics --no-version-check test --no-pub --reporter expanded test/support/ai_output_report_test.dart test/support/report_image_test.dart

      - name: Select the next iOS build number
        script: |
          set -euo pipefail
          KORLIX_LAST_IOS_BUILD="$(app-store-connect get-latest-testflight-build-number 6783100102 --platform IOS)"
          if [[ ! "$KORLIX_LAST_IOS_BUILD" =~ ^[0-9]+$ ]]; then
            echo 'Could not verify the latest iOS build number.' >&2
            exit 1
          fi
          KORLIX_SOURCE_BUILD="$(sed -n 's/^version: .*+//p' pubspec.yaml)"
          KORLIX_NEXT_IOS_BUILD=$((10#$KORLIX_LAST_IOS_BUILD + 1))
          if (( KORLIX_NEXT_IOS_BUILD < KORLIX_SOURCE_BUILD )); then
            KORLIX_NEXT_IOS_BUILD="$KORLIX_SOURCE_BUILD"
          fi
          printf 'KORLIX_IOS_BUILD_NUMBER=%s\n' "$KORLIX_NEXT_IOS_BUILD" >> "$CM_ENV"
          printf 'Verified latest iOS build %s; building %s next.\n' "$KORLIX_LAST_IOS_BUILD" "$KORLIX_NEXT_IOS_BUILD"

      - name: Install CocoaPods
        script: |
          cd ios
          pod install --repo-update
          cd ..

      - name: Apply iOS code signing
        script: |
          xcode-project use-profiles --project ios/Runner.xcodeproj

      - name: Build iOS IPA
        script: |
          set -e

          echo "Building IPA..."
          VERSION_LINE="$(grep '^version:' pubspec.yaml | awk '{print $2}')"
          BUILD_NAME="${VERSION_LINE%%+*}"
          BUILD_NUMBER="${KORLIX_IOS_BUILD_NUMBER:?Verified iOS build number is required}"
          echo "Building IPA version $BUILD_NAME ($BUILD_NUMBER)..."
          flutter build ipa --release --no-pub --build-name="$BUILD_NAME" --build-number="$BUILD_NUMBER" --export-options-plist=/Users/builder/export_options.plist
          echo ""
          echo "Searching for generated IPA files..."
          find build -type f -name "*.ipa" -print || true

          mkdir -p artifacts

          IPA_PATH="$(find build -type f -name "*.ipa" | head -n 1 || true)"

          if [ -z "$IPA_PATH" ]; then
            echo "ERROR: No IPA file was created."
            echo ""
            echo "Debugging build/ios contents:"
            find build/ios -maxdepth 5 -type f -print || true
            exit 1
          fi

          echo "Found IPA: $IPA_PATH"
          cp "$IPA_PATH" artifacts/KorlixAI.ipa

          echo ""
          echo "Final artifacts folder:"
          ls -lah artifacts

    artifacts:
      - artifacts/*.ipa
      - /tmp/xcodebuild_logs/*.log
      - flutter_drive.log

    publishing:
      app_store_connect:
        auth: integration
        submit_to_testflight: true
        submit_to_app_store: false

  android-release:
    name: Android Release AAB
    max_build_duration: 120
    instance_type: linux_x2
    environment:
      flutter: stable
    scripts:
      - name: Install Android SDK 36
        script: |
          SDKMANAGER=""
          if command -v sdkmanager >/dev/null 2>&1; then
            SDKMANAGER="$(command -v sdkmanager)"
          elif [ -x "$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager" ]; then
            SDKMANAGER="$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager"
          elif [ -x "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" ]; then
            SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          fi

          if [ -n "$SDKMANAGER" ]; then
            yes | "$SDKMANAGER" "platforms;android-36" "build-tools;36.0.0" || true
          else
            echo "sdkmanager not found; continuing with installed Android SDKs"
          fi
      - name: Show project files
        script: |
          pwd
          ls -la
          grep '^version:' pubspec.yaml
      - name: Flutter pub get
        script: |
          flutter pub get
      - name: Force Flutter plugin compileSdk 36
        script: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          roots = [
              Path.home() / ".pub-cache",
              Path("/Users/builder/.pub-cache"),
              Path("/root/.pub-cache"),
          ]

          patterns = [
              (r"(?m)^(\s*)compileSdk\s*=\s*(?:flutter\.compileSdkVersion|\d+)\s*$", r"\1compileSdk = 36"),
              (r"(?m)^(\s*)compileSdk\s+(?:flutter\.compileSdkVersion|\d+)\s*$", r"\1compileSdk 36"),
              (r"(?m)^(\s*)compileSdkVersion\s+(?:flutter\.compileSdkVersion|\d+)\s*$", r"\1compileSdkVersion 36"),
              (r"(?m)^(\s*)compileSdkVersion\s*\((?:flutter\.compileSdkVersion|\d+)\)\s*$", r"\1compileSdk = 36"),
          ]

          patched = 0

          for root in roots:
              if not root.exists():
                  continue

              for file in root.rglob("build.gradle*"):
                  path_text = str(file)
                  if "/android/" not in path_text and "\\android\\" not in path_text:
                      continue

                  try:
                      text = file.read_text()
                  except Exception:
                      continue

                  original = text

                  for pattern, replacement in patterns:
                      text = re.sub(pattern, replacement, text)

                  if text != original:
                      file.write_text(text)
                      patched += 1
                      print(f"patched {file}")

          print(f"Flutter plugin Gradle files patched: {patched}")
          PY

      - name: Analyze Flutter
        script: |
          flutter analyze
      - name: Build Android App Bundle
        script: |
          VERSION_LINE="$(grep '^version:' pubspec.yaml | awk '{print $2}')"
          BUILD_NAME="${VERSION_LINE%%+*}"
          BUILD_NUMBER="${VERSION_LINE##*+}"
          echo "Building Android AAB version $BUILD_NAME ($BUILD_NUMBER)..."
          flutter build appbundle --release --build-name="$BUILD_NAME" --build-number="$BUILD_NUMBER"
          mkdir -p artifacts
          cp build/app/outputs/bundle/release/app-release.aab artifacts/KorlixAI.aab
          echo "Android artifacts:"
          ls -lah artifacts
    artifacts:
      - artifacts/*.aab

  receipt-wiz-ios-candidate: &receipt_ios_candidate
    name: Receipt WIZ — signed iOS candidate
    instance_type: mac_mini_m2
    max_build_duration: 60
    working_directory: apps/receipt_wiz
    integrations:
      app_store_connect: Codemagic Korlix AI
    environment: &receipt_ios_environment
      flutter: 3.47.7
      xcode: 26.6
      cocoapods: default
      vars:
        RECEIPT_REQUIRE_APP_RECORD: 'false'
      ios_signing:
        # Codemagic requires a profile to import the existing certificate.
        # This bootstrap profile is never used to sign Receipt WIZ: the setup
        # script creates/selects its exact bundle profile, and IPA validation
        # rejects any identity mismatch before upload.
        provisioning_profiles:
          - KORLIX_APP_STORE_PROFILE
        certificates:
          - KORLIX_APP_STORE_CERT
    scripts:
      - name: Prepare dedicated Receipt WIZ Apple identity
        script: |
          set -euo pipefail
          python3 -m venv "$CM_BUILD_DIR/.receipt-release-tools"
          "$CM_BUILD_DIR/.receipt-release-tools/bin/pip" install 'codemagic-cli-tools==0.69.0'
          export PATH="$CM_BUILD_DIR/.receipt-release-tools/bin:$PATH"
          printf 'PATH=%s\n' "$PATH" >> "$CM_ENV"
          python3 "$CM_BUILD_DIR/scripts/prepare_receipt_ios.py"
      - name: Validate shared scanner and Receipt WIZ
        script: |
          set -euo pipefail
          cd "$CM_BUILD_DIR/packages/korlix_receipt_core"
          flutter --suppress-analytics --no-version-check pub get --enforce-lockfile
          flutter analyze --no-pub
          flutter test --no-pub --reporter expanded
          cd "$CM_BUILD_DIR/apps/receipt_wiz"
          flutter --suppress-analytics --no-version-check pub get --enforce-lockfile
          flutter analyze --no-pub
          flutter test --no-pub --reporter expanded
      - name: Build and verify Receipt WIZ IPA
        script: |
          set -euo pipefail
          flutter build ios --release --config-only --no-codesign --no-pub \
            --build-name="$KORLIX_IOS_VERSION" --build-number="$KORLIX_IOS_BUILD_NUMBER"
          xcode-project use-profiles --project ios/Runner.xcodeproj \
            --export-options-plist "$CM_BUILD_DIR/receipt-ios-export.plist" \
            --custom-export-options '{"manageAppVersionAndBuildNumber": false}'
          flutter build ipa --release --no-pub \
            --build-name="$KORLIX_IOS_VERSION" --build-number="$KORLIX_IOS_BUILD_NUMBER" \
            --export-options-plist="$CM_BUILD_DIR/receipt-ios-export.plist"
          IPA_FILES=(build/ios/ipa/*.ipa)
          test "${#IPA_FILES[@]}" -eq 1
          python3 "$CM_BUILD_DIR/scripts/verify_ios_ipa.py" "${IPA_FILES[0]}" \
            --bundle-id com.korlixdeveloper.receiptwiz --version "$KORLIX_IOS_VERSION" \
            --build "$KORLIX_IOS_BUILD_NUMBER" --output artifacts/ReceiptWiz-verification.json
          cp "${IPA_FILES[0]}" artifacts/ReceiptWiz.ipa
    artifacts:
      - $CM_BUILD_DIR/apps/receipt_wiz/artifacts/*.ipa
      - $CM_BUILD_DIR/apps/receipt_wiz/artifacts/*.json
      - /tmp/xcodebuild_logs/*.log

  receipt-wiz-ios-testflight:
    <<: *receipt_ios_candidate
    name: Receipt WIZ — TestFlight upload
    environment:
      <<: *receipt_ios_environment
      vars:
        RECEIPT_REQUIRE_APP_RECORD: 'true'
    publishing:
      app_store_connect:
        auth: integration
        submit_to_testflight: false
        submit_to_app_store: false

  receipt-wiz-validation:
    name: Receipt Wiz — test builds
    instance_type: mac_mini_m2
    max_build_duration: 60
    environment:
      flutter: 3.47.7
      xcode: 26.6
      cocoapods: default
    scripts:
      - name: Validate shared scanner
        script: |
          set -euo pipefail
          cd "$CM_BUILD_DIR/packages/korlix_receipt_core"
          flutter --suppress-analytics --no-version-check pub get --enforce-lockfile
          flutter analyze --no-pub
          flutter test --no-pub --reporter expanded
      - name: Validate independent app
        script: |
          set -euo pipefail
          cd "$CM_BUILD_DIR/apps/receipt_wiz"
          flutter --suppress-analytics --no-version-check pub get --enforce-lockfile
          flutter analyze --no-pub
          flutter test --no-pub --reporter expanded
      - name: Build Receipt Wiz Android test APK
        script: |
          set -euo pipefail
          cd "$CM_BUILD_DIR/apps/receipt_wiz"
          flutter build apk --debug --no-pub
      - name: Build Receipt Wiz iOS simulator
        script: |
          set -euo pipefail
          cd "$CM_BUILD_DIR/apps/receipt_wiz"
          flutter build ios --simulator --debug --no-pub
          cd build/ios/iphonesimulator
          ditto -c -k --sequesterRsrc --keepParent Runner.app ReceiptWiz-Simulator.zip
    artifacts:
      - apps/receipt_wiz/build/app/outputs/flutter-apk/app-debug.apk
      - apps/receipt_wiz/build/ios/iphonesimulator/ReceiptWiz-Simulator.zip
      - /tmp/xcodebuild_logs/*.log

  korlix-brain-ios-candidate: &brain_ios_candidate
    name: KORLIX Brain+Voice — signed iOS candidate
    instance_type: mac_mini_m2
    max_build_duration: 60
    working_directory: apps/korlix_brain
    integrations:
      app_store_connect: Codemagic Korlix AI
    triggering:
      events: [push]
      branch_patterns:
        - pattern: feature/korlix-brain-voice-20261031
          include: true
          source: true
      cancel_previous_builds: true
    environment: &brain_ios_environment
      flutter: 3.47.9
      xcode: 26.6
      cocoapods: default
      vars: &brain_ios_vars
        BOT: 'true'
        CI: 'true'
        FLUTTER_SUPPRESS_ANALYTICS: 'true'
        DART_SUPPRESS_ANALYTICS: 'true'
        COCOAPODS_DISABLE_STATS: 'true'
        BRAIN_REQUIRE_APP_RECORD: 'false'
      ios_signing:
        # Imports the managed certificate only. prepare_brain_ios.py installs
        # a separate com.korlix.brain profile before Xcode configures signing.
        provisioning_profiles: [KORLIX_APP_STORE_PROFILE]
        certificates: [KORLIX_APP_STORE_CERT]
    scripts:
      - &brain_install_release_tools
        name: Install Apple release tools
        script: |
          set -euo pipefail
          python3 -m venv "$CM_BUILD_DIR/.brain-release-tools"
          "$CM_BUILD_DIR/.brain-release-tools/bin/pip" install 'codemagic-cli-tools==0.69.0'
          export PATH="$CM_BUILD_DIR/.brain-release-tools/bin:$PATH"
          printf 'PATH=%s\n' "$PATH" >> "$CM_ENV"
          python3 -m unittest discover -s "$CM_BUILD_DIR/scripts/tests" -p 'test_*ios_release.py'
      - &brain_prepare_ios_identity
        name: Prepare dedicated Brain+Voice Apple identity
        script: |
          set -euo pipefail
          python3 "$CM_BUILD_DIR/scripts/prepare_brain_ios.py"
      - &brain_validate_ios
        name: Validate Brain+Voice
        script: |
          set -euo pipefail
          flutter pub get --enforce-lockfile
          flutter analyze --no-pub
          flutter test --no-pub --reporter expanded
      - &brain_build_ios
        name: Build and verify Brain+Voice IPA
        script: |
          set -euo pipefail
          flutter build ios --release --config-only --no-codesign --no-pub \
            --build-name="$KORLIX_IOS_VERSION" --build-number="$KORLIX_IOS_BUILD_NUMBER"
          xcode-project use-profiles --project ios/Runner.xcodeproj \
            --export-options-plist "$CM_BUILD_DIR/brain-ios-export.plist" \
            --custom-export-options '{"manageAppVersionAndBuildNumber": false}'
          flutter build ipa --release --no-pub \
            --build-name="$KORLIX_IOS_VERSION" --build-number="$KORLIX_IOS_BUILD_NUMBER" \
            --export-options-plist="$CM_BUILD_DIR/brain-ios-export.plist"
          IPA_FILES=(build/ios/ipa/*.ipa)
          test "${#IPA_FILES[@]}" -eq 1
          python3 "$CM_BUILD_DIR/scripts/verify_ios_ipa.py" "${IPA_FILES[0]}" \
            --bundle-id com.korlix.brain --version "$KORLIX_IOS_VERSION" \
            --build "$KORLIX_IOS_BUILD_NUMBER" --output artifacts/BrainVoice-verification.json
          cp "${IPA_FILES[0]}" artifacts/BrainVoice.ipa
          cp store/apple/testflight-notes.txt release_notes_en-US.txt
      - &brain_check_transcript_ui
        name: Check welcome, ambience, voice handoff and transcript layouts
        script: |
          set -euo pipefail
          npm install --prefix "$CM_BUILD_DIR/.brain-ui-tools" --no-audit --no-fund playwright@1.62.1
          "$CM_BUILD_DIR/.brain-ui-tools/node_modules/.bin/playwright" install chromium
          PLAYWRIGHT_MODULE="$CM_BUILD_DIR/.brain-ui-tools/node_modules/playwright" \
            UI_SCREENSHOTS="$CM_BUILD_DIR/apps/korlix_brain/artifacts/ui" \
            node tools/check_ui.cjs
          PLAYWRIGHT_MODULE="$CM_BUILD_DIR/.brain-ui-tools/node_modules/playwright" \
            node tools/check_controls.cjs
          node tools/check_voice_status.cjs
          PLAYWRIGHT_MODULE="$CM_BUILD_DIR/.brain-ui-tools/node_modules/playwright" \
            PROJECTION_SCREENSHOTS="$CM_BUILD_DIR/apps/korlix_brain/artifacts/ui" \
            node tools/check_projection.cjs
          PLAYWRIGHT_MODULE="$CM_BUILD_DIR/.brain-ui-tools/node_modules/playwright" \
            node tools/check_ambience.cjs
          PLAYWRIGHT_MODULE="$CM_BUILD_DIR/.brain-ui-tools/node_modules/playwright" \
            UI_SCREENSHOTS="$CM_BUILD_DIR/apps/korlix_brain/artifacts/ui" \
            node tools/check_welcome.cjs
    artifacts:
      - $CM_BUILD_DIR/apps/korlix_brain/artifacts/*.ipa
      - $CM_BUILD_DIR/apps/korlix_brain/artifacts/*.json
      - $CM_BUILD_DIR/apps/korlix_brain/artifacts/ui/*.png
      - /tmp/xcodebuild_logs/*.log

  korlix-brain-ios-testflight:
    <<: *brain_ios_candidate
    name: KORLIX Brain+Voice — TestFlight upload
    # Only this explicit release branch can trigger upload; feature pushes build candidates.
    triggering:
      events: [push]
      branch_patterns:
        - pattern: release/korlix-brain-testflight-20261031
          include: true
          source: true
      cancel_previous_builds: false
    environment:
      <<: *brain_ios_environment
      vars:
        <<: *brain_ios_vars
        BRAIN_REQUIRE_APP_RECORD: 'true'
    scripts:
      - *brain_install_release_tools
      - name: Query Apple for the exact Brain+Voice app record
        script: |
          set -euo pipefail
          python3 "$CM_BUILD_DIR/scripts/prepare_brain_ios.py" --probe-app-record
      - name: App Store Connect record is missing for com.korlix.brain
        when:
          condition: env.BRAIN_APP_RECORD_PRESENT == "false"
        script: |
          echo 'Create the KORLIX Brain+Voice iOS app record in App Store Connect, then rerun this workflow.'
          exit 1
      - *brain_prepare_ios_identity
      - *brain_validate_ios
      - *brain_check_transcript_ui
      - *brain_build_ios
    publishing:
      app_store_connect:
        auth: integration
        submit_to_testflight: false
        submit_to_app_store: false


  korlix-brain-android-release:
    name: KORLIX Brain+Voice — signed Android release candidate
    instance_type: mac_mini_m2
    max_build_duration: 60
    working_directory: apps/korlix_brain
    # Manual only until the dedicated upload key is installed and verified.
    environment:
      flutter: 3.47.9
      java: 17
      android_signing:
        - KORLIX_BRAIN_UPLOAD_KEY
      vars:
        CI: 'true'
        FLUTTER_SUPPRESS_ANALYTICS: 'true'
        DART_SUPPRESS_ANALYTICS: 'true'
        BRAIN_UPLOAD_CERTIFICATE_SHA256: '8E:9F:5D:E5:66:71:ED:F2:23:3F:78:5F:CD:80:16:FA:F9:71:F7:20:4F:AD:5E:3B:10:DD:B5:87:9E:1C:C7:A5'
    scripts:
      - name: Verify managed Android upload signing
        script: |
          set -euo pipefail
          test -n "${CM_KEYSTORE_PATH:-}" && test -f "$CM_KEYSTORE_PATH"
          test -n "${CM_KEYSTORE_PASSWORD:-}"
          test -n "${CM_KEY_ALIAS:-}"
          test -n "${CM_KEY_PASSWORD:-}"
          keytool -list -keystore "$CM_KEYSTORE_PATH" \
            -storepass:env CM_KEYSTORE_PASSWORD -alias "$CM_KEY_ALIAS" >/dev/null
          mkdir -p artifacts
          keytool -exportcert -rfc -keystore "$CM_KEYSTORE_PATH" \
            -storepass:env CM_KEYSTORE_PASSWORD -alias "$CM_KEY_ALIAS" \
            -file artifacts/BrainVoice-upload-certificate.pem
          actual_fingerprint="$(openssl x509 -in artifacts/BrainVoice-upload-certificate.pem -noout -fingerprint -sha256 | cut -d= -f2)"
          test "$actual_fingerprint" = "$BRAIN_UPLOAD_CERTIFICATE_SHA256"
      - name: Validate and build Brain+Voice Android bundle
        script: |
          set -euo pipefail
          flutter pub get --enforce-lockfile
          flutter analyze --no-pub
          flutter test --no-pub --reporter expanded
          flutter build appbundle --release --no-pub
          cp build/app/outputs/bundle/release/app-release.aab artifacts/BrainVoice.aab
          jarsigner -verify artifacts/BrainVoice.aab | tee artifacts/BrainVoice-signature.txt
          grep -Fq 'jar verified.' artifacts/BrainVoice-signature.txt
          keytool -printcert -jarfile artifacts/BrainVoice.aab -rfc > artifacts/BrainVoice-signer.pem
          openssl x509 -in artifacts/BrainVoice-upload-certificate.pem -outform DER > artifacts/upload-cert.der
          openssl x509 -in artifacts/BrainVoice-signer.pem -outform DER > artifacts/signer-cert.der
          cmp artifacts/upload-cert.der artifacts/signer-cert.der
          if openssl x509 -in artifacts/BrainVoice-signer.pem -noout -subject | grep -Fq 'Android Debug'; then
            echo 'Refusing a debug-signed store bundle.' >&2
            exit 1
          fi
          shasum -a 256 artifacts/BrainVoice.aab > artifacts/BrainVoice.sha256
    artifacts:
      - $CM_BUILD_DIR/apps/korlix_brain/artifacts/BrainVoice.aab
      - $CM_BUILD_DIR/apps/korlix_brain/artifacts/BrainVoice.sha256
      - $CM_BUILD_DIR/apps/korlix_brain/artifacts/BrainVoice-signature.txt
      - $CM_BUILD_DIR/apps/korlix_brain/artifacts/BrainVoice-upload-certificate.pem
    # First upload is performed in the dedicated Play record. No automatic
    # publishing, tester invitations, or billing activation is configured here.


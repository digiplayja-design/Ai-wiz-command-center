workflows:
  korlix-ios-testflight:
    name: Korlix AI iOS TestFlight
    instance_type: mac_mini_m2
    max_build_duration: 60

    integrations:
      app_store_connect: Codemagic Korlix AI

    environment:
      flutter: stable
      xcode: latest
      cocoapods: default
      ios_signing:
        provisioning_profiles:
          - KORLIX_APP_STORE_PROFILE
        certificates:
          - KORLIX_APP_STORE_CERT

    scripts:
      - name: Show project files
        script: |
          pwd
          ls -la
          ls -la ios
          find ios/Runner.xcodeproj -name "*.xcscheme" -print || true

      - name: Flutter pub get
        script: |
          flutter pub get

      - name: Install CocoaPods
        script: |
          cd ios
          pod install --repo-update
          cd ..

      - name: Apply iOS code signing
        script: |
          xcode-project use-profiles

      - name: Build iOS IPA
        script: |
          set -e

          echo "Building IPA..."
          VERSION_LINE="$(grep '^version:' pubspec.yaml | awk '{print $2}')"
          BUILD_NAME="${VERSION_LINE%%+*}"
          BUILD_NUMBER="${VERSION_LINE##*+}"
          echo "Building IPA version $BUILD_NAME ($BUILD_NUMBER)..."
          flutter build ipa --release --build-name="$BUILD_NAME" --build-number="$BUILD_NUMBER" --export-options-plist=/Users/builder/export_options.plist
          echo ""
          echo "Searching for generated IPA files..."
          find build -type f -name "*.ipa" -print || true

          mkdir -p artifacts

          IPA_PATH="$(find build -type f -name "*.ipa" | head -n 1 || true)"

          if [ -z "$IPA_PATH" ]; then
            echo "ERROR: No IPA file was created."
            echo ""
            echo "Debugging build/ios contents:"
            find build/ios -maxdepth 5 -type f -print || true
            exit 1
          fi

          echo "Found IPA: $IPA_PATH"
          cp "$IPA_PATH" artifacts/KorlixAI.ipa

          echo ""
          echo "Final artifacts folder:"
          ls -lah artifacts

    artifacts:
      - artifacts/*.ipa
      - /tmp/xcodebuild_logs/*.log
      - flutter_drive.log

    publishing:
      app_store_connect:
        auth: integration
        submit_to_testflight: true
        submit_to_app_store: false

  android-release:
    name: Android Release AAB
    max_build_duration: 120
    instance_type: linux_x2
    environment:
      flutter: stable
    scripts:
      - name: Install Android SDK 36
        script: |
          SDKMANAGER=""
          if command -v sdkmanager >/dev/null 2>&1; then
            SDKMANAGER="$(command -v sdkmanager)"
          elif [ -x "$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager" ]; then
            SDKMANAGER="$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager"
          elif [ -x "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" ]; then
            SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          fi

          if [ -n "$SDKMANAGER" ]; then
            yes | "$SDKMANAGER" "platforms;android-36" "build-tools;36.0.0" || true
          else
            echo "sdkmanager not found; continuing with installed Android SDKs"
          fi
      - name: Show project files
        script: |
          pwd
          ls -la
          grep '^version:' pubspec.yaml
      - name: Flutter pub get
        script: |
          flutter pub get
      - name: Force Flutter plugin compileSdk 36
        script: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          roots = [
              Path.home() / ".pub-cache",
              Path("/Users/builder/.pub-cache"),
              Path("/root/.pub-cache"),
          ]

          patterns = [
              (r"(?m)^(\s*)compileSdk\s*=\s*(?:flutter\.compileSdkVersion|\d+)\s*$", r"\1compileSdk = 36"),
              (r"(?m)^(\s*)compileSdk\s+(?:flutter\.compileSdkVersion|\d+)\s*$", r"\1compileSdk 36"),
              (r"(?m)^(\s*)compileSdkVersion\s+(?:flutter\.compileSdkVersion|\d+)\s*$", r"\1compileSdkVersion 36"),
              (r"(?m)^(\s*)compileSdkVersion\s*\((?:flutter\.compileSdkVersion|\d+)\)\s*$", r"\1compileSdk = 36"),
          ]

          patched = 0

          for root in roots:
              if not root.exists():
                  continue

              for file in root.rglob("build.gradle*"):
                  path_text = str(file)
                  if "/android/" not in path_text and "\\android\\" not in path_text:
                      continue

                  try:
                      text = file.read_text()
                  except Exception:
                      continue

                  original = text

                  for pattern, replacement in patterns:
                      text = re.sub(pattern, replacement, text)

                  if text != original:
                      file.write_text(text)
                      patched += 1
                      print(f"patched {file}")

          print(f"Flutter plugin Gradle files patched: {patched}")
          PY

      - name: Analyze Flutter
        script: |
          flutter analyze
      - name: Build Android App Bundle
        script: |
          VERSION_LINE="$(grep '^version:' pubspec.yaml | awk '{print $2}')"
          BUILD_NAME="${VERSION_LINE%%+*}"
          BUILD_NUMBER="${VERSION_LINE##*+}"
          echo "Building Android AAB version $BUILD_NAME ($BUILD_NUMBER)..."
          flutter build appbundle --release --build-name="$BUILD_NAME" --build-number="$BUILD_NUMBER"
          mkdir -p artifacts
          cp build/app/outputs/bundle/release/app-release.aab artifacts/KorlixAI.aab
          echo "Android artifacts:"
          ls -lah artifacts
    artifacts:
      - artifacts/*.aab

  fax-ios-testflight:
    name: Fax by Korlix internal TestFlight
    instance_type: mac_mini_m2
    max_build_duration: 60
    working_directory: apps/fax
    integrations:
      app_store_connect: Codemagic Korlix AI
    environment:
      node: 24
      xcode: latest
      ios_signing:
        # Codemagic imports the existing team certificate alongside a stored profile.
        # Only the exact fax profile selected below is applied to the target.
        certificates:
          - KORLIX_APP_STORE_CERT
        provisioning_profiles:
          - KORLIX_APP_STORE_PROFILE
    scripts:
      - name: Install the fax app identifier and distribution profile
        script: python3 ios/prepare-profile.py
      - name: Prepare iPhone and iPad app
        script: npm ci && npm run web && npx cap sync ios
      - name: Build with the fax provisioning profile
        script: |
          cd ios/App
          xcode-project use-profiles --project App.xcodeproj --profile ../fax.mobileprovision
          xcode-project build-ipa --project App.xcodeproj --scheme App --ipa-directory "$CM_BUILD_DIR/apps/fax/artifacts"
      - name: Upload to internal TestFlight when the App Store Connect record exists
        script: |
          set -euo pipefail
          records=$(app-store-connect apps list --bundle-id-identifier com.korlixdeveloper.fax --strict-match-identifier --json --log-stream stderr)
          if python3 -c 'import json,sys; sys.exit(0 if len(json.load(sys.stdin)) == 1 else 1)' <<< "$records"; then
            app-store-connect publish --path artifacts/*.ipa
          else
            echo "The signed IPA is available. Create the Fax by Korlix record in App Store Connect before uploading."
          fi
    artifacts:
      - $CM_BUILD_DIR/apps/fax/artifacts/*.ipa

  fax-android-candidate:
    name: Fax by Korlix signed Play bundle
    instance_type: linux_x2
    max_build_duration: 60
    working_directory: apps/fax
    environment:
      node: 24
      java: 21
      android_signing:
        - KORLIX_FAX_UPLOAD_KEY
    scripts:
      - name: Prepare Android files
        script: npm ci && npm run web && npx cap sync android
      - name: Build and check signed upload bundle
        script: |
          set -eu
          test -f "$CM_KEYSTORE_PATH"
          cd android
          ./gradlew --no-daemon :app:bundleRelease
          jarsigner -verify app/build/outputs/bundle/release/app-release.aab
          keytool -printcert -jarfile app/build/outputs/bundle/release/app-release.aab > /dev/null
    artifacts:
      - $CM_BUILD_DIR/apps/fax/android/app/build/outputs/bundle/release/*.aab

  fax-approved-store-review:
    name: Fax approved US listing and App Review
    instance_type: mac_mini_m2
    max_build_duration: 10
    triggering:
      events:
        - push
      branch_patterns:
        - pattern: feature/fax-mobile-20261125
          include: true
          source: true
    when:
      condition: event.before == "86981b7f84eadcff198af9fb047c385566e38e88"
    integrations:
      app_store_connect: Codemagic Korlix AI
    environment:
      groups:
        - fax_testflight
    scripts:
      - name: Load the Apple release tools
        script: |
          set -euo pipefail
          python3 -m venv "$CM_BUILD_DIR/.fax-lookup"
          (
            unset APP_STORE_CONNECT_KEY_IDENTIFIER APP_STORE_CONNECT_ISSUER_ID APP_STORE_CONNECT_PRIVATE_KEY FAX_TESTFLIGHT_TESTER_EMAIL
            "$CM_BUILD_DIR/.fax-lookup/bin/python" -m pip install --quiet --disable-pip-version-check 'codemagic-cli-tools==0.69.0'
          )
      - name: Save approved fields and submit Fax for App Review
        script: |
          set -euo pipefail
          "$CM_BUILD_DIR/.fax-lookup/bin/python" - <<'PY'
          import os
          import time
          import requests
          from codemagic.apple.app_store_connect import AppStoreConnectApiClient
          from codemagic.tools.app_store_connect.arguments import Types
          
          def configured(arg):
              return arg.from_environment_variable_default().value
          
          client = AppStoreConnectApiClient(
              key_identifier=configured(Types.KeyIdentifierArgument),
              issuer_id=configured(Types.IssuerIdArgument),
              private_key=configured(Types.PrivateKeyArgument),
              log_requests=False, enable_jwt_cache=False,
          )
          recipient = os.environ["FAX_TESTFLIGHT_TESTER_EMAIL"].strip().casefold()
          if not recipient or "@" not in recipient:
              raise ValueError("The private Fax tester setting is missing.")
          
          class AppleError(Exception):
              def __init__(self, r):
                  try:
                      errors = r.json().get("errors", [])
                  except ValueError:
                      errors = []
                  details = " | ".join(e.get("code","")+" "+e.get("detail", e.get("title","")) for e in errors)
                  super().__init__("HTTP "+str(r.status_code)+" "+details.replace(recipient,"[designated tester]")[:780])
          
          def call(method, path, *, params=None, data=None):
              response = requests.request(method, "https://api.appstoreconnect.apple.com/v1/"+path,
                                          headers=client.generate_auth_headers(), params=params,
                                          json={"data": data} if data is not None else None,
                                          allow_redirects=False, timeout=30)
              if not 200 <= response.status_code < 300:
                  raise AppleError(response)
              return response
          
          def get(path, params=None):
              return call("GET",path,params=params).json()["data"]
          
          def unique(items, what):
              if len(items) != 1:
                  raise ValueError(f"Expected one {what}, found {len(items)}.")
              return items[0]
          
          def link(kind, identifier):
              return {"type":kind,"id":identifier}
          
          
          from datetime import datetime, timezone
          from decimal import Decimal
          from urllib.parse import urlsplit, parse_qsl
          
          def apple_request(method, path, *, params=None, payload=None, version="v1"):
              response=requests.request(method, "https://api.appstoreconnect.apple.com/"+version+"/"+path,
                                        headers=client.generate_auth_headers(), params=params, json=payload,
                                        allow_redirects=False, timeout=35)
              if not 200 <= response.status_code < 300:
                  try:
                      errors=response.json().get("errors",[])
                      details=[]
                      for row in errors:
                          details.append([row.get("code"),row.get("detail"),row.get("source",{}).get("pointer")])
                          for group in row.get("meta",{}).get("associatedErrors",{}).values():
                              details.extend([[x.get("code"),x.get("detail")] for x in group])
                      print("APPLE VALIDATION:",str(details)[:2400],flush=True)
                  except (ValueError,TypeError,AttributeError): pass
                  raise AppleError(response)
              return response.json() if response.content else {}
          
          def each_page(path, params):
              for attempt in range(18):
                  page=apple_request("GET",path,params=params)
                  yield page
                  url=page.get("links",{}).get("next")
                  if not url:
                      return
                  split=urlsplit(url)
                  if split.scheme!="https" or split.netloc!="api.appstoreconnect.apple.com" or split.path!="/v1/"+path:
                      raise ValueError("Unexpected Apple pagination link.")
                  params=dict(parse_qsl(split.query))
              raise ValueError("Apple results exceeded the expected pagination limit.")
          
          def relationship(kind, identifier):
              return {"data":link(kind,identifier)}
          
          def expect_field(kind, ident, key, approved):
              path=kind+"/"+ident
              before=get(path,{"fields["+kind+"]":key})["attributes"].get(key)
              if before!=approved:
                  apple_request("PATCH",path,payload={"data":{**link(kind,ident),"attributes":{key:approved}}})
              after=get(path,{"fields["+kind+"]":key})["attributes"].get(key)
              if after!=approved:
                  raise ValueError("Apple has not confirmed "+key)
              print("VERIFIED",key,after,flush=True)
          
          def us_prices(schedule_id):
              path="appPriceSchedules/"+schedule_id+"/manualPrices"
              prices=[]
              for page in each_page(path,{"filter[territory]":"USA","include":"territory,appPricePoint","limit":200}):
                  points={r["id"]:r["attributes"]["customerPrice"] for r in page.get("included",[]) if r["type"]=="appPricePoints"}
                  for p in page["data"]:
                      rels=p["relationships"]
                      if rels["territory"]["data"]["id"]!="USA":
                          raise ValueError("Apple price filter returned a different territory.")
                      prices.append((p["attributes"].get("startDate"),p["attributes"].get("endDate"),points[rels["appPricePoint"]["data"]["id"]]))
              return prices
          
          def set_free_price():
              schedule=get("apps/"+app_id+"/appPriceSchedule")
              schedule_id=schedule["id"]
              old=us_prices(schedule_id)
              today=datetime.now(timezone.utc).date().isoformat()
              print("CURRENT USA PRICE PERIODS:",old,flush=True)
              def active_free(items):
                  return any(Decimal(price)==0 and (not start or start<=today) and (not end or today<end) for start,end,price in items)
              if not active_free(old):
                  if any(start and start>today for start,_,_ in old):
                      raise ValueError("An existing future price needs reconciliation before replacing the schedule.")
                  free=None
                  for page in each_page("apps/"+app_id+"/appPricePoints",
                                        {"filter[territory]":"USA","include":"territory","limit":200}):
                      match=[p for p in page["data"] if Decimal(p["attributes"]["customerPrice"])==0 and p["relationships"]["territory"]["data"]["id"]=="USA"]
                      if match:
                          free=unique(match,"U.S. free price point")["id"]
                          break
                  if not free:
                      raise ValueError("Apple returned no free U.S. price point.")
                  temp_id="$"+"{freeUS}"
                  body={"data":{"type":"appPriceSchedules","relationships":{
                      "app":relationship("apps",app_id), "baseTerritory":relationship("territories","USA"),
                      "manualPrices":{"data":[link("appPrices",temp_id)]}}},
                      "included":[{**link("appPrices",temp_id),"attributes":{"startDate":None},
                                   "relationships":{"appPricePoint":relationship("appPricePoints",free)}}]}
                  apple_request("POST","appPriceSchedules",payload=body)
              for attempt in range(6):
                  current=us_prices(get("apps/"+app_id+"/appPriceSchedule")["id"])
                  if active_free(current):
                      print("VERIFIED USA DOWNLOAD PRICE: USD 0.00",flush=True)
                      return
                  if attempt<5: time.sleep(4)
              raise ValueError("Waiting for Apple to show the approved free price.")
          
          def add_and_submit():
              version=get("appStoreVersions/"+vid)
              state=version["attributes"].get("appStoreState") or version["attributes"].get("appVersionState")
              print("BEFORE REVIEW:",state,flush=True)
              if state in {"WAITING_FOR_REVIEW","IN_REVIEW","PENDING_DEVELOPER_RELEASE","PENDING_APPLE_RELEASE","READY_FOR_SALE","READY_FOR_DISTRIBUTION"}:
                  return
              if state not in {"PREPARE_FOR_SUBMISSION","READY_FOR_REVIEW","DEVELOPER_REJECTED","METADATA_REJECTED","REJECTED"}:
                  raise ValueError("Apple version is not in an editable submission state.")
              attached=get("appStoreVersions/"+vid+"/relationships/build")
              if not attached or attached["id"]!="05071f83-0758-49f5-9dae-a79d2a1b44d0":
                  raise ValueError("Expected Fax build 2.")
              av=get("apps/"+app_id+"/appAvailabilityV2")
              data=apple_request("GET","appAvailabilities/"+av["id"]+"/territoryAvailabilities",version="v2",
                                 params={"limit":200,"include":"territory","fields[territoryAvailabilities]":"territory,available"})
              visible={r["relationships"]["territory"]["data"]["id"] for r in data["data"] if r["attributes"]["available"]}
              if visible!={"USA"} or av["attributes"].get("availableInNewTerritories") or data.get("links",{}).get("next"):
                  raise ValueError("The U.S.-only territory selection requires review.")
              prior=get("apps/"+app_id+"/reviewSubmissions",{"limit":100})
              pending=[s for s in prior if s["attributes"].get("state")=="READY_FOR_REVIEW" and s["attributes"].get("platform") in {None,"IOS"}]
              if not pending:
                  sub=apple_request("POST","reviewSubmissions",payload={"data":{"type":"reviewSubmissions","attributes":{"platform":"IOS"},"relationships":{"app":relationship("apps",app_id)}}})["data"]
              else:
                  sub=unique(pending,"editable iOS review submission")
              group_path="reviewSubmissions/"+sub["id"]
              def items():
                  page=apple_request("GET",group_path+"/items",params={"include":"appStoreVersion","limit":200})
                  if page.get("links",{}).get("next"):
                      raise ValueError("Review submission contains unexpectedly many items.")
                  return page["data"]
              def is_version(item):
                  rels=item.get("relationships",{}).get("appStoreVersion",{}).get("data")
                  return bool(rels and rels["id"]==vid)
              current=items()
              if any(not is_version(x) for x in current):
                  raise ValueError("The existing submission includes another item. Left it alone.")
              if not current:
                  apple_request("POST","reviewSubmissionItems",payload={"data":{"type":"reviewSubmissionItems","relationships":{
                      "reviewSubmission":relationship("reviewSubmissions",sub["id"]),"appStoreVersion":relationship("appStoreVersions",vid)}}})
              current=items()
              if len(current)!=1 or not is_version(current[0]):
                  raise ValueError("Could not confirm the sole review item.")
              current_state=get(group_path)["attributes"].get("state")
              if current_state=="READY_FOR_REVIEW":
                  apple_request("PATCH",group_path,payload={"data":{**link("reviewSubmissions",sub["id"]),"attributes":{"submitted":True}}})
              print("VERIFIED REVIEW SUBMISSION:",get(group_path)["attributes"].get("state"),flush=True)
              print("VERIFIED VERSION STATE:", get("appStoreVersions/"+vid)["attributes"].get("appStoreState"),flush=True)
          
          entity=unique(get("apps",{"filter[bundleId]":"com.korlixdeveloper.fax","fields[apps]":"name,bundleId","limit":2}),"Fax app")
          app_id=entity["id"]
          if app_id!="6840053512" or entity["attributes"]["bundleId"]!="com.korlixdeveloper.fax":
              raise ValueError("Unexpected app record.")
          ver=unique([v for v in get("apps/"+app_id+"/appStoreVersions",{"limit":80}) if v["attributes"].get("platform")=="IOS" and v["attributes"].get("versionString")=="1.0"], "iOS Fax 1.0")
          vid=ver["id"]
          ok=True
          for label,action in [("COPYRIGHT",lambda:expect_field("appStoreVersions",vid,"copyright","2026 Korlix LLC")),
                               ("RIGHTS",lambda:expect_field("apps",app_id,"contentRightsDeclaration","USES_THIRD_PARTY_CONTENT")),
                               ("DOWNLOAD PRICE",set_free_price)]:
              try:
                  action()
              except (AppleError,KeyError,ValueError) as error:
                  print(label,"RESULT:",error,flush=True)
                  ok=False
          if ok:
              try: add_and_submit()
              except (AppleError,KeyError,ValueError) as error: print("REVIEW RESULT:",error,flush=True)
          PY

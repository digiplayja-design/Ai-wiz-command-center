workflows:
  korlix-ios-testflight:
    name: Korlix AI iOS TestFlight
    instance_type: mac_mini_m2
    max_build_duration: 60

    integrations:
      app_store_connect: Codemagic Korlix AI

    environment:
      flutter: stable
      xcode: latest
      cocoapods: default
      ios_signing:
        provisioning_profiles:
          - KORLIX_APP_STORE_PROFILE
        certificates:
          - KORLIX_APP_STORE_CERT

    scripts:
      - name: Show project files
        script: |
          pwd
          ls -la
          ls -la ios
          find ios/Runner.xcodeproj -name "*.xcscheme" -print || true

      - name: Flutter pub get
        script: |
          flutter pub get

      - name: Install CocoaPods
        script: |
          cd ios
          pod install --repo-update
          cd ..

      - name: Apply iOS code signing
        script: |
          xcode-project use-profiles

      - name: Build iOS IPA
        script: |
          set -e

          echo "Building IPA..."
          VERSION_LINE="$(grep '^version:' pubspec.yaml | awk '{print $2}')"
          BUILD_NAME="${VERSION_LINE%%+*}"
          BUILD_NUMBER="${VERSION_LINE##*+}"
          echo "Building IPA version $BUILD_NAME ($BUILD_NUMBER)..."
          flutter build ipa --release --build-name="$BUILD_NAME" --build-number="$BUILD_NUMBER" --export-options-plist=/Users/builder/export_options.plist
          echo ""
          echo "Searching for generated IPA files..."
          find build -type f -name "*.ipa" -print || true

          mkdir -p artifacts

          IPA_PATH="$(find build -type f -name "*.ipa" | head -n 1 || true)"

          if [ -z "$IPA_PATH" ]; then
            echo "ERROR: No IPA file was created."
            echo ""
            echo "Debugging build/ios contents:"
            find build/ios -maxdepth 5 -type f -print || true
            exit 1
          fi

          echo "Found IPA: $IPA_PATH"
          cp "$IPA_PATH" artifacts/KorlixAI.ipa

          echo ""
          echo "Final artifacts folder:"
          ls -lah artifacts

    artifacts:
      - artifacts/*.ipa
      - /tmp/xcodebuild_logs/*.log
      - flutter_drive.log

    publishing:
      app_store_connect:
        auth: integration
        submit_to_testflight: true
        submit_to_app_store: false

  android-release:
    name: Android Release AAB
    max_build_duration: 120
    instance_type: linux_x2
    environment:
      flutter: stable
    scripts:
      - name: Install Android SDK 36
        script: |
          SDKMANAGER=""
          if command -v sdkmanager >/dev/null 2>&1; then
            SDKMANAGER="$(command -v sdkmanager)"
          elif [ -x "$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager" ]; then
            SDKMANAGER="$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager"
          elif [ -x "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" ]; then
            SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          fi

          if [ -n "$SDKMANAGER" ]; then
            yes | "$SDKMANAGER" "platforms;android-36" "build-tools;36.0.0" || true
          else
            echo "sdkmanager not found; continuing with installed Android SDKs"
          fi
      - name: Show project files
        script: |
          pwd
          ls -la
          grep '^version:' pubspec.yaml
      - name: Flutter pub get
        script: |
          flutter pub get
      - name: Force Flutter plugin compileSdk 36
        script: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          roots = [
              Path.home() / ".pub-cache",
              Path("/Users/builder/.pub-cache"),
              Path("/root/.pub-cache"),
          ]

          patterns = [
              (r"(?m)^(\s*)compileSdk\s*=\s*(?:flutter\.compileSdkVersion|\d+)\s*$", r"\1compileSdk = 36"),
              (r"(?m)^(\s*)compileSdk\s+(?:flutter\.compileSdkVersion|\d+)\s*$", r"\1compileSdk 36"),
              (r"(?m)^(\s*)compileSdkVersion\s+(?:flutter\.compileSdkVersion|\d+)\s*$", r"\1compileSdkVersion 36"),
              (r"(?m)^(\s*)compileSdkVersion\s*\((?:flutter\.compileSdkVersion|\d+)\)\s*$", r"\1compileSdk = 36"),
          ]

          patched = 0

          for root in roots:
              if not root.exists():
                  continue

              for file in root.rglob("build.gradle*"):
                  path_text = str(file)
                  if "/android/" not in path_text and "\\android\\" not in path_text:
                      continue

                  try:
                      text = file.read_text()
                  except Exception:
                      continue

                  original = text

                  for pattern, replacement in patterns:
                      text = re.sub(pattern, replacement, text)

                  if text != original:
                      file.write_text(text)
                      patched += 1
                      print(f"patched {file}")

          print(f"Flutter plugin Gradle files patched: {patched}")
          PY

      - name: Analyze Flutter
        script: |
          flutter analyze
      - name: Build Android App Bundle
        script: |
          VERSION_LINE="$(grep '^version:' pubspec.yaml | awk '{print $2}')"
          BUILD_NAME="${VERSION_LINE%%+*}"
          BUILD_NUMBER="${VERSION_LINE##*+}"
          echo "Building Android AAB version $BUILD_NAME ($BUILD_NUMBER)..."
          flutter build appbundle --release --build-name="$BUILD_NAME" --build-number="$BUILD_NUMBER"
          mkdir -p artifacts
          cp build/app/outputs/bundle/release/app-release.aab artifacts/KorlixAI.aab
          echo "Android artifacts:"
          ls -lah artifacts
    artifacts:
      - artifacts/*.aab

  fax-ios-testflight:
    name: Fax by Korlix internal TestFlight
    instance_type: mac_mini_m2
    max_build_duration: 60
    working_directory: apps/fax
    integrations:
      app_store_connect: Codemagic Korlix AI
    environment:
      node: 24
      xcode: latest
      ios_signing:
        # Codemagic imports the existing team certificate alongside a stored profile.
        # Only the exact fax profile selected below is applied to the target.
        certificates:
          - KORLIX_APP_STORE_CERT
        provisioning_profiles:
          - KORLIX_APP_STORE_PROFILE
    scripts:
      - name: Install the fax app identifier and distribution profile
        script: python3 ios/prepare-profile.py
      - name: Prepare iPhone and iPad app
        script: npm ci && npm run web && npx cap sync ios
      - name: Build with the fax provisioning profile
        script: |
          cd ios/App
          xcode-project use-profiles --project App.xcodeproj --profile ../fax.mobileprovision
          xcode-project build-ipa --project App.xcodeproj --scheme App --ipa-directory "$CM_BUILD_DIR/apps/fax/artifacts"
      - name: Upload to internal TestFlight when the App Store Connect record exists
        script: |
          set -euo pipefail
          records=$(app-store-connect apps list --bundle-id-identifier com.korlixdeveloper.fax --strict-match-identifier --json --log-stream stderr)
          if python3 -c 'import json,sys; sys.exit(0 if len(json.load(sys.stdin)) == 1 else 1)' <<< "$records"; then
            app-store-connect publish --path artifacts/*.ipa
          else
            echo "The signed IPA is available. Create the Fax by Korlix record in App Store Connect before uploading."
          fi
    artifacts:
      - $CM_BUILD_DIR/apps/fax/artifacts/*.ipa

  fax-android-candidate:
    name: Fax by Korlix signed Play bundle
    instance_type: linux_x2
    max_build_duration: 60
    working_directory: apps/fax
    environment:
      node: 24
      java: 21
      android_signing:
        - KORLIX_FAX_UPLOAD_KEY
    scripts:
      - name: Prepare Android files
        script: npm ci && npm run web && npx cap sync android
      - name: Build and check signed upload bundle
        script: |
          set -eu
          test -f "$CM_KEYSTORE_PATH"
          cd android
          ./gradlew --no-daemon :app:bundleRelease
          jarsigner -verify app/build/outputs/bundle/release/app-release.aab
          keytool -printcert -jarfile app/build/outputs/bundle/release/app-release.aab > /dev/null
    artifacts:
      - $CM_BUILD_DIR/apps/fax/android/app/build/outputs/bundle/release/*.aab

  fax-store-review-check:
    name: Fax iOS review fields and private invitation
    instance_type: mac_mini_m2
    max_build_duration: 10
    triggering:
      events:
        - push
      branch_patterns:
        - pattern: feature/fax-mobile-20261125
          include: true
          source: true
    when:
      condition: event.before == "872e598a49464fbaf151afbacbc1b2cb6605dcd1"
    integrations:
      app_store_connect: Codemagic Korlix AI
    environment:
      groups:
        - fax_testflight
    scripts:
      - name: Load the Apple release tools
        script: |
          set -euo pipefail
          python3 -m venv "$CM_BUILD_DIR/.fax-lookup"
          (
            unset APP_STORE_CONNECT_KEY_IDENTIFIER APP_STORE_CONNECT_ISSUER_ID APP_STORE_CONNECT_PRIVATE_KEY FAX_TESTFLIGHT_TESTER_EMAIL
            "$CM_BUILD_DIR/.fax-lookup/bin/python" -m pip install --quiet --disable-pip-version-check 'codemagic-cli-tools==0.69.0'
          )
      - name: Check the Fax listing and private TestFlight invitation
        script: |
          set -euo pipefail
          "$CM_BUILD_DIR/.fax-lookup/bin/python" - <<'PY'
          import os
          import time
          import requests
          from codemagic.apple.app_store_connect import AppStoreConnectApiClient
          from codemagic.tools.app_store_connect.arguments import Types
          
          def configured(arg):
              return arg.from_environment_variable_default().value
          
          client = AppStoreConnectApiClient(
              key_identifier=configured(Types.KeyIdentifierArgument),
              issuer_id=configured(Types.IssuerIdArgument),
              private_key=configured(Types.PrivateKeyArgument),
              log_requests=False, enable_jwt_cache=False,
          )
          recipient = os.environ["FAX_TESTFLIGHT_TESTER_EMAIL"].strip().casefold()
          if not recipient or "@" not in recipient:
              raise ValueError("The private Fax tester setting is missing.")
          
          class AppleError(Exception):
              def __init__(self, r):
                  try:
                      errors = r.json().get("errors", [])
                  except ValueError:
                      errors = []
                  details = " | ".join(e.get("code","")+" "+e.get("detail", e.get("title","")) for e in errors)
                  super().__init__("HTTP "+str(r.status_code)+" "+details.replace(recipient,"[designated tester]")[:780])
          
          def call(method, path, *, params=None, data=None):
              response = requests.request(method, "https://api.appstoreconnect.apple.com/v1/"+path,
                                          headers=client.generate_auth_headers(), params=params,
                                          json={"data": data} if data is not None else None,
                                          allow_redirects=False, timeout=30)
              if not 200 <= response.status_code < 300:
                  raise AppleError(response)
              return response
          
          def get(path, params=None):
              return call("GET",path,params=params).json()["data"]
          
          def unique(items, what):
              if len(items) != 1:
                  raise ValueError(f"Expected one {what}, found {len(items)}.")
              return items[0]
          
          def link(kind, identifier):
              return {"type":kind,"id":identifier}
          
          bundle = "com.korlixdeveloper.fax"
          rows = get("apps",{"filter[bundleId]":bundle,"fields[apps]":"bundleId,name","limit":2})
          app = unique([a for a in rows if a["attributes"]["bundleId"] == bundle], "Fax app")
          app_id = app["id"]
          group = unique([g for g in get("apps/"+app_id+"/betaGroups",{"limit":200}) if g["attributes"]["name"]=="Fax by Korlix Internal" and g["attributes"]["isInternalGroup"]], "private Fax group")
          gp="betaGroups/"+group["id"]
          def group_tester():
              members=get(gp+"/betaTesters",{"fields[betaTesters]":"email,state","limit":200})
              target=unique([u for u in members if (u["attributes"].get("email") or "").casefold()==recipient],"requested group member")
              return target,len(members)
          
          tester,count=group_tester()
          expected_build_id="05071f83-0758-49f5-9dae-a79d2a1b44d0"
          builds = get("builds", {"filter[app]":app_id,"filter[version]":"2","limit":200})
          build=unique([b for b in builds if b["id"]==expected_build_id and b["attributes"].get("version")=="2"],"Fax build 2")
          bid=build["id"]
          def internal_state():
              return get("builds/"+bid+"/buildBetaDetail")["attributes"].get("internalBuildState")
          def assigned():
              return any(b["id"]==bid for b in get(gp+"/relationships/builds",{"limit":200}))
          
          def tester_state():
              member, member_count = group_tester()
              if member_count != 1:
                  raise ValueError("Private Fax group membership changed. No invitation was requested.")
              return member["attributes"].get("state")
          
          def deliver_invitation():
              if app_id != "6840053512" or count != 1:
                  raise ValueError("Unexpected app or membership.")
              before = tester_state()
              state = internal_state()
              in_group = assigned()
              print("TESTFLIGHT START:", state, "group assignment", in_group, "tester", before, flush=True)
              if build["attributes"].get("processingState") != "VALID" or build["attributes"].get("expired"):
                  print("TESTFLIGHT: Build is not installable.", flush=True)
                  return
              if state not in {"READY_FOR_BETA_TESTING", "IN_BETA_TESTING"}:
                  print("TESTFLIGHT: Apple is holding the build. No email requested.", flush=True)
                  return
              if not in_group:
                  call("POST", gp + "/relationships/builds", data=[link("builds", bid)])
                  for attempt in range(5):
                      if assigned():
                          break
                      time.sleep(3)
                  if not assigned():
                      raise ValueError("Apple has not confirmed the group assignment.")
                  for attempt in range(4):
                      if tester_state() != before:
                          break
                      time.sleep(3)
              after = tester_state()
              if after in {"ACCEPTED", "INSTALLED"}:
                  print("TESTFLIGHT: Invitation already accepted; build available.", flush=True)
              elif not in_group and before == "NOT_INVITED" and after == "INVITED":
                  print("TESTFLIGHT: Apple issued the initial invitation on build assignment.", flush=True)
              else:
                  req = {"type":"betaTesterInvitations", "relationships":{"app":{"data":link("apps",app_id)}, "betaTester":{"data":link("betaTesters",tester["id"])}}}
                  response = call("POST","betaTesterInvitations",data=req)
                  print("APPLE INVITATION REQUEST ACCEPTED:", response.status_code, flush=True)
                  for attempt in range(4):
                      if tester_state() in {"INVITED","ACCEPTED","INSTALLED"}:
                          break
                      time.sleep(2)
              print("TESTFLIGHT VERIFIED:", internal_state(), "group assignment", assigned(), "tester", tester_state(), flush=True)
          
          def fax_rating():
              infos = get("apps/"+app_id+"/appInfos", {"limit":50})
              info = unique([i for i in infos if len(infos)==1 or (i["attributes"].get("appStoreState") or i["attributes"].get("state")) in {"PREPARE_FOR_SUBMISSION","DEVELOPER_REJECTED","METADATA_REJECTED","REJECTED"}], "editable Fax app information")
              path = "appInfos/"+info["id"]+"/ageRatingDeclaration"
              attrs = get(path)
              existing = attrs["attributes"]
              absent = ["advertising","gambling","healthOrWellnessTopics","lootBox","parentalControls","ageAssurance","unrestrictedWebAccess","userGeneratedContent","socialMedia","sharedLocation","datingAndRelationships"]
              none = ["alcoholTobaccoOrDrugUseOrReferences","contests","gamblingSimulated","gunsOrOtherWeapons","medicalOrTreatmentInformation","profanityOrCrudeHumor","sexualContentGraphicAndNudity","sexualContentOrNudity","horrorOrFearThemes","matureOrSuggestiveThemes","violenceCartoonOrFantasy","violenceRealisticProlongedGraphicOrSadistic","violenceRealistic"]
              supported = {k:False for k in absent if k in existing}
              supported.update({k:"NONE" for k in none if k in existing})
              supported.update({"messagingAndChat":True, "ageRatingOverrideV2":"SIXTEEN_PLUS"})
              changes = {k:v for k,v in supported.items() if existing.get(k) is None or existing.get(k) == "NONE" and k == "ageRatingOverrideV2"}
              conflicts = {k:existing[k] for k,v in supported.items() if existing.get(k) is not None and existing[k]!=v and k not in changes}
              if conflicts:
                  print("Existing age-rating choices left in place:", conflicts, flush=True)
              if changes:
                  call("PATCH","ageRatingDeclarations/"+attrs["id"], data={**link("ageRatingDeclarations",attrs["id"]), "attributes":changes})
              verified=get(path)["attributes"]
              missing=[k for k in supported if verified.get(k) is None]
              print("AGE RATING:", verified.get("ageRatingOverrideV2"), "direct messaging", verified.get("messagingAndChat"), "unanswered requested fields", missing, flush=True)
              print("AGE RATING remaining unset keys:", [k for k,v in verified.items() if v is None], flush=True)
              updated=get("appInfos/"+info["id"])
              print("APPLE DISPLAY AGE RATING:",updated["attributes"].get("appStoreAgeRating"),flush=True)
          
          def read_listing():
              entity = get("apps/"+app_id, {"fields[apps]":"contentRightsDeclaration,primaryLocale"})
              print("LISTING language and rights:", entity["attributes"], flush=True)
              version = unique([v for v in get("apps/"+app_id+"/appStoreVersions",{"limit":100}) if v["attributes"].get("platform")=="IOS" and v["attributes"].get("versionString")=="1.0"],"Fax iOS 1.0")
              print("LISTING copyright:", version["attributes"].get("copyright"), "state", version["attributes"].get("appStoreState"), flush=True)
              try:
                  detail=get("appStoreVersions/"+version["id"]+"/appStoreReviewDetail")
                  print("REVIEW fields present:", [k for k,v in detail["attributes"].items() if v], flush=True)
              except AppleError as error:
                  print("REVIEW info:", error, flush=True)
              try:
                  schedule = get("apps/"+app_id+"/appPriceSchedule")
                  print("PRICE SCHEDULE:", schedule["id"] if schedule else "unset", flush=True)
              except AppleError as error:
                  print("PRICE SCHEDULE:", error, flush=True)
          
          for label, action in [("TESTFLIGHT",deliver_invitation),("AGE RATING",fax_rating),("LISTING",read_listing)]:
              try:
                  action()
              except (AppleError, ValueError, KeyError) as error:
                  print(label, "RESULT:", str(error), flush=True)
          PY

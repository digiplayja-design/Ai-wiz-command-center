workflows:
  korlix-copybox-apple-status:
    name: KORLIX COPY Box — read-only Apple release status
    instance_type: mac_mini_m2
    max_build_duration: 10
    integrations:
      app_store_connect: Codemagic Korlix AI
    # Manual only. Existing managed integration; no signing or publishing.
    # Only app-scoped GETs. No credentials, contact values or tester identities
    # are written to logs or artifacts. The report is not a release approval.
    scripts:
      - name: Check read-only scope and private-data filtering
        script: |
          set -euo pipefail
          python3 -B -m unittest discover -s scripts/tests -p 'test_read_copybox_apple_status.py' -v
      - name: Read COPY Box release status through the existing integration
        script: |
          set -euo pipefail
          python3 -m venv "$CM_BUILD_DIR/.copybox-apple-status-tools"
          "$CM_BUILD_DIR/.copybox-apple-status-tools/bin/pip" install 'codemagic-cli-tools==0.69.0'
          "$CM_BUILD_DIR/.copybox-apple-status-tools/bin/python" scripts/read_copybox_apple_status.py
    artifacts:
      - artifacts/copybox-apple-status.json

  korlix-copybox-reviewer-acceptance:
    name: KORLIX COPY Box — bounded reviewer API acceptance
    instance_type: mac_mini_m2
    max_build_duration: 10
    integrations:
      app_store_connect: Codemagic Korlix AI
    # Manual only. Uses the existing saved dedicated review account in memory.
    # One synthetic rewrite, followed by sign-out of only its fresh session.
    # No secret, account profile, or generated text is logged or exported.
    scripts:
      - name: Verify scope, request limits, secret filtering, and cleanup
        script: |
          set -euo pipefail
          python3 -B -m unittest discover -s scripts/tests -p 'test_read_copybox_apple_status.py' -v
          python3 -B -m unittest discover -s scripts/tests -p 'test_check_copybox_reviewer_acceptance.py' -v
      - name: Exercise the saved COPY Box reviewer account once
        script: |
          set -euo pipefail
          python3 -m venv "$CM_BUILD_DIR/.copybox-reviewer-acceptance-tools"
          "$CM_BUILD_DIR/.copybox-reviewer-acceptance-tools/bin/pip" install 'codemagic-cli-tools==0.69.0'
          "$CM_BUILD_DIR/.copybox-reviewer-acceptance-tools/bin/python" scripts/check_copybox_reviewer_acceptance.py --run-once
    artifacts:
      - artifacts/copybox-reviewer-acceptance.json

  korlix-copybox-native-ios-acceptance:
    name: KORLIX COPY Box — native iOS guest acceptance
    instance_type: mac_mini_m2
    max_build_duration: 45
    working_directory: apps/korlix_copy_box
    environment:
      flutter: 3.47.7
      xcode: 26.6
      cocoapods: default
    scripts:
      - name: Run actual iOS guest app and verify a fresh-process restore
        script: |
          set -euo pipefail
          python3 "$CM_BUILD_DIR/scripts/ci/run_copybox_native_acceptance.py" ios
        test_report: artifacts/native-acceptance/report-*.json
    artifacts:
      - $CM_BUILD_DIR/apps/korlix_copy_box/artifacts/native-acceptance/*
      - /tmp/xcodebuild_logs/*.log

          app_id = app["id"]
          print("Confirmed Fax record", app_id, "with initial primary locale", app["attributes"]["primaryLocale"], flush=True)
          versions = rows(f"apps/{app_id}/appStoreVersions", {"filter[platform]":"IOS","limit":50})
          drafts = [item for item in versions if item["attributes"]["versionString"] in {"1.0","1.0.0"}
                    and (item["attributes"].get("appStoreState") or item["attributes"].get("appVersionState"))
                    in {"PREPARE_FOR_SUBMISSION","DEVELOPER_REJECTED","METADATA_REJECTED","REJECTED"}]


          from pathlib import Path
          from urllib.parse import urlsplit
          import hashlib
          import os
          import sys
          import time

          dirs=("APP_IPHONE_67","APP_IPAD_PRO_3GEN_129")
          files=("01-mailbox.png","02-prepare-a-fax.png","03-delivery-receipt.png","04-monthly-activity.png")
          root=Path(os.environ["CM_BUILD_DIR"])/"fax-store-screens"

          def asset_state(asset):
              return (asset["attributes"].get("assetDeliveryState") or {}).get("state")

          def attach_png(set_id, file):
              items=rows("appScreenshotSets/"+set_id+"/appScreenshots",{"limit":50})
              existing=[i for i in items if i["attributes"]["fileName"]==file.name]
              if existing:
                  item=only(existing,"matching screenshot")
                  if asset_state(item) in {"COMPLETE","PROCESSING"}:
                      return item["id"]
                  if asset_state(item) == "FAILED":
                      raise RuntimeError("An existing screenshot failed processing: "+file.name)
                  item=apple("GET","appScreenshots/"+item["id"])["data"]
              else:
                  item=apple("POST","appScreenshots",data={"type":"appScreenshots","attributes":{"fileName":file.name,"fileSize":file.stat().st_size},
                             "relationships":{"appScreenshotSet":rel("appScreenshotSets",set_id)}})["data"]
              data=file.read_bytes()
              assert data.startswith(b"\x89PNG\r\n\x1a\n")
              operations=item["attributes"].get("uploadOperations") or []
              if not operations:
                  raise RuntimeError("Apple returned no screenshot upload operations.")
              offset=0
              for op in sorted(operations,key=lambda i:i["offset"]):
                  target=urlsplit(op["url"])
                  if not target.hostname or target.scheme!="https" or target.username or target.password:
                      raise RuntimeError("Unexpected Apple screenshot upload instruction.")
                  if not any(target.hostname==domain or target.hostname.endswith("."+domain) for domain in ("apple.com","icloud.com","icloud-content.com","apple-cloudkit.com")):
                      raise RuntimeError("Apple returned an unrecognized media upload host: "+target.hostname)
                  if op["method"]!="PUT" or op["offset"]!=offset or op["length"]<=0:
                      raise RuntimeError("Unexpected upload range.")
                  end=offset+op["length"]
                  if end>len(data): raise RuntimeError("Screenshot upload range exceeds file.")
                  headers={x["name"]:x["value"] for x in op["requestHeaders"]}
                  r=requests.put(op["url"],headers=headers,data=data[offset:end],allow_redirects=False,timeout=60)
                  if not 200<=r.status_code<300: raise RuntimeError("Screenshot bytes were not accepted (HTTP "+str(r.status_code)+").")
                  offset=end
              if offset!=len(data): raise RuntimeError("Incomplete screenshot upload.")
              apple("PATCH","appScreenshots/"+item["id"],data={**link("appScreenshots",item["id"]),
                    "attributes":{"uploaded":True,"sourceFileChecksum":hashlib.md5(data).hexdigest()}})
              return item["id"]

          draft=only(drafts,"initial iOS draft")
          info=only(rows("apps/"+app_id+"/appInfos"),"initial app information")
          attrs={"description":RELEASE_COPY["DESCRIPTION"],"supportUrl":RELEASE_COPY["SUPPORT URL"],"keywords":RELEASE_COPY["KEYWORDS"]}
          locs=rows("appStoreVersions/"+draft["id"]+"/appStoreVersionLocalizations",{"limit":50})
          languages={i["attributes"]["locale"]:i for i in locs if i["attributes"]["locale"] in {"en-CA","en-US"}}
          if set(languages)!={"en-CA","en-US"}: raise RuntimeError("Both expected locales must be available.")
          for lc,entry in languages.items():
              missing={k:v for k,v in attrs.items() if not entry["attributes"].get(k)}
              if missing:
                  apple("PATCH","appStoreVersionLocalizations/"+entry["id"],data={**link("appStoreVersionLocalizations",entry["id"]),"attributes":missing})
          for entry in rows("appInfos/"+info["id"]+"/appInfoLocalizations",{"limit":50}):
              if entry["attributes"]["locale"] not in languages: continue
              missing={k:v for k,v in {"subtitle":RELEASE_COPY["SUBTITLE"],"privacyPolicyUrl":RELEASE_COPY["PRIVACY POLICY URL"]}.items() if not entry["attributes"].get(k)}
              if missing:
                  apple("PATCH","appInfoLocalizations/"+entry["id"],data={**link("appInfoLocalizations",entry["id"]),"attributes":missing})
          catpath="appInfos/"+info["id"]+"/relationships/primaryCategory"
          try:
              category=apple("GET",catpath).get("data")
          except AppleError as error:
              if error.status!=404: raise
              category=None
          if not category:
              apple("PATCH","appInfos/"+info["id"],data={**link("appInfos",info["id"]),"relationships":{"primaryCategory":rel("appCategories","BUSINESS")}})
          print("Verified category:",(apple("GET",catpath).get("data") or {}).get("id"),flush=True)
          submitted={}
          for locale,entry in sorted(languages.items()):
              sets=rows("appStoreVersionLocalizations/"+entry["id"]+"/appScreenshotSets",{"limit":50})
              for device in dirs:
                  matches=[i for i in sets if i["attributes"]["screenshotDisplayType"]==device]
                  if not matches:
                      matches=[apple("POST","appScreenshotSets",data={"type":"appScreenshotSets","attributes":{"screenshotDisplayType":device},
                              "relationships":{"appStoreVersionLocalization":rel("appStoreVersionLocalizations",entry["id"])}})["data"]]
                  set_id=only(matches,"screenshot size for "+locale)["id"]
                  ids=[attach_png(set_id,root/device/fn) for fn in files]
                  submitted[(locale,device)]=(set_id,set(ids))
                  print("Uploaded or located four screenshots:",locale,device,flush=True)
          for attempt in range(16):
              finished=0
              for (locale,device),(set_id,wanted) in submitted.items():
                  current={i["id"]:asset_state(i) for i in rows("appScreenshotSets/"+set_id+"/appScreenshots",{"limit":50}) if i["id"] in wanted}
                  if set(current)!=wanted: continue
                  if "FAILED" in current.values(): raise RuntimeError("A screenshot failed in "+locale+" "+device)
                  if set(current.values())=={"COMPLETE"}: finished+=1
              if finished==len(submitted): break
              time.sleep(8)
          else:
              raise RuntimeError("Some uploaded screenshots are still processing.")
          print("VERIFIED SCREENSHOTS: four iPhone and four iPad screenshots in each of en-US and en-CA.",flush=True)
          current=apple("GET","apps/"+app_id,params={"fields[apps]":"primaryLocale"})["data"]["attributes"]["primaryLocale"]
          if current!=LOCALE:
              try:
                  reply=apple("PATCH","apps/"+app_id,data={**link("apps",app_id),"attributes":{"primaryLocale":LOCALE}})
                  print("Primary update after independent screenshots:",reply["data"]["attributes"].get("primaryLocale"),flush=True)
              except AppleError as error:
                  print("Primary update after independent screenshots:",error,flush=True)
          for i in range(3):
              current=apple("GET","apps/"+app_id,params={"fields[apps]":"primaryLocale"})["data"]["attributes"]["primaryLocale"]
              if current==LOCALE:break
              if i<2:time.sleep(8)
          print("VERIFIED PRIMARY LOCALE AFTER SCREENSHOTS:",current,flush=True)
          PY

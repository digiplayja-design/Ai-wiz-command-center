workflows:
  korlix-ios-testflight:
    name: Korlix AI iOS TestFlight
    instance_type: mac_mini_m2
    max_build_duration: 60

    integrations:
      app_store_connect: Codemagic Korlix AI

    environment:
      flutter: stable
      xcode: latest
      cocoapods: default
      ios_signing:
        provisioning_profiles:
          - KORLIX_APP_STORE_PROFILE
        certificates:
          - KORLIX_APP_STORE_CERT

    scripts:
      - name: Show project files
        script: |
          pwd
          ls -la
          ls -la ios
          find ios/Runner.xcodeproj -name "*.xcscheme" -print || true

      - name: Flutter pub get
        script: |
          flutter pub get

      - name: Install CocoaPods
        script: |
          cd ios
          pod install --repo-update
          cd ..

      - name: Apply iOS code signing
        script: |
          xcode-project use-profiles

      - name: Build iOS IPA
        script: |
          set -e

          echo "Building IPA..."
          VERSION_LINE="$(grep '^version:' pubspec.yaml | awk '{print $2}')"
          BUILD_NAME="${VERSION_LINE%%+*}"
          BUILD_NUMBER="${VERSION_LINE##*+}"
          echo "Building IPA version $BUILD_NAME ($BUILD_NUMBER)..."
          flutter build ipa --release --build-name="$BUILD_NAME" --build-number="$BUILD_NUMBER" --export-options-plist=/Users/builder/export_options.plist
          echo ""
          echo "Searching for generated IPA files..."
          find build -type f -name "*.ipa" -print || true

          mkdir -p artifacts

          IPA_PATH="$(find build -type f -name "*.ipa" | head -n 1 || true)"

          if [ -z "$IPA_PATH" ]; then
            echo "ERROR: No IPA file was created."
            echo ""
            echo "Debugging build/ios contents:"
            find build/ios -maxdepth 5 -type f -print || true
            exit 1
          fi

          echo "Found IPA: $IPA_PATH"
          cp "$IPA_PATH" artifacts/KorlixAI.ipa

          echo ""
          echo "Final artifacts folder:"
          ls -lah artifacts

    artifacts:
      - artifacts/*.ipa
      - /tmp/xcodebuild_logs/*.log
      - flutter_drive.log

    publishing:
      app_store_connect:
        auth: integration
        submit_to_testflight: true
        submit_to_app_store: false

  android-release:
    name: Android Release AAB
    max_build_duration: 120
    instance_type: linux_x2
    environment:
      flutter: stable
    scripts:
      - name: Install Android SDK 36
        script: |
          SDKMANAGER=""
          if command -v sdkmanager >/dev/null 2>&1; then
            SDKMANAGER="$(command -v sdkmanager)"
          elif [ -x "$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager" ]; then
            SDKMANAGER="$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager"
          elif [ -x "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" ]; then
            SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          fi

          if [ -n "$SDKMANAGER" ]; then
            yes | "$SDKMANAGER" "platforms;android-36" "build-tools;36.0.0" || true
          else
            echo "sdkmanager not found; continuing with installed Android SDKs"
          fi
      - name: Show project files
        script: |
          pwd
          ls -la
          grep '^version:' pubspec.yaml
      - name: Flutter pub get
        script: |
          flutter pub get
      - name: Force Flutter plugin compileSdk 36
        script: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          roots = [
              Path.home() / ".pub-cache",
              Path("/Users/builder/.pub-cache"),
              Path("/root/.pub-cache"),
          ]

          patterns = [
              (r"(?m)^(\s*)compileSdk\s*=\s*(?:flutter\.compileSdkVersion|\d+)\s*$", r"\1compileSdk = 36"),
              (r"(?m)^(\s*)compileSdk\s+(?:flutter\.compileSdkVersion|\d+)\s*$", r"\1compileSdk 36"),
              (r"(?m)^(\s*)compileSdkVersion\s+(?:flutter\.compileSdkVersion|\d+)\s*$", r"\1compileSdkVersion 36"),
              (r"(?m)^(\s*)compileSdkVersion\s*\((?:flutter\.compileSdkVersion|\d+)\)\s*$", r"\1compileSdk = 36"),
          ]

          patched = 0

          for root in roots:
              if not root.exists():
                  continue

              for file in root.rglob("build.gradle*"):
                  path_text = str(file)
                  if "/android/" not in path_text and "\\android\\" not in path_text:
                      continue

                  try:
                      text = file.read_text()
                  except Exception:
                      continue

                  original = text

                  for pattern, replacement in patterns:
                      text = re.sub(pattern, replacement, text)

                  if text != original:
                      file.write_text(text)
                      patched += 1
                      print(f"patched {file}")

          print(f"Flutter plugin Gradle files patched: {patched}")
          PY

      - name: Analyze Flutter
        script: |
          flutter analyze
      - name: Build Android App Bundle
        script: |
          VERSION_LINE="$(grep '^version:' pubspec.yaml | awk '{print $2}')"
          BUILD_NAME="${VERSION_LINE%%+*}"
          BUILD_NUMBER="${VERSION_LINE##*+}"
          echo "Building Android AAB version $BUILD_NAME ($BUILD_NUMBER)..."
          flutter build appbundle --release --build-name="$BUILD_NAME" --build-number="$BUILD_NUMBER"
          mkdir -p artifacts
          cp build/app/outputs/bundle/release/app-release.aab artifacts/KorlixAI.aab
          echo "Android artifacts:"
          ls -lah artifacts
    artifacts:
      - artifacts/*.aab

  fax-ios-testflight:
    name: Fax by Korlix internal TestFlight
    instance_type: mac_mini_m2
    max_build_duration: 60
    working_directory: apps/fax
    integrations:
      app_store_connect: Codemagic Korlix AI
    environment:
      node: 24
      xcode: latest
      ios_signing:
        # Codemagic imports the existing team certificate alongside a stored profile.
        # Only the exact fax profile selected below is applied to the target.
        certificates:
          - KORLIX_APP_STORE_CERT
        provisioning_profiles:
          - KORLIX_APP_STORE_PROFILE
    scripts:
      - name: Install the fax app identifier and distribution profile
        script: python3 ios/prepare-profile.py
      - name: Prepare iPhone and iPad app
        script: npm ci && npm run web && npx cap sync ios
      - name: Build with the fax provisioning profile
        script: |
          cd ios/App
          xcode-project use-profiles --project App.xcodeproj --profile ../fax.mobileprovision
          xcode-project build-ipa --project App.xcodeproj --scheme App --ipa-directory "$CM_BUILD_DIR/apps/fax/artifacts"
      - name: Upload to internal TestFlight when the App Store Connect record exists
        script: |
          set -euo pipefail
          records=$(app-store-connect apps list --bundle-id-identifier com.korlixdeveloper.fax --strict-match-identifier --json --log-stream stderr)
          if python3 -c 'import json,sys; sys.exit(0 if len(json.load(sys.stdin)) == 1 else 1)' <<< "$records"; then
            app-store-connect publish --path artifacts/*.ipa
          else
            echo "The signed IPA is available. Create the Fax by Korlix record in App Store Connect before uploading."
          fi
    artifacts:
      - $CM_BUILD_DIR/apps/fax/artifacts/*.ipa

  fax-android-candidate:
    name: Fax by Korlix signed Play bundle
    instance_type: linux_x2
    max_build_duration: 60
    working_directory: apps/fax
    environment:
      node: 24
      java: 21
      android_signing:
        - KORLIX_FAX_UPLOAD_KEY
    scripts:
      - name: Prepare Android files
        script: npm ci && npm run web && npx cap sync android
      - name: Build and check signed upload bundle
        script: |
          set -eu
          test -f "$CM_KEYSTORE_PATH"
          cd android
          ./gradlew --no-daemon :app:bundleRelease
          jarsigner -verify app/build/outputs/bundle/release/app-release.aab
          keytool -printcert -jarfile app/build/outputs/bundle/release/app-release.aab > /dev/null
    artifacts:
      - $CM_BUILD_DIR/apps/fax/android/app/build/outputs/bundle/release/*.aab

  fax-us-listing-and-internal-test:
    name: Verify Fax primary language and private tester access
    instance_type: mac_mini_m2
    max_build_duration: 15
    triggering:
      events:
        - push
      branch_patterns:
        - pattern: feature/fax-mobile-20261125
          include: true
          source: true
    when:
      condition: event.before == "31691636fa72facc46deec4d0e556db65d39fefc"
    integrations:
      app_store_connect: Codemagic Korlix AI
    environment:
      groups:
        - fax_testflight
    scripts:
      - name: Load the Apple release tools
        script: |
          set -euo pipefail
          python3 -m venv "$CM_BUILD_DIR/.fax-lookup"
          (
            unset APP_STORE_CONNECT_KEY_IDENTIFIER APP_STORE_CONNECT_ISSUER_ID APP_STORE_CONNECT_PRIVATE_KEY FAX_TESTFLIGHT_TESTER_EMAIL
            "$CM_BUILD_DIR/.fax-lookup/bin/python" -m pip install --quiet --disable-pip-version-check 'codemagic-cli-tools==0.69.0'
          )
      - name: Verify the primary language and assign the Fax tester
        script: |
          set -euo pipefail
          "$CM_BUILD_DIR/.fax-lookup/bin/python" - <<'PY'
          import os
          import sys
          import time

          import requests
          from codemagic.apple.app_store_connect import AppStoreConnectApiClient
          from codemagic.tools.app_store_connect.arguments import Types

          BUNDLE = "com.korlixdeveloper.fax"
          LOCALE = "en-US"
          GROUP = "Fax by Korlix Internal"
          RELEASE_COPY = {"APP NAME":"Fax by Korlix","SUBTITLE":"Scan, send and track faxes","PRIVACY POLICY URL":"https://uxtjzjbwtppjvnsoiijv.supabase.co/functions/v1/korlix-fax/privacy","DESCRIPTION":"Send and receive faxes from your own Korlix workspace. Scan paper with the camera or choose a PDF, review the pages, and confirm the destination fax number before sending.\n\nYour Inbox and Sent folders keep documents and delivery receipts together. Save frequently used recipients, check the carrier’s delivery status, and download a receipt when you need a record. Monthly activity shows sent and received page counts and lets you export a CSV.\n\nSign in with your Korlix account or create one in the app. You can request a U.S. local or toll-free fax number. Requesting a number is free. Live fax service begins after Korlix activates your line.\n\nTo explore the app before requesting service, tap “Explore a sample workspace” on the sign-in screen. The sample includes fictional documents and simulates fax delivery on your device.","SUPPORT URL":"https://www.korlixdeveloper.com/support.html","KEYWORDS":"fax,pdf,scanner,document,mailbox,receipt,delivery,send,receive,business,scan"}
          recipient = os.environ["FAX_TESTFLIGHT_TESTER_EMAIL"].strip().casefold()
          if not recipient or "@" not in recipient:
              raise SystemExit("Private tester configuration is missing.")

          def configured(argument):
              return argument.from_environment_variable_default().value

          client = AppStoreConnectApiClient(
              key_identifier=configured(Types.KeyIdentifierArgument),
              issuer_id=configured(Types.IssuerIdArgument),
              private_key=configured(Types.PrivateKeyArgument),
              log_requests=False, enable_jwt_cache=False,
          )

          class AppleError(Exception):
              def __init__(self, response):
                  self.status = response.status_code
                  try:
                      errors = response.json().get("errors", [])
                  except ValueError:
                      errors = []
                  details = " | ".join(row.get("code", "") + " " + row.get("detail", "") for row in errors)
                  super().__init__(f"Apple HTTP {self.status}: " + details.replace(recipient, "[private tester]")[:800])

          def apple(method, path, *, params=None, data=None):
              response = requests.request(method, "https://api.appstoreconnect.apple.com/v1/" + path,
                                          headers=client.generate_auth_headers(), params=params,
                                          json={"data":data} if data is not None else None,
                                          allow_redirects=False, timeout=35)
              if not (200 <= response.status_code < 300):
                  raise AppleError(response)
              if not response.content:
                  return {}
              return response.json()

          def link(kind, item):
              return {"type":kind, "id":item}

          def rel(kind, item):
              return {"data":link(kind, item)}

          def rows(path, params=None):
              result = apple("GET", path, params=params)
              if result.get("links", {}).get("next"):
                  raise RuntimeError("The expected result set was larger than one page.")
              return result["data"]

          def only(values, label):
              if len(values) != 1:
                  raise RuntimeError(f"Expected one {label}, found {len(values)}.")
              return values[0]

          def ensure_localization(parent, parent_type, collection, attributes):
              endpoint = f"{parent_type}/{parent}/{collection}"
              localizations = rows(endpoint, {"limit":50})
              existing = [item for item in localizations if item["attributes"]["locale"] == LOCALE]
              if existing:
                  record = only(existing, collection)
                  missing = {k:v for k,v in attributes.items() if not record["attributes"].get(k)}
                  if missing:
                      apple("PATCH", f"{collection}/{record['id']}", data={**link(collection, record["id"]), "attributes":missing})
              else:
                  relationship = {"appInfos":"appInfo","appStoreVersions":"appStoreVersion"}[parent_type]
                  apple("POST", collection, data={"type":collection, "attributes":{"locale":LOCALE, **attributes},
                        "relationships":{relationship:rel(parent_type,parent)}})
              confirmed = only([item for item in rows(endpoint, {"limit":50}) if item["attributes"]["locale"] == LOCALE], collection)
              print(f"Verified {LOCALE} {collection}; saved fields: " + ", ".join(k for k in attributes if confirmed["attributes"].get(k)), flush=True)

          apps = rows("apps", {"filter[bundleId]":BUNDLE, "fields[apps]":"bundleId,name,primaryLocale", "limit":2})
          app = only([item for item in apps if item["attributes"]["bundleId"] == BUNDLE], "Fax record")
          app_id = app["id"]
          print("Confirmed Fax record", app_id, "with initial primary locale", app["attributes"]["primaryLocale"], flush=True)
          versions = rows(f"apps/{app_id}/appStoreVersions", {"filter[platform]":"IOS","limit":50})
          drafts = [item for item in versions if item["attributes"]["versionString"] in {"1.0","1.0.0"}
                    and (item["attributes"].get("appStoreState") or item["attributes"].get("appVersionState"))
                    in {"PREPARE_FOR_SUBMISSION","DEVELOPER_REJECTED","METADATA_REJECTED","REJECTED"}]

          def live_build():
              for attempt in range(30):
                  page = apple("GET", "builds", params={"filter[app]":app_id, "filter[version]":"2","include":"preReleaseVersion",
                                                      "limit":50})
                  trains = {item["id"] for item in page.get("included", []) if item["type"] == "preReleaseVersions"
                            and item["attributes"].get("version") == "1.0.0" and item["attributes"].get("platform") == "IOS"}
                  matches = [item for item in page["data"]
                             if (item["relationships"].get("preReleaseVersion",{}).get("data") or {}).get("id") in trains]
                  if matches:
                      build = only(matches, "iOS 1.0.0 (2) build")
                      state = build["attributes"]["processingState"]
                      if state == "VALID" and not build["attributes"]["expired"]:
                          return build
                      if state in {"FAILED","INVALID"} or build["attributes"]["expired"]:
                          raise RuntimeError("Build unavailable: "+state)
                  if attempt == 0:
                      print("Waiting for Apple to process iOS 1.0.0 (2).",flush=True)
                  time.sleep(15)
              raise RuntimeError("Apple has not listed an unexpired processed build 2.")


          CONFIRMED_EXEMPT = False
          from urllib.parse import urlsplit, parse_qsl
          import re

          def all_rows(path, params=None):
              params = dict(params or {})
              params.setdefault("limit", 200)
              result = []
              for _ in range(30):
                  page = apple("GET",path,params=params)
                  result.extend(page["data"])
                  next_url = page.get("links",{}).get("next")
                  if not next_url:
                      return result
                  u = urlsplit(next_url)
                  if u.scheme != "https" or u.netloc != "api.appstoreconnect.apple.com" or u.path != "/v1/"+path:
                      raise RuntimeError("Unexpected Apple pagination destination.")
                  params = dict(parse_qsl(u.query))
              raise RuntimeError("Apple pagination exceeded the expected result set.")

          def app_state():
              return apple("GET", "apps/"+app_id, params={"fields[apps]":"name,bundleId,primaryLocale"})["data"]["attributes"]["primaryLocale"]

          def language():
              locale = app_state()
              print("Apple primary language on a new request:",locale, flush=True)
              if locale != LOCALE:
                  try:
                      reply=apple("PATCH","apps/"+app_id, data={**link("apps",app_id), "attributes":{"primaryLocale":LOCALE}})
                      print("Apple update returned primaryLocale:", reply.get("data",{}).get("attributes",{}).get("primaryLocale"), flush=True)
                  except AppleError as error:
                      print("Primary language update:", error, flush=True)
              print("VERSION LOCALIZATION AND SCREENSHOTS:",flush=True)
              for d in drafts:
                  for loc in all_rows("appStoreVersions/"+d["id"]+"/appStoreVersionLocalizations",{"fields[appStoreVersionLocalizations]":"locale"}):
                      sets=all_rows("appStoreVersionLocalizations/"+loc["id"]+"/appScreenshotSets", {"fields[appScreenshotSets]":"screenshotDisplayType"})
                      print(loc["attributes"]["locale"], [i["attributes"]["screenshotDisplayType"] for i in sets], flush=True)

          def setup_test(build):
              bid=build["id"]
              detail=lambda: apple("GET","builds/"+bid+"/buildBetaDetail")["data"]["attributes"].get("internalBuildState")
              print("VERIFIED BUILD:",bid,"processing",build["attributes"].get("processingState"),"internal",detail(),flush=True)
              if CONFIRMED_EXEMPT and build["attributes"].get("usesNonExemptEncryption") is None:
                  apple("PATCH","builds/"+bid,data={**link("builds",bid),"attributes":{"usesNonExemptEncryption":False}})
                  flag=apple("GET","builds/"+bid,params={"fields[builds]":"usesNonExemptEncryption"})["data"]["attributes"].get("usesNonExemptEncryption")
                  print("Confirmed export declaration saved:", flag is False, flush=True)
              if drafts:
                  did=only(drafts,"initial iOS draft")["id"]
                  try:
                      try:
                          old=apple("GET",f"appStoreVersions/{did}/relationships/build")["data"]
                      except AppleError as error:
                          if error.status != 404: raise
                          old=None
                      if not old:
                          apple("PATCH",f"appStoreVersions/{did}/relationships/build",data=link("builds",bid))
                      selected=apple("GET",f"appStoreVersions/{did}/relationships/build")["data"]
                      print("Verified build 2 selected on the draft:",bool(selected and selected["id"]==bid),flush=True)
                  except AppleError as error:
                      print("Draft build selection:",error,flush=True)

              users=all_rows("users",{"filter[username]":recipient,"fields[users]":"username,roles,allAppsVisible,firstName,lastName"})
              user=only([u for u in users if u["attributes"]["username"].casefold()==recipient],"requested Korlix user")
              eligible={"ACCOUNT_HOLDER","ADMIN","APP_MANAGER","DEVELOPER","MARKETING"}.intersection(user["attributes"]["roles"])
              if not eligible or not user["attributes"].get("allAppsVisible"):
                  raise RuntimeError("Expected an eligible internal tester with current app access.")
              groups=[i for i in all_rows(f"apps/{app_id}/betaGroups") if i["attributes"].get("name")==GROUP]
              if not groups:
                  groups=[apple("POST","betaGroups",data={"type":"betaGroups","attributes":{"name":GROUP,"isInternalGroup":True,"hasAccessToAllBuilds":False},"relationships":{"app":rel("apps",app_id)}})["data"]]
              group=only(groups,"named Fax beta group")
              if group["attributes"].get("isInternalGroup") is not True or group["attributes"].get("publicLinkEnabled"):
                  raise RuntimeError("The named group is not a private internal group.")
              gid=group["id"]
              gp="betaGroups/"+gid
              def members():
                  return all_rows(gp+"/betaTesters",{"fields[betaTesters]":"email,state"})
              def variants():
                  group_members=members()
                  if any(t["attributes"].get("email","").casefold()!=recipient for t in group_members):
                      raise RuntimeError("Unexpected additional users in the dedicated group.")
                  return group_members
              was_member=bool(variants())
              build_ids=lambda: {b["id"] for b in all_rows(gp+"/relationships/builds")}
              if bid not in build_ids():
                  try:
                      apple("POST",gp+"/relationships/builds",data=[link("builds",bid)])
                  except AppleError as error:
                      print("Adding build to the internal group:",error,flush=True)
              if not was_member:
                  exact=[t for t in all_rows("betaTesters",{"filter[email]":recipient,"fields[betaTesters]":"email"}) if t["attributes"].get("email","").casefold()==recipient]
                  ids={t["id"] for t in exact}
                  scoped={t["id"] for t in all_rows("betaTesters",{"filter[email]":recipient,"filter[apps]":app_id,"fields[betaTesters]":"email"}) if t["attributes"].get("email","").casefold()==recipient}
                  candidates=scoped or ({user["id"]} & ids) or ids
                  print("Exact tester profiles:",len(ids),"associated with Fax:",len(scoped),flush=True)
                  if len(candidates)>1:
                      in_internal={t for t in candidates if any(i["attributes"].get("isInternalGroup") for i in all_rows(f"betaTesters/{t}/betaGroups",{"fields[betaGroups]":"isInternalGroup"}))}
                      if len(in_internal)==1: candidates=in_internal
                  if len(candidates)==1:
                      tester=next(iter(candidates))
                      try:
                          apple("POST",gp+"/relationships/betaTesters",data=[link("betaTesters",tester)])
                      except AppleError as error:
                          print("Linking the internal tester:",error,flush=True)
                  if not variants():
                      at=user["attributes"]
                      target={"type":"betaTesters","attributes":{"email":recipient,"firstName":at["firstName"],"lastName":at["lastName"]},"relationships":{"betaGroups":{"data":[link("betaGroups",gid)]}}}
                      try:
                          apple("POST","betaTesters",data=target)
                      except AppleError as error:
                          print("Inviting the exact user to the internal group:",error,flush=True)
              people=variants()
              build_assigned=bid in build_ids()
              if people:
                  states=", ".join(sorted({str(p["attributes"].get("state")) for p in people}))
                  print("VERIFIED REQUESTED TESTER IN GROUP: yes; Apple tester state:",states,flush=True)
              else:
                  print("VERIFIED REQUESTED TESTER IN GROUP: no",flush=True)
              print("VERIFIED BUILD 2 IN INTERNAL GROUP:",build_assigned,"internal state",detail(),flush=True)
              if people and build_assigned and detail() in {"IN_BETA_TESTING","READY_FOR_BETA_TESTING"} and (was_member or not any(t["attributes"].get("state") in {"INVITED","ACCEPTED","INSTALLED"} for t in people)):
                  try:
                      apple("POST","betaTesterInvitations",data={"type":"betaTesterInvitations","relationships":{"app":rel("apps",app_id),"betaTester":rel("betaTesters",people[0]["id"])}})
                      print("Apple accepted an invitation email request for the designated tester.",flush=True)
                  except AppleError as error:
                      print("Sending the TestFlight email:",error,flush=True)

          try:
              language()
          except (AppleError, RuntimeError, KeyError) as error:
              print("Language result:",error,flush=True)
          try:
              setup_test(live_build())
          except (AppleError, RuntimeError, KeyError) as error:
              print("Private testing result:",error,flush=True)
          try:
              av=apple("GET",f"apps/{app_id}/appAvailabilityV2")["data"]
              print("Existing app availability configuration:", bool(av),"automatic new territories:",av.get("attributes",{}).get("availableInNewTerritories"),flush=True)
          except AppleError as error:
              print("Current store availability:",error,flush=True)
          for attempt in range(3):
              primary=app_state()
              print("VERIFIED PRIMARY LANGUAGE:",primary,flush=True)
              if primary==LOCALE: break
              if attempt<2: time.sleep(5)
          PY

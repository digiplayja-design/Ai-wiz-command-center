workflows:
  korlix-ios-testflight:
    name: Korlix AI iOS TestFlight
    instance_type: mac_mini_m2
    max_build_duration: 60

    integrations:
      app_store_connect: Codemagic Korlix AI

    environment:
      flutter: stable
      xcode: latest
      cocoapods: default
      ios_signing:
        provisioning_profiles:
          - KORLIX_APP_STORE_PROFILE
        certificates:
          - KORLIX_APP_STORE_CERT

    scripts:
      - name: Show project files
        script: |
          pwd
          ls -la
          ls -la ios
          find ios/Runner.xcodeproj -name "*.xcscheme" -print || true

      - name: Flutter pub get
        script: |
          flutter pub get

      - name: Install CocoaPods
        script: |
          cd ios
          pod install
          cd ..

      - name: Apply iOS code signing
        script: |
          xcode-project use-profiles

      - name: Build iOS IPA
        script: |
          flutter build ipa --release

    artifacts:
      - build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log
      - flutter_drive.log

    publishing:
      app_store_connect:
        auth: integration
        submit_to_testflight: true
        submit_to_app_store: false

workflows:
  korlix-ios-testflight:
    name: Korlix AI iOS TestFlight
    instance_type: mac_mini_m2
    max_build_duration: 60

    integrations:
      app_store_connect: Codemagic Korlix AI

    environment:
      flutter: stable
      xcode: latest
      cocoapods: default
      ios_signing:
        provisioning_profiles:
          - KORLIX_APP_STORE_PROFILE
        certificates:
          - KORLIX_APP_STORE_CERT

    scripts:
      - name: Show project files
        script: |
          pwd
          ls -la
          ls -la ios
          find ios/Runner.xcodeproj -name "*.xcscheme" -print || true

      - name: Flutter pub get
        script: |
          flutter pub get

      - name: Install CocoaPods
        script: |
          cd ios
          pod install --repo-update
          cd ..

      - name: Apply iOS code signing
        script: |
          xcode-project use-profiles

      - name: Build iOS IPA
        script: |
          set -e

          echo "Building IPA..."
          flutter build ipa --release --export-options-plist=/Users/builder/export_options.plist

          echo ""
          echo "Searching for generated IPA files..."
          find build -type f -name "*.ipa" -print || true

          mkdir -p artifacts

          IPA_PATH="$(find build -type f -name "*.ipa" | head -n 1 || true)"

          if [ -z "$IPA_PATH" ]; then
            echo "ERROR: No IPA file was created."
            echo ""
            echo "Debugging build/ios contents:"
            find build/ios -maxdepth 5 -type f -print || true
            exit 1
          fi

          echo "Found IPA: $IPA_PATH"
          cp "$IPA_PATH" artifacts/KorlixAI.ipa

          echo ""
          echo "Final artifacts folder:"
          ls -lah artifacts

    artifacts:
      - artifacts/*.ipa
      - /tmp/xcodebuild_logs/*.log
      - flutter_drive.log

    publishing:
      app_store_connect:
        auth: integration
        submit_to_testflight: true
        submit_to_app_store: false

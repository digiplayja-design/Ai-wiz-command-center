workflows:
  korlix-copybox-apple-status:
    name: KORLIX COPY Box — read-only Apple release status
    instance_type: mac_mini_m2
    max_build_duration: 10
    integrations:
      app_store_connect: Codemagic Korlix AI
    # Manual only. Existing managed integration; no signing or publishing.
    # Only app-scoped GETs. No credentials, contact values or tester identities
    # are written to logs or artifacts. The report is not a release approval.
    scripts:
      - name: Check read-only scope and private-data filtering
        script: |
          set -euo pipefail
          python3 -B -m unittest discover -s scripts/tests -p 'test_read_copybox_apple_status.py' -v
      - name: Read COPY Box release status through the existing integration
        script: |
          set -euo pipefail
          python3 -m venv "$CM_BUILD_DIR/.copybox-apple-status-tools"
          "$CM_BUILD_DIR/.copybox-apple-status-tools/bin/pip" install 'codemagic-cli-tools==0.69.0'
          "$CM_BUILD_DIR/.copybox-apple-status-tools/bin/python" scripts/read_copybox_apple_status.py
    artifacts:
      - artifacts/copybox-apple-status.json

  korlix-copybox-reviewer-acceptance:
    name: KORLIX COPY Box — bounded reviewer API acceptance
    instance_type: mac_mini_m2
    max_build_duration: 10
    integrations:
      app_store_connect: Codemagic Korlix AI
    # Manual only. Uses the existing saved dedicated review account in memory.
    # One synthetic rewrite, followed by sign-out of only its fresh session.
    # No secret, account profile, or generated text is logged or exported.
    scripts:
      - name: Verify scope, request limits, secret filtering, and cleanup
        script: |
          set -euo pipefail
          python3 -B -m unittest discover -s scripts/tests -p 'test_read_copybox_apple_status.py' -v
          python3 -B -m unittest discover -s scripts/tests -p 'test_check_copybox_reviewer_acceptance.py' -v
      - name: Exercise the saved COPY Box reviewer account once
        script: |
          set -euo pipefail
          python3 -m venv "$CM_BUILD_DIR/.copybox-reviewer-acceptance-tools"
          "$CM_BUILD_DIR/.copybox-reviewer-acceptance-tools/bin/pip" install 'codemagic-cli-tools==0.69.0'
          "$CM_BUILD_DIR/.copybox-reviewer-acceptance-tools/bin/python" scripts/check_copybox_reviewer_acceptance.py --run-once
    artifacts:
      - artifacts/copybox-reviewer-acceptance.json

  korlix-copybox-native-ios-acceptance:
    name: KORLIX COPY Box — native iOS guest acceptance
    instance_type: mac_mini_m2
    max_build_duration: 45
    working_directory: apps/korlix_copy_box
    environment:
      flutter: 3.47.7
      xcode: 26.6
      cocoapods: default
    scripts:
      - name: Run actual iOS guest app and verify a fresh-process restore
        script: |
          set -euo pipefail
          python3 "$CM_BUILD_DIR/scripts/ci/run_copybox_native_acceptance.py" ios
        test_report: artifacts/native-acceptance/report-*.json
    artifacts:
      - $CM_BUILD_DIR/apps/korlix_copy_box/artifacts/native-acceptance/*
      - /tmp/xcodebuild_logs/*.log

  korlix-copybox-complete-apple-age-rating:
    name: KORLIX COPY Box — complete reviewed Apple age declaration
    instance_type: mac_mini_m2
    max_build_duration: 10
    integrations:
      app_store_connect: Codemagic Korlix AI
    environment:
      vars:
        COPYBOX_RUN_REVIEWER_ACCEPTANCE: "false"
    # Manual only. The CopyBox output boundary is already verified live at
    # a8a416fa77eac0a25236e72cc3828f1a5ccf96cf. Managed Apple auth stays in memory.
    # Only the exact age declaration can be patched; no app submission,
    # release mode, build selection, pricing or publishing action is configured.
    scripts:
      - name: Verify identity guards, age-only mutations, ratings, and secret filtering
        script: |
          set -euo pipefail
          python3 -B -m unittest discover -s scripts/tests -p 'test_read_copybox_apple_status.py' -v
          python3 -B -m unittest discover -s scripts/tests -p 'test_complete_copybox_apple_age_rating.py' -v
          python3 -B -m unittest discover -s scripts/tests -p 'test_check_copybox_reviewer_acceptance.py' -v
      - name: Prepare existing managed Apple integration tooling
        script: |
          set -euo pipefail
          python3 -m venv "$CM_BUILD_DIR/.copybox-apple-age-tools"
          "$CM_BUILD_DIR/.copybox-apple-age-tools/bin/pip" install 'codemagic-cli-tools==0.69.0'
      - name: Optionally rerun the existing bounded reviewer API acceptance
        script: |
          set -euo pipefail
          case "${COPYBOX_RUN_REVIEWER_ACCEPTANCE:-false}" in
            true)
              "$CM_BUILD_DIR/.copybox-apple-age-tools/bin/python" scripts/check_copybox_reviewer_acceptance.py --run-once
              ;;
            false)
              echo "Existing reviewer acceptance rerun is not selected."
              ;;
            *)
              echo "COPYBOX_RUN_REVIEWER_ACCEPTANCE must be true or false." >&2
              exit 2
              ;;
          esac
      - name: Complete only the reviewed COPY Box age declaration
        script: |
          set -euo pipefail
          "$CM_BUILD_DIR/.copybox-apple-age-tools/bin/python" scripts/complete_copybox_apple_age_rating.py --apply-reviewed
    artifacts:
      - artifacts/copybox-apple-age-completion.json
      - artifacts/copybox-reviewer-acceptance.json

  korlix-copybox-select-apple-build:
    name: KORLIX COPY Box — select verified uploaded iOS build
    instance_type: mac_mini_m2
    max_build_duration: 10
    integrations:
      app_store_connect: Codemagic Korlix AI
    environment:
      vars:
        # Set from the successful signed upload report before starting this workflow.
        COPYBOX_EXPECTED_BUILD_NUMBER: "2"
    # Manual only. No reviewer generation, upload, publishing or review submission.
    # One exact version/build relationship PATCH at most; readback is mandatory.
    scripts:
      - name: Check build identity, selection guards, and idempotence
        script: |
          set -euo pipefail
          python3 -B -m unittest discover -s scripts/tests -p 'test_select_copybox_apple_build.py' -v
      - name: Select the confirmed uploaded build using the existing Apple integration
        script: |
          set -euo pipefail
          : "${COPYBOX_EXPECTED_BUILD_NUMBER:?Set the confirmed uploaded CopyBox build number}"
          python3 -m venv "$CM_BUILD_DIR/.copybox-apple-build-tools"
          "$CM_BUILD_DIR/.copybox-apple-build-tools/bin/pip" install 'codemagic-cli-tools==0.69.0'
          "$CM_BUILD_DIR/.copybox-apple-build-tools/bin/python" scripts/select_copybox_apple_build.py \
            --select-reviewed-build --build-number "$COPYBOX_EXPECTED_BUILD_NUMBER"
    artifacts:
      - artifacts/copybox-apple-build-selection.json


  korlix-copybox-sync-apple-metadata:
    name: KORLIX COPY Box — synchronize reviewed Apple description and notes
    instance_type: mac_mini_m2
    max_build_duration: 10
    integrations:
      app_store_connect: Codemagic Korlix AI
    # Manual only. Exact pinned description and review notes from app commit e25b4b57.
    # No contact/demo fields, build selection, reviewer calls or review submission.
    scripts:
      - name: Verify source hashes, field limits, scoped writes, and private-data exclusion
        script: |
          set -euo pipefail
          python3 -B -m unittest discover -s scripts/tests -p 'test_sync_copybox_apple_metadata.py' -v
      - name: Synchronize only the reviewed description and App Review notes
        script: |
          set -euo pipefail
          python3 -m venv "$CM_BUILD_DIR/.copybox-apple-metadata-tools"
          "$CM_BUILD_DIR/.copybox-apple-metadata-tools/bin/pip" install 'codemagic-cli-tools==0.69.0'
          "$CM_BUILD_DIR/.copybox-apple-metadata-tools/bin/python" scripts/sync_copybox_apple_metadata.py --apply-reviewed-metadata
    artifacts:
      - artifacts/copybox-apple-metadata-sync.json

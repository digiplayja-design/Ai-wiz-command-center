<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover"
    />
    <meta name="referrer" content="no-referrer" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; script-src 'self'; worker-src 'self' blob:; style-src 'self'; img-src 'self' data: blob:; font-src 'self' data:; connect-src 'self' blob: https://uxtjzjbwtppjvnsoiijv.supabase.co; object-src 'none'; base-uri 'self'; form-action 'self'"
    />
    <link rel="manifest" href="manifest.webmanifest" />
    <link rel="apple-touch-icon" href="korlix-teal-tiger-192.png" />
    <meta name="theme-color" content="#f8faf9" />
    <meta name="robots" content="noindex,nofollow,noarchive" />
    <meta
      name="description"
      content="Private Korlix company fax workspace."
    />
    <title>Korlix company fax</title>
    <link rel="icon" href="korlix-teal-tiger-192.png" />
    <link
      rel="preload"
      as="font"
      type="font/woff2"
      href="assets/inter.woff2"
      crossorigin
    />
    <link
      rel="preload"
      as="font"
      type="font/woff"
      href="assets/icons.woff"
      crossorigin
    />
    <link rel="stylesheet" href="assets/icons.css" />
    <link rel="stylesheet" href="ui.css" />
    <script type="module" src="app.js"></script>
  </head>
  <body>
    <header class="topbar" id="app-header" hidden>
      <div class="head-inner">
        <button
          class="brand"
          id="brand-home"
          aria-label="FAX Number by Korlix, home"
        >
          <img
            src="korlix-teal-tiger-192.png"
            width="44"
            height="44"
            alt=""
          /><span
            ><strong>FAX Number</strong><small>by Korlix</small></span
          ></button
        ><button
          class="icon-btn profile"
          id="account"
          aria-label="Your account"
        >
          <i aria-hidden="true" class="ic i-account-outline"></i>
        </button>
      </div>
    </header>
    <main id="screen" tabindex="-1" aria-label="Fax workspace">
      <p class="lead" role="status">Opening your fax workspace…</p>
    </main>
    <dialog id="sheet">
      <div class="sheet-top">
        <h2 id="sheet-title"></h2>
        <button id="sheet-close" class="icon-btn" aria-label="Close">
          <i aria-hidden="true" class="ic i-close"></i>
        </button>
      </div>
      <div id="sheet-content"></div>
    </dialog>
    <div id="toast" role="status" aria-live="polite"></div>
    <noscript>Enable JavaScript to open your fax workspace.</noscript>
  </body>
</html>
